# Kontaktor – Overvåking: eksempel på antall feil, tavlestatus, fellesfeil og samlet status
#
# Hører til blueprintene
#   blueprints/automation/kontaktor_overvaking.yaml
#   blueprints/automation/kontaktor_fellesfeil.yaml
# Installasjon steg for steg: README_kontaktor_installasjon.md
#
# Dette er et EKSEMPEL som må tilpasses anlegget: bytt ut entitetene merket
# «TILPASS» med anleggets egne feil-hjelpere og automasjoner, og lag én blokk per
# tavle. Navnene under er de som brukes på vtoppen for tappevann
# (README_kontaktor_overvaking.md, avsnitt 10.2). Bytt «Tappevann» med anlegget.
#
# Kjeden er:
#   Feil-hjelper per kontaktor + automasjonen PÅ/AV → Antall feil per tavle ─┐
#   Andre feil per tavle (f.eks. varmtvann, varmepumpe) ─────────────────────┼→ Status per tavle
#   Temperatur nå (lav, men ikke lenge nok til alarm) ───────────────────────┘
#   Status per tavle → Fellesfeil (varsling og påminnelse)
#                    → <Anlegg> - Status (farge på hjemsiden) + <Anlegg> - Status tekst
#   Fellesfeil årsak: kort tekst om hva som er feil, til Pushover (maks 255 tegn)
#
# Status per tavle og farge på dashbord og hjemside:
#   I drift          grønn
#   Under sjekk      gul   lav temperatur nå, men ikke lenge nok til alarm. Ingen varsel.
#   Avvik            gul   halvparten eller færre av berederne på tavla har feil
#   Problem          rød   flere enn halvparten av berederne har feil, eller en av andre feil er PÅ
#   Ikke overvåket   grå   ingen kontaktorer lagt inn
# Fellesfeil er PÅ ved Avvik eller Problem, eller når den overordnede roboten er AV.
# «Under sjekk» gir altså ingen Pushover.
#
# En kontaktor teller som feil når feil-hjelperen er PÅ, eller når automasjonen
# for kontaktoren er AV (da overvåkes den ikke).
#
# Andre feil (valgfritt): andre feil på tavla enn kontaktorene, f.eks. kaldt
# varmtvann eller varmepumpe som ikke leverer varme. Det er binary_sensor-er med
# forsinkelse (se eksemplene nederst). De gjør tavla til «Problem» (og dermed
# Fellesfeil PÅ), står i Fellesfeil årsak, og legges i «Andre feil» i den
# overordnede roboten (Kontaktor - Fellesfeil varsel), som varsler dem.
# Tom liste [] = ingen andre feil på tavla.
#
# Grensene for «Under sjekk» (lav) skal være de samme som i andre feil, men uten
# forsinkelse. Endres en grense, må den endres begge steder (og i Status tekst).
#
# Bruk:
#   1. Kopier filen til /config/packages/ og tilpass den.
#   2. Sørg for at packages er aktivert i configuration.yaml:
#        homeassistant:
#          packages: !include_dir_named packages
#   3. Start Home Assistant på nytt.
#
# De samme sensorene kan også lages som mal-hjelpere i brukergrensesnittet
# (Innstillinger → Enheter og tjenester → Hjelpere → Mal), med de samme malene.
# Det er gjort slik på vtoppen.
#
# Versjon: 2026.11.06

template:
  - sensor:
      # --- Én per tavle: antall kontaktorer med feil -----------------------
      # Listen er [feil-hjelper, automasjon] for hver kontaktor på tavla.
      # Tom liste = ingen kontaktorer overvåkes ennå → «unknown» (vises som
      # «Ikke overvåket» i tavlestatus).
      - name: "Tappevann - RS50-54 Antall feil"
        unique_id: tappevann_rs50_54_antall_feil
        icon: mdi:bell-alert
        state: >-
          {% set kontaktorer = [
            ['input_boolean.tavle_rs52_vvb_xk1_rs52_434_002_xo01_1_feil', 'automation.tavle_rs52_vvb_xk1_rs52_434_002_xo01_1_robot'],
          ] %}                                                           {# TILPASS: alle kontaktorene på tavla #}
          {% if kontaktorer | count == 0 %}
            {{ none }}
          {% else %}
            {% set ns = namespace(n=0) %}
            {% for feil, auto in kontaktorer %}
              {% if is_state(feil, 'on') or not is_state(auto, 'on') %}{% set ns.n = ns.n + 1 %}{% endif %}
            {% endfor %}
            {{ ns.n }}
          {% endif %}

      # --- Én per tavle: I drift / Under sjekk / Avvik / Problem / Ikke overvåket
      # Se fargene øverst i fila.
      - name: "Tappevann - RS50-54 Status"
        unique_id: tappevann_rs50_54_status
        icon: mdi:water-boiler
        state: >-
          {% set alarmer = [
            'binary_sensor.tappevann_rs50_54_varmtvann_feil',
            'binary_sensor.tappevann_rs50_54_varmepumpe_feil',
          ] %}                                                           {# TILPASS: andre feil på tavla, eller [] #}
          {% set n = states('sensor.tappevann_rs50_54_antall_feil') %}   {# TILPASS #}
          {% set beredere = 5 %}                                         {# TILPASS: antall kontaktorer på tavla #}
          {% set vv = states('sensor.tavle_rs52_vp_rs52_434_002_xi4_tur_rs52_434_002_rt401') %}      {# TILPASS #}
          {% set vp = states('sensor.tavle_rs52_vp_rs52_434_002_xi4_tur_vp_rs52_434_002_rt405') %}   {# TILPASS #}
          {% set sk = states('sensor.tavle_rs52_vp_rs52_434_002_xi4_tur_rs52_434_002_rt404') %}      {# TILPASS #}
          {% set lav = (is_number(vv) and (vv | float) < 50)
             or (is_number(vp) and is_number(sk) and (vp | float) < 35 and (sk | float) < 35) %}   {# TILPASS: samme grenser som andre feil, uten forsinkelse. false hvis ingen #}
          {% if alarmer | select('is_state', 'on') | list | count > 0 %}Problem
          {% elif n != 'unknown' and not is_number(n) %}Problem
          {% elif is_number(n) and (n | int) * 2 > beredere %}Problem
          {% elif is_number(n) and (n | int) > 0 %}Avvik
          {% elif lav %}Under sjekk
          {% elif n == 'unknown' %}Ikke overvåket
          {% else %}I drift{% endif %}

      # --- Tavle nr. 2: samme mal, egen liste --------------------------------
      - name: "Tappevann - RS60-62 Antall feil"
        unique_id: tappevann_rs60_62_antall_feil
        icon: mdi:bell-alert
        state: >-
          {% set kontaktorer = [
            ['input_boolean.tavle_rs60_vvb_xk5_rs60_434_001_xo01_3_feil', 'automation.tavle_rs60_vvb_xk5_rs60_434_001_xo01_3_robot'],
          ] %}                                                           {# TILPASS #}
          {% if kontaktorer | count == 0 %}
            {{ none }}
          {% else %}
            {% set ns = namespace(n=0) %}
            {% for feil, auto in kontaktorer %}
              {% if is_state(feil, 'on') or not is_state(auto, 'on') %}{% set ns.n = ns.n + 1 %}{% endif %}
            {% endfor %}
            {{ ns.n }}
          {% endif %}

      - name: "Tappevann - RS60-62 Status"
        unique_id: tappevann_rs60_62_status
        icon: mdi:water-boiler
        state: >-
          {% set alarmer = [] %}                                         {# TILPASS: andre feil på tavla, eller [] #}
          {% set n = states('sensor.tappevann_rs60_62_antall_feil') %}
          {% set beredere = 6 %}                                         {# TILPASS #}
          {% set lav = false %}                                          {# TILPASS: lav temperatur nå, eller false #}
          {% if alarmer | select('is_state', 'on') | list | count > 0 %}Problem
          {% elif n != 'unknown' and not is_number(n) %}Problem
          {% elif is_number(n) and (n | int) * 2 > beredere %}Problem
          {% elif is_number(n) and (n | int) > 0 %}Avvik
          {% elif lav %}Under sjekk
          {% elif n == 'unknown' %}Ikke overvåket
          {% else %}I drift{% endif %}

      # --- Hele anlegget: antall kontaktorer med feil ----------------------
      - name: "Tappevann - Antall feil"
        unique_id: tappevann_antall_feil
        icon: mdi:bell-alert
        state: >-
          {{ [
            'sensor.tappevann_rs50_54_antall_feil',
            'sensor.tappevann_rs60_62_antall_feil'
          ] | map('states') | select('is_number') | map('int') | sum }}   {# TILPASS: alle tavlene #}

      # --- Hele anlegget: hvilke kontaktorer som har feil, i klartekst ------
      # Vises i statusboksen og som eget kort på admin info-siden.
      # Eksempel: «RS60-62: feil på XK3, XK4.» eller «Ingen feil».
      # Per tavle: [navn, kontaktorer, andre feil]. Andre feil er [tekst, binary_sensor].
      # Teksten kan ta med en måling, f.eks. 'kaldt varmtvann (' ~ (states('sensor.x') | float(0) | round(0) | int) ~ ' °C ut)'.
      - name: "Tappevann - Fellesfeil årsak"
        unique_id: tappevann_fellesfeil_arsak
        icon: mdi:bell-alert
        state: >-
          {% set tavler = [
            ['RS50-54', [
              ['XK1', 'input_boolean.tavle_rs52_vvb_xk1_rs52_434_002_xo01_1_feil', 'automation.tavle_rs52_vvb_xk1_rs52_434_002_xo01_1_robot'],
            ], [
              ['kaldt varmtvann', 'binary_sensor.tappevann_rs50_54_varmtvann_feil'],
              ['varmepumpa leverer ikke varme', 'binary_sensor.tappevann_rs50_54_varmepumpe_feil'],
            ]],
            ['RS60-62', [
              ['XK5', 'input_boolean.tavle_rs60_vvb_xk5_rs60_434_001_xo01_3_feil', 'automation.tavle_rs60_vvb_xk5_rs60_434_001_xo01_3_robot'],
            ], []],
          ] %}                                                           {# TILPASS: alle tavlene, kontaktorene og andre feil #}
          {% set ns = namespace(a=[]) %}
          {% if not is_state('automation.tappevann_robot', 'on') %}{% set ns.a = ns.a + ['Hovedroboten er AV.'] %}{% endif %}   {# TILPASS #}
          {% for tavle, kontaktorer, andre in tavler %}
            {% set t = namespace(feil=[], av=[]) %}
            {% for navn, feil, auto in kontaktorer %}
              {% if not is_state(auto, 'on') %}{% set t.av = t.av + [navn] %}
              {% elif is_state(feil, 'on') %}{% set t.feil = t.feil + [navn] %}{% endif %}
            {% endfor %}
            {% if t.feil | count > 0 %}{% set ns.a = ns.a + [tavle ~ ': feil på ' ~ (t.feil | join(', ')) ~ '.'] %}{% endif %}
            {% if t.av | count > 0 %}{% set ns.a = ns.a + [tavle ~ ': robot AV for ' ~ (t.av | join(', ')) ~ '.'] %}{% endif %}
            {% for tekst, e in andre %}
              {% if is_state(e, 'on') %}{% set ns.a = ns.a + [tavle ~ ': ' ~ tekst ~ '.'] %}{% endif %}
            {% endfor %}
          {% endfor %}
          {{ ((ns.a | join(' ')) if ns.a | count > 0 else 'Ingen feil') | truncate(250) }}

      # --- Hele anlegget: samlet status (farge på hjemsideknappen) ----------
      # Problem (rød) / Avvik (gul) / Under sjekk (gul) / I drift (grønn).
      # Den overordnede roboten AV gir Avvik (ingen varsling, men varmtvannet går).
      - name: "Tappevann - Status"
        unique_id: tappevann_status
        icon: mdi:water-boiler
        state: >-
          {% set s = [
            'sensor.tappevann_rs50_54_status',
            'sensor.tappevann_rs60_62_status',
          ] | map('states') | list %}                                    {# TILPASS: alle tavlene #}
          {% if 'Problem' in s %}Problem
          {% elif 'Avvik' in s or not is_state('automation.tappevann_robot', 'on') %}Avvik
          {% elif 'Under sjekk' in s %}Under sjekk
          {% else %}I drift{% endif %}

      # --- Hele anlegget: kort tekst til hjemsideknappen --------------------
      # Skrevet for vaktmester: «bereder», ikke «kontaktor». Rødt først, så avvik,
      # så «under sjekk». Eksempel: «2 av 6 beredere med feil på RS60-62,
      # varmepumpe RS50-54 under sjekk» eller «Alt i drift».
      # Per tavle: [navn, antall feil, antall beredere, andre feil].
      # Andre feil: [tekst ved alarm, tekst ved lav nå, alarm-sensor, lav nå (true/false)].
      - name: "Tappevann - Status tekst"
        unique_id: tappevann_status_tekst
        icon: mdi:water-boiler
        state: >-
          {% set tavler = [
            ['RS50-54', 'sensor.tappevann_rs50_54_antall_feil', 5, [
              ['kaldt varmtvann på RS50-54', 'varmtvann RS50-54 under sjekk', 'binary_sensor.tappevann_rs50_54_varmtvann_feil',
                (states('sensor.tavle_rs52_vp_rs52_434_002_xi4_tur_rs52_434_002_rt401') | float(99)) < 50],
              ['varmepumpe RS50-54 leverer ikke varme', 'varmepumpe RS50-54 under sjekk', 'binary_sensor.tappevann_rs50_54_varmepumpe_feil',
                (states('sensor.tavle_rs52_vp_rs52_434_002_xi4_tur_vp_rs52_434_002_rt405') | float(99)) < 35
                and (states('sensor.tavle_rs52_vp_rs52_434_002_xi4_tur_rs52_434_002_rt404') | float(99)) < 35],
            ]],
            ['RS60-62', 'sensor.tappevann_rs60_62_antall_feil', 6, []],
          ] %}                                                           {# TILPASS: alle tavlene #}
          {% set ns = namespace(rod=[], avvik=[], sjekk=[]) %}
          {% for navn, antall, beredere, andre in tavler %}
            {% for alarm_tekst, sjekk_tekst, alarm, lav in andre %}
              {% if is_state(alarm, 'on') %}{% set ns.rod = ns.rod + [alarm_tekst] %}
              {% elif lav %}{% set ns.sjekk = ns.sjekk + [sjekk_tekst] %}{% endif %}
            {% endfor %}
            {% set n = states(antall) | int(0) %}
            {% if n > 0 %}
              {% set t = n ~ ' av ' ~ beredere ~ ' beredere med feil på ' ~ navn %}
              {% if n * 2 > beredere %}{% set ns.rod = ns.rod + [t] %}{% else %}{% set ns.avvik = ns.avvik + [t] %}{% endif %}
            {% endif %}
          {% endfor %}
          {% if not is_state('automation.tappevann_robot', 'on') %}{% set ns.avvik = ns.avvik + ['varsling er av'] %}{% endif %}   {# TILPASS #}
          {% set s = (ns.rod + ns.avvik + ns.sjekk) | join(', ') %}
          {{ (((s[:1] | upper) ~ s[1:]) if s != '' else 'Alt i drift') | truncate(250) }}

  - binary_sensor:
      # --- Hele anlegget: fellesfeil når en tavle har Avvik eller Problem ---
      # Styrer varsling og påminnelse i den overordnede roboten. «Under sjekk» er ikke feil.
      - name: "Tappevann - Fellesfeil"
        unique_id: tappevann_fellesfeil
        device_class: problem
        icon: mdi:bell-alert
        # TILPASS: alle tavlene, og den overordnede roboten (Kontaktor - Fellesfeil varsel).
        # (Ingen {# #}-kommentarer inne i {{ }}: det gir syntaksfeil.)
        state: >-
          {{ [
            'sensor.tappevann_rs50_54_status',
            'sensor.tappevann_rs60_62_status'
          ] | select('is_state', ['Avvik', 'Problem']) | list | count > 0
             or not is_state('automation.tappevann_robot', 'on') }}

      # --- Andre feil (valgfritt): eksempel med varmtvann og varmepumpe ------
      # Forsinkelsen (delay_on) er hvor lenge feilen må stå før den slår inn.
      # delay_off hindrer at et kort hopp over grensen gir «OK igjen» og ny feil.
      # Legg dem i «Andre feil» i den overordnede roboten, i tavlestatus og i årsak.
      # Navnet står i varselet («🔔 Tappevann feil - RS50-54 Varmtvann»). Entitets-ID
      # lages av navnet; endre den etterpå til ..._varmtvann_feil og ..._varmepumpe_feil
      # (README_kontaktor_installasjon.md §8).
      - name: "Tappevann - RS50-54 Varmtvann"
        unique_id: tappevann_rs50_54_varmtvann_feil
        device_class: problem
        icon: mdi:bell-alert
        delay_on:
          minutes: 30
        delay_off:
          minutes: 10
        state: >-
          {% set t = states('sensor.tavle_rs52_vp_rs52_434_002_xi4_tur_rs52_434_002_rt401') %}   {# TILPASS: temperatur ut av bereder #}
          {{ is_number(t) and (t | float) < 50 }}

      # Varmepumpe: både tur fra varmepumpa og sirkulasjon til forvarmetank er kalde.
      # 10 t fordi varmepumpa på RS50-54 står om natta (støy). Bruk kortere tid
      # der varmepumpa skal gå hele døgnet (2 t på RS60-62).
      - name: "Tappevann - RS50-54 Varmepumpe"
        unique_id: tappevann_rs50_54_varmepumpe_feil
        device_class: problem
        icon: mdi:bell-alert
        delay_on:
          hours: 10
        delay_off:
          minutes: 15
        state: >-
          {% set vp = states('sensor.tavle_rs52_vp_rs52_434_002_xi4_tur_vp_rs52_434_002_rt405') %}   {# TILPASS #}
          {% set sk = states('sensor.tavle_rs52_vp_rs52_434_002_xi4_tur_rs52_434_002_rt404') %}      {# TILPASS #}
          {{ is_number(vp) and is_number(sk) and (vp | float) < 35 and (sk | float) < 35 }}
