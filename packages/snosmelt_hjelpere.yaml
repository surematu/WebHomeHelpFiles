# Snøsmelt – hjelpere for blueprintene
#   blueprints/automation/snosmelt_hent_data.yaml
#   blueprints/automation/snosmelt_styr_utgang.yaml
#
# Bruk:
#   1. Kopier denne filen til /config/packages/snosmelt_hjelpere.yaml
#   2. Sørg for at packages er aktivert i configuration.yaml:
#        homeassistant:
#          packages: !include_dir_named packages
#   3. Start Home Assistant på nytt.
#
# Entitets-ID-ene under er hardkodet i snosmelt_hent_data.yaml og må ikke endres.
#
# Alternativt kan de samme hjelperne opprettes manuelt under
# Innstillinger → Enheter og tjenester → Hjelpere (se README_snosmelt_hent_data.md).
#
# Versjon: 2026.11.06

input_boolean:
  snosmelt_behov:
    name: Snøsmelt - Driftsstatus
    icon: mdi:snowflake-melt
  snosmelt_sno_detektert:
    name: Snøsmelt - Snø detektert
    icon: mdi:weather-snowy-heavy
  snosmelt_rim_detektert:
    name: Snøsmelt - Rim detektert
    icon: mdi:snowflake-alert

input_text:
  snosmelt_arsak:
    name: Snøsmelt - Årsak
    icon: mdi:information-outline
    max: 255
  snosmelt_forklaring:
    name: Snøsmelt - Årsak - Utvidet forklaring
    icon: mdi:comment-text-outline
    max: 255
  snosmelt_detaljer:
    name: Snøsmelt - Værdata
    icon: mdi:thermometer-lines
    max: 255

input_datetime:
  snosmelt_sno_sist_aktiv:
    name: Snøsmelt - Snø sist aktiv
    has_date: true
    has_time: true
  snosmelt_rim_sist_aktivert:
    name: Snøsmelt - Rim sist aktivert
    has_date: true
    has_time: true
  snosmelt_manuell_til:
    name: Snøsmelt - Manuellkjøring til
    has_date: true
    has_time: true

  snosmelt_sist_fullfort:
    name: Snøsmelt - Sist fullført
    has_date: true
    has_time: true
  snosmelt_feil_sist_varslet:
    name: Snøsmelt - Feil sist varslet
    has_date: true
    has_time: true

input_button:
  snosmelt_manuell_kjoring:
    name: Snøsmelt - Manuellkjøring
    icon: mdi:gesture-tap-button

# Valgfrie tallverdier til graf. «Hent data» skriver til dem hver time hvis de finnes.
input_number:
  snosmelt_temp_na:
    name: Snøsmelt - Temperatur nå
    min: -60
    max: 60
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer
  snosmelt_rimgrense:
    name: Snøsmelt - Rimgrense
    min: -60
    max: 60
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:snowflake-alert
  snosmelt_temp_min:
    name: Snøsmelt - Temperatur kommende timer (min)
    min: -60
    max: 60
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer-low
  snosmelt_temp_maks:
    name: Snøsmelt - Temperatur kommende timer (maks)
    min: -60
    max: 60
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer-high
  snosmelt_nedbor_sum:
    name: Snøsmelt - Nedbør kommende timer (sum)
    min: 0
    max: 500
    step: 0.1
    mode: box
    unit_of_measurement: mm
    icon: mdi:weather-snowy-heavy
