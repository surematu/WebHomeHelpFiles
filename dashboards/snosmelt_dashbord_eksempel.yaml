# Snøsmelt – eksempel på dashbord (startside, feilsøking og tavleside)
#
# Hører til blueprintene
#   blueprints/automation/snosmelt_hent_data.yaml
#   blueprints/automation/snosmelt_styr_utgang.yaml
# og bruker entitetene fra
#   packages/snosmelt_hjelpere.yaml            (faste ID-er, skal ikke endres)
#   packages/snosmelt_fellesfeil_eksempel.yaml (Tavle A / Kontaktor 1, tilpasses)
#
# Dette er et EKSEMPEL som må tilpasses anlegget. Alt som må byttes ut er
# merket «TILPASS». Hele installasjonen er beskrevet steg for steg i
# README_snosmelt_installasjon.md.
#
# Tre visninger:
#   1. snosmelt     Startside for bruker: status, snø/rim, manuell kjøring, tavler
#   2. feilsoking   Feilsøking for admin: alle hjelpere, automatikk, historikk
#   3. tavle-a      Én side per tavle: én boks per kontaktor (kopieres per tavle)
#
# Bruk:
#   1. Lag et dashbord (her: /dashboard-snosmelting) eller bruk et eksisterende.
#   2. Åpne dashbordet → Rediger → ⋮ → Rå konfigurasjonsredigering.
#   3. Lim inn visningene under `views:` og tilpass entiteter og stier.
#
# Egendefinerte kort (HACS):
#   - Bubble Card   brukes på feilsøkings- og tavlesiden (testet med 3.2.0)
#   - plotly-graph  brukes til historikken på feilsøkingssiden (kan sløyfes)
# Startsiden bruker bare standardkortene i Home Assistant.
#
# Vis bare for admin under testing: legg inn på hver visning
#     visible:
#       - user: <bruker-ID>            # Innstillinger → Personer → Brukere → ID
# og fjern det når løsningen er godkjent.
#
# Versjon: 2026.11.04

views:
  # ===========================================================================
  # 1. STARTSIDE  –  det brukeren ser
  # ===========================================================================
  - type: sections
    title: Snøsmelting
    path: snosmelt
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading_style: title
            heading: Snøsmelting

          # --- Statusboks ----------------------------------------------------
          # Grå = av, grønn = snøsmelting pågår, rød = fellesfeil.
          # Første linje er «Snøsmelt - Årsak», liten skrift under er
          # «Snøsmelt - Årsak - Utvidet forklaring». Ved fellesfeil kommer
          # årsaken til feilen først.
          # NB: Markdown-kortet fjerner `style` og `slot`, så ikonet i boksen
          # følger typen (info / success / warning / error) og kan ikke byttes.
          - type: markdown
            text_only: true
            content: |-
              {% set arsak = states('input_text.snosmelt_arsak') %}
              {% set forklaring = states('input_text.snosmelt_forklaring') %}
              {% if is_state('sensor.snosmelt_samlestatus', 'Fellesfeil') %}
              <ha-alert alert-type="error" title="Fellesfeil">{{ states('sensor.snosmelt_fellesfeil_arsak') }}<br><br>{{ 'Snøsmelting pågår.' if is_state('input_boolean.snosmelt_behov', 'on') else 'Snøsmeltingen er AV.' }} {{ arsak }}<br><br><small>{{ forklaring }}</small></ha-alert>
              {% elif is_state('sensor.snosmelt_samlestatus', 'På') %}
              <ha-alert alert-type="success" title="Snøsmelting pågår">{{ arsak }}<br><br><small>{{ forklaring }}</small></ha-alert>
              {% else %}
              <ha-alert alert-type="info" title="Snøsmeltingen er AV">{{ arsak }}<br><br><small>{{ forklaring }}</small></ha-alert>
              {% endif %}

          # --- Snø og rim ----------------------------------------------------
          - type: tile
            entity: input_boolean.snosmelt_sno_detektert
            name: Snø
            icon: mdi:weather-snowy-heavy
            tap_action:
              action: none
            icon_tap_action:
              action: none
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: input_boolean.snosmelt_rim_detektert
            name: Rim
            icon: mdi:snowflake-alert
            tap_action:
              action: none
            icon_tap_action:
              action: none
            grid_options:
              columns: 6
              rows: 1

          # --- Manuell kjøring -----------------------------------------------
          # Ett trykk starter, nytt trykk stopper. Antall timer settes i
          # «Snøsmelt - Hent data» (Manuell kjøring, timer).
          # Hold inne åpner «Snøsmelt - Manuellkjøring til», der sluttiden kan
          # velges fritt. Et tidspunkt frem i tid starter, et som er passert stopper.
          - type: button
            entity: input_datetime.snosmelt_manuell_til
            name: Manuell kjøring 6 timer            # TILPASS: samme antall timer som i blueprintet
            icon: mdi:gesture-tap-button
            show_name: true
            show_icon: true
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.snosmelt_manuell_kjoring
            hold_action:
              action: more-info
            grid_options:
              columns: 12
              rows: 2
          - type: markdown
            text_only: true
            content: |-
              {% set til = as_timestamp(states('input_datetime.snosmelt_manuell_til'), 0) %}
              {% if til > as_timestamp(now()) %}
              <ha-alert alert-type="warning" title="Manuell kjøring er PÅ til kl. {{ til | timestamp_custom('%H:%M') }}">Trykk på knappen over for å stoppe.</ha-alert>
              {% else %}
              <ha-alert alert-type="info" title="Manuell kjøring er AV">Trykk på knappen over for å kjøre anlegget i 6 timer uansett vær. Hold knappen inne for å velge sluttid selv.</ha-alert>
              {% endif %}

          # --- Tavler --------------------------------------------------------
          # Tre like fliser per tavle der bare den som stemmer er synlig:
          # grå = Av, gul = På, rød med bjelle = Problem. Trykk åpner tavlesiden.
          # Kopier alle tre flisene for hver tavle.                # TILPASS
          - type: heading
            heading_style: title
            heading: Tavler
          - type: tile
            entity: sensor.snosmelt_tavle_a_status
            name: Tavle A
            icon: mdi:snowflake-melt
            color: grey
            tap_action:
              action: navigate
              navigation_path: /dashboard-snosmelting/tavle-a
            icon_tap_action:
              action: navigate
              navigation_path: /dashboard-snosmelting/tavle-a
            grid_options:
              columns: 12
              rows: 1
            visibility:
              - condition: state
                entity: sensor.snosmelt_tavle_a_status
                state: Av
          - type: tile
            entity: sensor.snosmelt_tavle_a_status
            name: Tavle A
            icon: mdi:snowflake-melt
            color: amber
            tap_action:
              action: navigate
              navigation_path: /dashboard-snosmelting/tavle-a
            icon_tap_action:
              action: navigate
              navigation_path: /dashboard-snosmelting/tavle-a
            grid_options:
              columns: 12
              rows: 1
            visibility:
              - condition: state
                entity: sensor.snosmelt_tavle_a_status
                state: På
          - type: tile
            entity: sensor.snosmelt_tavle_a_status
            name: Tavle A
            icon: mdi:bell-alert
            color: red
            tap_action:
              action: navigate
              navigation_path: /dashboard-snosmelting/tavle-a
            icon_tap_action:
              action: navigate
              navigation_path: /dashboard-snosmelting/tavle-a
            grid_options:
              columns: 12
              rows: 1
            visibility:
              - condition: state
                entity: sensor.snosmelt_tavle_a_status
                state: Problem

          # --- Til feilsøking (bare admin) -----------------------------------
          - type: button
            name: Feilsøking (Admin)
            icon: mdi:wrench
            show_name: true
            show_icon: true
            tap_action:
              action: navigate
              navigation_path: /dashboard-snosmelting/feilsoking
            grid_options:
              columns: 12
              rows: 2
            visibility:
              - condition: user
                users:
                  - BRUKER_ID_ADMIN                     # TILPASS

  # ===========================================================================
  # 2. FEILSØKING  –  for admin
  # ===========================================================================
  - type: sections
    title: Snøsmelt - Feilsøking
    path: feilsoking
    subview: true
    back_path: /dashboard-snosmelting/snosmelt
    max_columns: 4
    visible:
      - user: BRUKER_ID_ADMIN                           # TILPASS
    sections:
      # --- Drift: alle statusene i hver sin boks ------------------------------
      - type: grid
        cards:
          - type: heading
            heading_style: title
            heading: Drift (Admin)
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.snosmelt_samlestatus
            name: Snøsmelt - Samlestatus
            icon: mdi:snowflake-melt
            show_state: true
            scrolling_effect: false
            button_action:
              tap_action:
                action: more-info
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: binary_sensor.snosmelt_fellesfeil
            name: Snøsmelt - Fellesfeil
            icon: mdi:bell-alert
            show_state: true
            scrolling_effect: false
            button_action:
              tap_action:
                action: more-info
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.snosmelt_fellesfeil_arsak
            name: Snøsmelt - Fellesfeil årsak
            icon: mdi:bell-alert
            show_state: true
            scrolling_effect: false
            button_action:
              tap_action:
                action: more-info
          # Driftsstatus med Snø og Rim som underknapper
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: input_boolean.snosmelt_behov
            state_content: state
            scrolling_effect: false
            button_action:
              tap_action:
                action: more-info
            sub_button:
              main:
                - entity: input_boolean.snosmelt_sno_detektert
                  name: Snø
                  show_name: true
                - entity: input_boolean.snosmelt_rim_detektert
                  name: Rim
                  show_name: true
              bottom: []
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: input_text.snosmelt_arsak
            name: Snøsmelt - Årsak
            show_state: true
            scrolling_effect: false
            button_action:
              tap_action:
                action: more-info
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: input_text.snosmelt_forklaring
            name: Snøsmelt - Årsak - Utvidet forklaring
            show_state: true
            scrolling_effect: false
            button_action:
              tap_action:
                action: more-info
          # Manuell kjøring: trykk på boksen starter/stopper
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: input_datetime.snosmelt_manuell_til
            name: Manuellkjøring (Trykk for 6 timer)   # TILPASS: antall timer
            icon: mdi:gesture-tap-button
            show_state: true
            scrolling_effect: false
            button_action:
              tap_action:
                action: perform-action
                perform_action: input_button.press
                target:
                  entity_id: input_button.snosmelt_manuell_kjoring
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.snosmelt_manuell_kjoring
            sub_button:
              main:
                - entity: input_boolean.snosmelt_behov
                  show_name: false
              bottom: []

      # --- Automatikk, historikk og værdata -----------------------------------
      - type: grid
        cards:
          - type: heading
            heading_style: title
            heading: Automatikk (Admin)
          - type: custom:bubble-card
            card_type: button
            button_type: switch
            entity: automation.snosmelt_hent_data      # TILPASS
            name: Snøsmelt - Hent data
            icon: mdi:robot
            show_last_changed: true
            scrolling_effect: false
            button_action:
              tap_action:
                action: more-info

          - type: heading
            heading_style: title
            heading: Historikk (Admin)
          # Kan sløyfes hvis plotly-graph ikke er installert.
          - type: custom:plotly-graph
            hours_to_show: 24
            refresh_interval: 10
            grid_options:
              columns: 12
              rows: 3
            entities:
              - entity: input_boolean.snosmelt_behov
                name: Snøsmelt
                filters:
                  - map_y: "y === 'on' ? 1 : 0"
                line:
                  color: orange
                  width: 8
              - entity: input_boolean.snosmelt_rim_detektert
                name: Rim detektert
                filters:
                  - map_y: "y === 'on' ? 1 : 0"
                line:
                  color: blue
                  width: 4
              - entity: input_boolean.snosmelt_sno_detektert
                name: Snø detektert
                filters:
                  - map_y: "y === 'on' ? 1 : 0"
                line:
                  color: red
                  width: 2
            defaults:
              yaxes:
                fixedrange: true
            layout:
              xaxis:
                tickmode: auto
                nticks: 15
                tickangle: -45
                rangeselector:
                  "y": 0
                  buttons:
                    - count: 4
                      label: 4h
                      step: hour
                    - count: 24
                      label: 24h
                      step: hour
                    - count: 168
                      label: 7d
                      step: hour
                rangeslider:
                  visible: false
              yaxis:
                tickmode: array
                tickvals: [0, 1]
                ticktext: [Stopp, Aktiv]
                range: [-0.6, 1.2]

          - type: heading
            heading_style: title
            heading: Værmelding (Admin)
          - type: entities
            show_header_toggle: false
            entities:
              - entity: automation.snosmelt_hent_data  # TILPASS
                secondary_info: last-triggered
              - entity: weather.forecast_home          # TILPASS
              - entity: input_text.snosmelt_detaljer
                name: Værdata i vinduet
              - entity: input_datetime.snosmelt_sno_sist_aktiv
              - entity: input_datetime.snosmelt_rim_sist_aktivert
              - entity: input_datetime.snosmelt_manuell_til
              - entity: input_datetime.snosmelt_sist_fullfort
              - entity: input_datetime.snosmelt_feil_sist_varslet
          # Kort forklaring av reglene. Tallene er standardverdiene i
          # blueprintet og må rettes hvis innstillingene endres.     # TILPASS
          - type: markdown
            content: |-
              Er laveste temperatur de neste 6 timene ...

              **... varmere enn -5**;
              Sjekk værmelding for de neste **3 timene.**
              Snøsmelt kjører etterdrift i 4 timer etter siste snøfall.

              **... -5 eller kaldere**;
              Sjekk værmelding for de neste **6 timene**.
              Snøsmelt kjører etterdrift i 7 timer etter siste snøfall.

              **Nå:** {{ states('input_text.snosmelt_detaljer') }}

      # --- Vær: YR-varselet og samlet graf for rim og snø --------------------------
      # Grafen bruker de fem valgfrie tall-hjelperne (input_number.snosmelt_*) som
      # «Hent data» skriver til hver time. Den trenger ingen egne YAML-sensorer.
      # Rimgrensen følger innstillingen automatisk. Grensene +2 °C, −10 °C og 0,1 mm
      # er skrevet inn i grafen.                                        # TILPASS
      # Bildet er YR-meteogrammet for stedet: bytt ut steds-ID-en i adressen.  # TILPASS
      - type: grid
        column_span: 2
        cards:
        - type: heading
          heading: Vær
          heading_style: title
        - type: picture
          image: https://www.yr.no/nb/innhold/1-73616/meteogram.svg
          tap_action:
            action: none
          grid_options:
            columns: full
        - type: custom:plotly-graph
          title: 'Samlet: rim og snø (YR)'
          entities:
          - entity: input_number.snosmelt_nedbor_sum
            name: Nedbør kommende timer (sum)
            yaxis: y2
            filters: &id003
            - force_numeric
            line:
              color: rgba(130, 60, 200, 1)
              width: 1
              shape: hv
            fill: tozeroy
            fillcolor: rgba(130, 60, 200, 0.35)
            showlegend: true
            hovertemplate: 'Nedbør kommende timer: %{y} mm<extra></extra>'
            legendgroup: nedbor
            legendgrouptitle: &id001
              text: Nedbør
            legendrank: 3
          - entity: input_number.snosmelt_nedbor_sum
            name: Nedbørgrense (0,1 mm)
            yaxis: y2
            unit_of_measurement: mm
            filters:
            - map_y: '0.1'
            line:
              color: rgba(130, 60, 200, 1)
              dash: dash
              width: 2
              shape: hv
            hoverinfo: skip
            hovertemplate: null
            showlegend: true
            legendgroup: nedbor
            legendgrouptitle: *id001
            legendrank: 3
          - entity: input_number.snosmelt_temp_min
            name: For varmt (over +2 °C)
            yaxis: y1
            filters:
            - map_y: '2'
            line:
              color: rgba(50, 160, 60, 1)
              dash: dash
              width: 2
              shape: hv
            hoverinfo: skip
            hovertemplate: null
            showlegend: true
            legendgroup: sno
            legendgrouptitle: &id002
              text: Snø
            legendrank: 2
          - entity: input_number.snosmelt_temp_min
            name: For kaldt (under −10 °C)
            yaxis: y1
            filters:
            - map_y: '-10'
            line:
              color: rgba(130, 205, 110, 1)
              dash: dash
              width: 2
              shape: hv
            hoverinfo: skip
            hovertemplate: null
            showlegend: true
            legendgroup: sno
            legendgrouptitle: *id002
            legendrank: 2
          - entity: input_number.snosmelt_temp_min
            name: Laveste
            yaxis: y1
            showlegend: false
            filters: *id003
            line:
              color: rgba(0, 100, 30, 1)
              width: 1
              shape: hv
            hovertemplate: 'Laveste: %{y} °C<extra></extra>'
            legendgroup: sno
            legendgrouptitle: *id002
            legendrank: 2
          - entity: input_number.snosmelt_temp_maks
            name: Temperatur kommende timer
            yaxis: y1
            showlegend: true
            filters: *id003
            line:
              color: rgba(0, 100, 30, 1)
              width: 1
              shape: hv
            fill: tonexty
            fillcolor: rgba(0, 130, 40, 0.25)
            hovertemplate: 'Høyeste: %{y} °C<extra></extra>'
            legendgroup: sno
            legendgrouptitle: *id002
            legendrank: 2
          - entity: input_number.snosmelt_rimgrense
            name: Rimfelt (skjult bunn)
            yaxis: y1
            filters:
            - force_numeric
            - map_y: Math.min(-11, y - 3)
            line:
              color: rgba(0,0,0,0)
              width: 0
              shape: hv
            showlegend: false
            hoverinfo: skip
            hovertemplate: null
            legendgroup: rim
            legendgrouptitle: &id004
              text: Rim
            legendrank: 1
          - entity: input_number.snosmelt_rimgrense
            name: Rimgrense
            yaxis: y1
            filters: *id003
            line:
              color: rgba(40, 110, 230, 1)
              dash: dash
              width: 2
              shape: hv
            fill: tonexty
            fillcolor: rgba(40, 110, 230, 0.13)
            showlegend: true
            hovertemplate: 'Rimgrense: %{y:.1f} °C<extra></extra>'
            legendgroup: rim
            legendgrouptitle: *id004
            legendrank: 1
          - entity: input_number.snosmelt_temp_na
            name: Utetemperatur
            yaxis: y1
            filters: *id003
            line:
              color: rgba(40, 110, 230, 1)
              width: 3
              shape: hv
            showlegend: true
            legendgroup: rim
            legendgrouptitle: *id004
            legendrank: 1
          - yaxis: y5
            unit_of_measurement: ''
            mode: lines
            connectgaps: false
            hoverinfo: skip
            hovertemplate: null
            legendgroup: drift
            legendgrouptitle:
              text: Drift
            legendrank: 4
            entity: input_boolean.snosmelt_behov
            name: Snøsmelting på
            showlegend: true
            filters:
            - map_y: 'y === "on" ? 1 : y === "off" ? 0 : null'
            line:
              color: rgba(255, 140, 0, 0.8)
              width: 0
              shape: hv
            fill: tozeroy
            fillcolor: rgba(255, 140, 0, 0.65)
          - yaxis: y5
            unit_of_measurement: ''
            mode: lines
            connectgaps: false
            hoverinfo: skip
            hovertemplate: null
            legendgroup: drift
            legendgrouptitle:
              text: Drift
            legendrank: 4
            entity: input_boolean.snosmelt_rim_detektert
            name: Rim detektert bunn
            showlegend: false
            filters:
            - map_y: '1.5'
            line:
              color: rgba(0,0,0,0)
              width: 0
              shape: hv
            fill: none
          - yaxis: y5
            unit_of_measurement: ''
            mode: lines
            connectgaps: false
            hoverinfo: skip
            hovertemplate: null
            legendgroup: drift
            legendgrouptitle:
              text: Drift
            legendrank: 4
            entity: input_boolean.snosmelt_rim_detektert
            name: Rim detektert
            showlegend: true
            filters:
            - map_y: 'y === "on" ? 2.5 : y === "off" ? 1.5 : null'
            line:
              color: rgba(40, 110, 230, 0.7)
              width: 0
              shape: hv
            fill: tonexty
            fillcolor: rgba(40, 110, 230, 0.7)
          - yaxis: y5
            unit_of_measurement: ''
            mode: lines
            connectgaps: false
            hoverinfo: skip
            hovertemplate: null
            legendgroup: drift
            legendgrouptitle:
              text: Drift
            legendrank: 4
            entity: input_boolean.snosmelt_sno_detektert
            name: Snø detektert bunn
            showlegend: false
            filters:
            - map_y: '3'
            line:
              color: rgba(0,0,0,0)
              width: 0
              shape: hv
            fill: none
          - yaxis: y5
            unit_of_measurement: ''
            mode: lines
            connectgaps: false
            hoverinfo: skip
            hovertemplate: null
            legendgroup: drift
            legendgrouptitle:
              text: Drift
            legendrank: 4
            entity: input_boolean.snosmelt_sno_detektert
            name: Snø detektert
            showlegend: true
            filters:
            - map_y: 'y === "on" ? 4 : y === "off" ? 3 : null'
            line:
              color: rgba(0, 130, 40, 0.85)
              width: 0
              shape: hv
            fill: tonexty
            fillcolor: rgba(0, 130, 40, 0.85)
          - yaxis: y5
            unit_of_measurement: ''
            mode: lines
            connectgaps: false
            hoverinfo: skip
            hovertemplate: null
            legendgroup: drift
            legendgrouptitle:
              text: Drift
            legendrank: 4
            entity: input_text.snosmelt_arsak
            name: Manuell kjøring bunn
            showlegend: false
            filters:
            - map_y: '4.5'
            line:
              color: rgba(0,0,0,0)
              width: 0
              shape: hv
            fill: none
          - yaxis: y5
            unit_of_measurement: ''
            mode: lines
            connectgaps: false
            hoverinfo: skip
            hovertemplate: null
            legendgroup: drift
            legendgrouptitle:
              text: Drift
            legendrank: 4
            entity: input_text.snosmelt_arsak
            name: Manuell kjøring
            showlegend: true
            filters:
            - map_y: 'typeof y === "string" && y.startsWith("Manuell") ? 5.5 : 4.5'
            line:
              color: rgba(90, 90, 90, 0.85)
              width: 0
              shape: hv
            fill: tonexty
            fillcolor: rgba(90, 90, 90, 0.85)
          hours_to_show: 48
          refresh_interval: 60
          layout:
            margin:
              r: 70
              t: '$ex window.innerWidth >= 1900 ? 160 : 225'
            legend:
              x: 0
              y: 1.12
              yanchor: bottom
              orientation: h
              traceorder: grouped
              groupclick: togglegroup
            yaxis:
              title:
                text: ''
              autorange: true
              ticksuffix: ' °C'
              zeroline: true
              fixedrange: true
            yaxis2:
              title:
                text: ''
              visible: true
              overlaying: y
              side: right
              fixedrange: true
              autorange: true
              rangemode: tozero
              autorangeoptions:
                include:
                - 0
                - 1
                minallowed: 0
              tickmode: auto
              nticks: 5
              tickformat: .1f
              ticksuffix: ' mm'
              showgrid: false
              zeroline: false
              tickfont:
                color: rgba(130, 60, 200, 1)
            yaxis5:
              visible: false
              overlaying: y
              fixedrange: true
              autorange: false
              range:
              - 0
              - 40
              showgrid: false
              zeroline: false
            xaxis:
              rangeselector:
                y: 1
                x: 0.7
                buttons:
                - count: 12
                  step: hour
                - count: 1
                  step: day
                - count: 2
                  step: day
                - count: 7
                  step: day
          grid_options:
            columns: full
            rows: 9
        - type: markdown
          grid_options:
            columns: full
          content: '**Slik leses grafen:** Den viser hvor nær anlegget er å starte på rim eller snø, med tallene automasjonen selv har brukt (hentet fra værvarselet hver time). Tegnforklaringen er delt i **Rim**, **Snø**, **Nedbør** og **Drift**. Trykk på en linje i tegnforklaringen for å skjule eller vise hele kategorien, og dobbelttrykk for å vise bare den.


            - **Rim (blått):** rim meldes når den heltrukne blå linja (utetemperatur) kommer under den blå stiplede rimgrensen. Det lyseblå feltet under linja er området der rim meldes. Rimgrensen følger innstillingen i «Snøsmelt - Hent data».

            - **Snø (grønt) og nedbør (lilla):** snø meldes når det lilla feltet (høyre akse) når opp til den lilla stiplede linja, mens det grønne feltet er mellom de grønne stiplede grensene.

            - **Drift:** båndene nederst viser når snøsmeltingen var på (oransje), når rim (blått) og snø (grønt) ble detektert, og når anlegget gikk på manuell kjøring (grått).


            Grensene +2 °C, −10 °C og 0,1 mm er skrevet inn i grafen, og må rettes her hvis de endres i «Snøsmelt - Hent data».'

  # ===========================================================================
  # 3. TAVLESIDE  –  én visning per tavle (kopier og tilpass)
  # ===========================================================================
  - type: sections
    title: Tavle A                                     # TILPASS
    path: tavle-a                                      # TILPASS
    subview: true
    back_path: /dashboard-snosmelting/snosmelt
    max_columns: 4
    sections:
      # --- Det brukeren ser: én boks per kontaktor ----------------------------
      - type: grid
        cards:
          - type: heading
            heading_style: title
            heading: Tavle A - Alle enheter            # TILPASS
          # Boksen er selve bryteren. Underknapper fra venstre:
          #   1. Effekt     vises bare når det trekkes last (over 50 W)
          #   2. Spole      spoleeffekt, vises når bryteren er PÅ
          #   3. Feil       rød bjelle, vises BARE ved feil
          #   4. Robot      åpner «<bryternavn> - Robot» (Styr utgang) for kontaktoren
          # `styles` gjør underknapp nr. 3 (Feil) rød. Bytter du rekkefølge,
          # må tallet i `.bubble-sub-button-3` følge med.
          # Kopier hele kortet for hver kontaktor.                 # TILPASS
          - type: custom:bubble-card
            card_type: button
            button_type: switch
            entity: switch.tavle_a_kontaktor_1         # TILPASS
            icon: mdi:snowflake-melt
            show_last_changed: true
            scrolling_effect: false
            button_action:
              tap_action:
                action: more-info
            sub_button:
              main:
                - entity: sensor.tavle_a_kontaktor_1_effekt        # TILPASS
                  name: Effekt
                  show_icon: false
                  show_state: true
                  show_background: true
                  visibility:
                    - condition: numeric_state
                      entity: sensor.tavle_a_kontaktor_1_effekt    # TILPASS
                      above: 50
                - entity: sensor.tavle_a_kontaktor_1_spole_effekt  # TILPASS
                  name: Spole
                  icon: mdi:magnet-on
                  show_icon: true
                  show_name: false
                  show_state: true
                  show_background: true
                  tap_action:
                    action: more-info
                  visibility:
                    - condition: state
                      entity: switch.tavle_a_kontaktor_1           # TILPASS
                      state: "on"
                - entity: binary_sensor.snosmelt_tavle_a_kontaktor_1_feil   # TILPASS
                  name: Feil
                  icon: mdi:bell-alert
                  show_icon: true
                  show_name: false
                  show_state: false
                  show_background: true
                  tap_action:
                    action: more-info
                  visibility:
                    - condition: state
                      entity: binary_sensor.snosmelt_tavle_a_kontaktor_1_feil   # TILPASS
                      state: "on"
                - entity: automation.tavle_a_kontaktor_1_robot   # TILPASS: «<bryternavn> - Robot»
                  name: Robot
                  icon: mdi:robot
                  show_icon: true
                  show_name: false
                  show_state: false
                  show_background: true
                  tap_action:
                    action: more-info
              bottom: []
            styles: |-
              .bubble-sub-button-3 { background-color: var(--error-color, #db4437) !important; }
              .bubble-sub-button-3 * { color: white !important; }

      # --- For admin: alle målinger per kontaktor ------------------------------
      - type: grid
        visibility:
          - condition: user
            users:
              - BRUKER_ID_ADMIN                         # TILPASS
        cards:
          - type: heading
            heading_style: title
            heading: Tavle A - Snøsmelting (Admin)     # TILPASS
          # Noter her det som er særegent for tavla: hva effektmåleren måler,
          # normal last og spoleeffekt, sikringer osv.               # TILPASS
          - type: markdown
            content: |-
              Skriv inn merknader om tavla her.
          - type: entities
            title: Kontaktor 1 (6,5 kW last, 2,5 W spole)   # TILPASS
            show_header_toggle: false
            entities:
              - entity: switch.tavle_a_kontaktor_1                  # TILPASS
                secondary_info: last-changed
              - entity: sensor.tavle_a_kontaktor_1_effekt           # TILPASS
                secondary_info: last-changed
              - entity: sensor.tavle_a_kontaktor_1_spole_effekt     # TILPASS (sløyfes uten spolemåling)
                name: Kontaktor - Effekt
                secondary_info: last-changed
              - entity: binary_sensor.snosmelt_tavle_a_kontaktor_1_feil   # TILPASS
              - entity: automation.tavle_a_kontaktor_1_robot   # TILPASS
                name: Styr utgang
                secondary_info: last-triggered
              - entity: input_boolean.snosmelt_behov
                name: Snøsmelt - Driftsstatus
                secondary_info: last-changed

