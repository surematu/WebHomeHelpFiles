              .split('\n')
              | map('trim')
              | select('match','^- ')
              | map('regex_replace','^- ','')
              | map('regex_replace','\\s*\\|.*$','')
              | map('regex_replace','(?i)\\s+level\\s*$','')
              | map('regex_replace','\\s{2,}',' ')
              | map('trim')
              | map('lower')
              | list
            %}
            {% for line in (lite_batteri_digital_clean | default('')).split('\n') %}
              {% set l = line | trim %}
              {% if l == '' %}
              {% elif not l.startswith('- ') %}
