blueprint:
  name: Varsel - Enhet (batteri + signal + uptime) (WebHome Automation)
  description: >
    Samlet overvåkning av batteri-enheter og Uptime Kuma i én automasjon:

    Del 1 – Lite batteri (planlagt sjekk):
      - sensor.* med device_class: battery → rapporterer % under terskel
      - binary_sensor.* med device_class: battery → rapporterer digitalt lav-signal
      - Deduper per renset navn, beholder laveste verdi

    Del 2 – Vært offline en stund (planlagt sjekk, samme tid som Del 1):
      - Trigger: minst én enhet har ikke rapportert inn på over angitt tid (standard 72 timer)
      - Meldingen inkluderer alle enheter uten signal fra terskel (standard 2 timer) og opp
      - Enheter som allerede er listet i en tidligere del av samme varsel vises ikke på nytt senere
      - Ved manuell kjøring beskrives listen nøytralt (ikke som "utløste varselet")

    Del 3 – Nylig mistet signal (time_pattern – kjøres hver 4. time):
      - Varsler enheter som nettopp har krysset terskelen:
        nylig_mistet_terskel <= alder < (nylig_mistet_terskel + 1 time)
      - Presenteres øverst i varselet, etterfulgt av ordinær Del 1- og
        Del 2-innhold (uten å duplisere enheter)

    Del 4 – Uptime Kuma:
      - Inkluderes i samme varsling som Del 1-3 ved time_pattern og planlagt/manuell sjekk
      - Kritiske Uptime-statussensorer kan trigge øyeblikkelig varsel

    Felles for alle:
      - Én ignore-liste for entities og devices (gjelder alle sjekkene)
      - Debug-detaljer slås på én gang

    Slik finner vi "sist sett" (signal-sjekkene):
      - state_attr(entity, 'last_seen') hvis finnes
      - entity_id med "last_seen" i navnet (og parsbar timestamp i state)
      - Fallback: entity.last_changed for sensor/binary_sensor

    Blueprint versjon: 2026.08.02
  domain: automation
  author: WebHome
  source_url: https://github.com/surematu/WebHomeHelpFiles/blob/main/blueprints/automation/varsel_enhet.yaml
  homeassistant:
    min_version: 2025.11.0

  input:

    planlagt_sjekk:
      name: "Planlagt sjekk"
      description: >
        Tidspunkt og ukedager for batteri nivå (Del 1) og langsomt signal (Del 2).
        Den raske signal-sjekken (Del 3) kjøres automatisk hver 4. time via time_pattern.
      input:
        check_time:
          name: Tid for planlagt sjekk
          default: "09:05:00"
          selector:
            time:

        check_weekdays:
          name: Ukedag(er) for planlagt sjekk
          default:
            - wed
          selector:
            select:
              multiple: true
              mode: list
              options:
                - { label: Mandag, value: mon }
                - { label: Tirsdag, value: tue }
                - { label: Onsdag, value: wed }
                - { label: Torsdag, value: thu }
                - { label: Fredag, value: fri }
                - { label: Lørdag, value: sat }
                - { label: Søndag, value: sun }

    filtrering:
      name: "Filtrering (gjelder alle sjekkene)"
      description: "Entities og devices som utelates fra batteri nivå, langsomt signal og raskt signal."
      input:
        ignore_entities:
          name: Ignorer entities (valgfritt)
          description: Velg entities du vil skjule fra alle rapporter (sensor/binary_sensor).
          default: []
          selector:
            entity:
              multiple: true

        ignore_devices:
          name: Ignorer devices (valgfritt)
          description: Velg devices du vil skjule (skjuler alle batteri-entities knyttet til device).
          default: []
          selector:
            device:
              multiple: true

    batteri_nivaa:
      name: "Del 1 – Batteri nivå"
      description: "Innstillinger for rapportering av lavt batterinivå (planlagt sjekk)."
      input:
        threshold_percent:
          name: Terskel for lavt batteri (%)
          default: 30
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"

    signal_langsomt:
      name: "Del 2 – Signal langsomt"
      description: >
        Varsler batteri-enheter som ikke har rapportert inn på lenge.
        Kjøres ved planlagt sjekk (samme tid som Del 1).
        NB: Shelly WiFi-temperatursensorer responderer noen ganger ikke på 2-3 timer.
      input:
        max_age:
          name: Maks tid siden sist signal
          description: "Varsle hvis enhet ikke er sett på mer enn dette. Standard: 72 timer."
          default: 72
          selector:
            number:
              min: 24
              max: 72
              step: 4
              unit_of_measurement: "h"
              mode: slider

    signal_raskt:
      name: "Del 3 – Signal raskt"
      description: >
        Varsler batteri-enheter som nylig mistet kontakten (kjøres hver 4. time).
        Varsel-vinduet er nøyaktig 4 timer bredt: last_seen_threshold <= alder < (last_seen_threshold + 4t).
        Hver enhet rapporteres kun én gang – første 4-timers syklus den passerer terskelen.
      input:
        last_seen_threshold:
          name: Nedre grense – minimum tid siden sist signal
          description: >
            Enheter sett for kortere tid enn dette ignoreres. Standard: 4 timer.
          default: 4
          selector:
            number:
              min: 4
              max: 24
              step: 4
              unit_of_measurement: "h"
              mode: slider

    uptime_kuma:
      name: "Del 4 – Uptime Kuma"
      description: "Innstillinger for Uptime Kuma i samlet enhetsvarsel."
      input:
        urgent_sensors:
          name: Kritiske status-sensorer (øyeblikkelig varsel)
          description: >
            Velg Uptime Kuma Status-sensorer som skal varsles umiddelbart ved statusendring.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: enum

    varsling:
      name: "Varsling (Valgfri)"
      description: "Innstillinger for Pushover-varsler. Gjelder alle sjekkene."
      icon: mdi:bell-outline
      collapsed: true
      input:
        pushover_destination:
          name: Pushover destination
          description: Mottakergruppe i script.varsel_pushover_send_melding_webhome
          default: pushover
          selector:
            text:

        pushover_priority:
          name: Pushover priority - generell
          description: Prioritet brukt for vanlige varsler
          default: 0
          selector:
            number:
              min: -2
              max: 2
              step: 1
              mode: box

        pushover_priority_urgent_offline:
          name: Pushover priority - kritisk enhet offline
          description: Prioritet brukt når kritisk valgt Uptime-sensor går offline
          default: 1
          selector:
            number:
              min: -2
              max: 2
              step: 1
              mode: box

        pushover_priority_urgent_other:
          name: Pushover priority - kritisk enhet online/annen endring
          description: Prioritet brukt når kritisk Uptime-sensor går online eller skifter til annen ikke-offline status
          default: -1
          selector:
            number:
              min: -2
              max: 2
              step: 1
              mode: box

        pushover_ttl_hours:
          name: Levetid varsel (timer)
          description: Hvor lenge skal varslet være synlig før det forsvinner?
          default: 168
          selector:
            number:
              min: 0
              max: 168
              step: 1
              unit_of_measurement: h
              mode: box

        include_debug_details:
          name: Legg til debug-detaljer i varselet
          description: Legger til ekstra informasjon om trigger, terskler og intervaller i alle varsler.
          default: false
          selector:
            boolean:

mode: restart

trigger:
  # Del 3 – raskt signal: kjøres hver 4. time
  - platform: time_pattern
    hours: /4
    id: time_pattern_check

  # Del 1 + Del 2 – planlagt sjekk
  - platform: time
    at: !input check_time
    weekday: !input check_weekdays
    id: scheduled_check

  # Del 4 – Uptime Kuma kritiske sensorer (øyeblikkelig)
  - platform: state
    entity_id: !input urgent_sensors
    to: "down"
    id: urgent_sensor_trigger

  - platform: state
    entity_id: !input urgent_sensors
    from: "down"
    to: "up"
    id: urgent_sensor_trigger

condition: []

action:
  # ─── Steg 1 – Sett grunnvariabler ────────────────────────────────────────────
  - alias: "Steg 1 - Sett grunnvariabler"
    variables:
      threshold: !input threshold_percent
      max_age: !input max_age
      last_seen_threshold: !input last_seen_threshold
      ignore_entities: !input ignore_entities
      ignore_devices: !input ignore_devices
      debug_on: !input include_debug_details
      pushover_destination: !input pushover_destination
      pushover_priority: !input pushover_priority
      pushover_priority_urgent_offline: !input pushover_priority_urgent_offline
      pushover_priority_urgent_other: !input pushover_priority_urgent_other
      pushover_ttl_hours: !input pushover_ttl_hours
      pushover_ttl_seconds: "{{ (pushover_ttl_hours | float(168)) * 3600 | int }}"
      urgent_sensors_input: !input urgent_sensors

      # Del 2 – langsomt signal: terskel i sekunder og label
      max_age_seconds: "{{ max_age | int(72) * 3600 }}"
      max_age_label: "{{ max_age | int(72) | string ~ 'h' }}"

      # Del 3 – raskt signal: terskel i sekunder og label; intervall = terskel + 4t (1 sjekk-syklus)
      threshold_seconds: "{{ last_seen_threshold | int(4) * 3600 }}"
      interval_seconds: "{{ threshold_seconds | int(0) + 14400 }}"  # 14400s = 4h = one time_pattern trigger cycle → each device reported at most once
      threshold_label: "{{ last_seen_threshold | int(4) | string ~ 'h' }}"

      trigger_id_raw: "{{ trigger.id if trigger is defined and trigger.id is defined else '' }}"
      run_started_by_user: >-
        {{ this is defined and this.context is defined and (this.context.user_id | default('', true) | string | trim) != '' }}
      manual_run: "{{ run_started_by_user or trigger_id_raw == '' }}"
      trigger_is_time_pattern: "{{ (not manual_run) and trigger_id_raw == 'time_pattern_check' }}"
      trigger_is_scheduled: "{{ (not manual_run) and trigger_id_raw == 'scheduled_check' }}"
      trigger_is_urgent: "{{ (not manual_run) and trigger_id_raw == 'urgent_sensor_trigger' }}"
      trigger_label: "{{ trigger_id_raw if trigger_id_raw | trim != '' else 'manual/unknown' }}"
      show_all_down_uptime: "{{ manual_run or trigger_is_scheduled or trigger_is_urgent }}"
      urgent_trigger_device_name: >-
        {%- if trigger_is_urgent -%}
          {%- set did = device_id(trigger.entity_id) -%}
          {{ device_attr(did, 'name') | default(trigger.entity_id, true) }}
        {%- else -%}
          {{ '' }}
        {%- endif -%}
      urgent_trigger_went_online: >-
        {%- if trigger_is_urgent -%}
          {{ trigger.to_state is not none and trigger.to_state.state | lower == 'up' }}
        {%- else -%}
          false
        {%- endif -%}
      effective_priority: >-
        {%- if trigger_is_urgent -%}
          {%- if trigger.to_state is not none and trigger.to_state.state | lower != 'up' -%}
            {{ pushover_priority_urgent_offline | int(1) }}
          {%- else -%}
            {{ pushover_priority_urgent_other | int(-1) }}
          {%- endif -%}
        {%- else -%}
          {{ pushover_priority | int(0) }}
        {%- endif -%}

  # ─── Steg 1H – HA restart-tid ────────────────────────────────────────────────
  - alias: "Steg 1H - HA restart-tid"
    variables:
      ha_start_ts: "{{ as_timestamp(states('sensor.home_assistant_running'), default=0) | float(0) }}"
      ha_start_age_s: "{{ [as_timestamp(now()) - ha_start_ts, 0] | max | int(0) }}"

  - alias: "Steg 1U-A - Finn Uptime Kuma devices"
    variables:
      uptime_devices: |-
        {%- set interval_s = 3600 -%}
        {%- set now_ts = as_timestamp(now()) | int(0) -%}
        {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
        {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}
        {%- set ns = namespace(seen_devices=[], all_devices=[], debug=[]) -%}

        {%- for s in states.sensor -%}
          {%- set fname = state_attr(s.entity_id, 'friendly_name') | default(s.name, true) -%}
          {%- if fname.endswith('Uptime (30 days)') -%}
            {%- set did = device_id(s.entity_id) -%}
            {%- if did and did not in ns.seen_devices -%}
              {%- set ns.seen_devices = ns.seen_devices + [did] -%}
              {%- if did not in ignore_d -%}
              {%- set dev_name = device_attr(did, 'name') | default('Ukjent enhet', true) -%}
              {%- set ents = device_entities(did) if did else [] -%}
              {%- set found = namespace(status_eid='', uptime1_eid='', uptime30_eid='', uptime365_eid='') -%}

              {%- for e in ents -%}
                {%- set st_obj = states[e] -%}
                {%- if st_obj is not none -%}
                  {%- set fn = state_attr(e, 'friendly_name') | default(st_obj.name, true) -%}
                  {%- if fn.endswith(' Status') and found.status_eid == '' -%}{%- set found.status_eid = e -%}{%- endif -%}
                  {%- if fn.endswith('Uptime (1 day)') and found.uptime1_eid == '' -%}{%- set found.uptime1_eid = e -%}{%- endif -%}
                  {%- if fn.endswith('Uptime (30 days)') and found.uptime30_eid == '' -%}{%- set found.uptime30_eid = e -%}{%- endif -%}
                  {%- if fn.endswith('Uptime (365 days)') and found.uptime365_eid == '' -%}{%- set found.uptime365_eid = e -%}{%- endif -%}
                {%- endif -%}
              {%- endfor -%}

              {%- if found.status_eid != '' and found.status_eid not in ignore_e -%}
                {%- set status_state = states(found.status_eid) | string -%}
                {%- set is_up = (status_state | lower) == 'up' -%}
                {%- set status_obj = states[found.status_eid] -%}
                {%- set lc_ts = as_timestamp(status_obj.last_changed, default=0) | int(0) -%}
                {%- set age_s = (now_ts - lc_ts) | int(0) -%}
                {%- set is_new = (not is_up) and (age_s >= 0) and (age_s < interval_s) -%}
                {%- set dev_info = {
                  'device_name': dev_name,
                  'status_eid': found.status_eid,
                  'uptime1': states(found.uptime1_eid) if found.uptime1_eid != '' else 'ukjent',
                  'uptime30': states(found.uptime30_eid) if found.uptime30_eid != '' else 'ukjent',
                  'uptime365': states(found.uptime365_eid) if found.uptime365_eid != '' else 'ukjent',
                  'is_up': is_up,
                  'age_s': age_s,
                  'is_new': is_new
                } -%}
                {%- set ns.all_devices = ns.all_devices + [dev_info] -%}
              {%- endif -%}
              {%- endif -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}

        {{ {'all_devices': (ns.all_devices | sort(attribute='device_name')), 'total_count': (ns.all_devices | count), 'debug': ns.debug} | tojson }}

  - alias: "Steg 1U-B - Bygg Uptime Kuma rapportpayload"
    variables:
      uptime_report_payload: |-
        {%- set d = uptime_devices if uptime_devices is mapping else uptime_devices | from_json -%}
        {%- set urgent_eids = urgent_sensors_input | default([]) -%}
        {%- set ns = namespace(down_all=[], down_new=[], unstable=[]) -%}

        {%- for dev in d.all_devices -%}
          {%- if not dev.is_up -%}
            {%- set ns.down_all = ns.down_all + [dev] -%}
            {%- if dev.is_new and dev.status_eid not in urgent_eids -%}
              {%- set ns.down_new = ns.down_new + [dev] -%}
            {%- endif -%}
          {%- elif (dev.uptime1 | float(100)) < 99.5 -%}
            {%- set ns.unstable = ns.unstable + [dev] -%}
          {%- endif -%}
        {%- endfor -%}

        {{ {
          'devices_found': d.total_count,
          'down_count': ns.down_all | count,
          'new_down_count': ns.down_new | count,
          'should_notify': (show_all_down_uptime or ((ns.down_new | count) > 0)) and ((ns.down_all | count) > 0),
          'down_all': ns.down_all | sort(attribute='device_name'),
          'down_new': ns.down_new | sort(attribute='device_name'),
          'down_existing': (ns.down_all | rejectattr('is_new') | list | sort(attribute='device_name')),
          'unstable_devices': ns.unstable | sort(attribute='device_name'),
          'unstable_count': ns.unstable | count,
          'debug': d.debug
        } | tojson }}

  - alias: "Steg 1U-C - Bygg Uptime Kuma melding"
    variables:
      uptime_notification_title: >-
        {% set p = uptime_report_payload if uptime_report_payload is mapping else uptime_report_payload | from_json %}
        {% set urgent_dev = urgent_trigger_device_name | trim %}
        {% if urgent_dev != '' and urgent_trigger_went_online | bool(false) %}
          🟢 {{ urgent_dev }} er online
        {% elif p.should_notify %}
          {% if urgent_dev != '' %}
            🔴 {{ urgent_dev }} er offline
          {% elif not show_all_down_uptime and p.new_down_count == 1 %}
            🔴 {{ p.down_new[0].device_name }} gikk offline
          {% elif not show_all_down_uptime and p.new_down_count > 1 %}
            🔴 {{ p.new_down_count }} nye enheter gikk offline
          {% elif p.down_count == 1 %}
            🔴 {{ p.down_all[0].device_name }} er offline
          {% else %}
            🔴 {{ p.down_count }} enheter offline
          {% endif %}
        {% else %}
          UptimeKuma
        {% endif %}
      uptime_combined_message: >-
        {% set p = uptime_report_payload if uptime_report_payload is mapping else uptime_report_payload | from_json %}
        {% set ns = namespace(out=[]) %}
        {% macro format_device_line(it) -%}
          {% set age_s = it.age_s | int(0) %}
          {% set d = (age_s // 86400) | int(0) %}
          {% set h = ((age_s % 86400) // 3600) | int(0) %}
          {% set m = ((age_s % 3600) // 60) | int(0) %}
          {% if d > 0 %}{% set age_txt = d|string ~ "d " ~ h|string ~ "h" %}
          {% elif h > 0 %}{% set age_txt = h|string ~ "h " ~ m|string ~ "m" %}
          {% elif m > 0 %}{% set age_txt = m|string ~ "m" %}
          {% else %}{% set age_txt = (age_s % 60)|string ~ "s" %}
          {% endif %}
          {% set u1 = (it.uptime1 | float(0)) | int %}
          {% set u30 = (it.uptime30 | float(0)) | int %}
          {% set u365 = (it.uptime365 | float(0)) | int %}
          {% set umin = [u1, u30, u365] | min %}
          {% set umax = [u1, u30, u365] | max %}
          {{ "- " ~ it.device_name ~ " | " ~ age_txt ~ " / " ~ umin|string ~ "-" ~ umax|string ~ "%" }}
        {%- endmacro %}
        {% macro render_device_lines(items) -%}
          {% set rn = namespace(lines=[]) %}
          {% for it in items | sort(attribute='age_s') %}
            {% set rn.lines = rn.lines + [format_device_line(it) | trim] %}
          {% endfor %}
          {{ rn.lines | join('\n') }}
        {%- endmacro %}

        {% if p.should_notify %}
          {% if not show_all_down_uptime and p.new_down_count > 0 %}
            {% set ns.out = ns.out + ["Enheter som nylig gikk offline (| Endret / oppetid %):", (render_device_lines(p.down_new) | trim)] %}
          {% endif %}
          {% if show_all_down_uptime or (p.down_existing | count > 0) %}
            {% if ns.out | count > 0 %}{% set ns.out = ns.out + [""] %}{% endif %}
            {% set offline_list = p.down_all if show_all_down_uptime else p.down_existing %}
            {% set ns.out = ns.out + ["Enheter som er offline. (| Endret / oppetid %):", (render_device_lines(offline_list) | trim)] %}
          {% endif %}
          {% if p.unstable_count > 0 %}
            {% set ns.out = ns.out + ["", "Ustabil oppetid (| Endret / oppetid %):"] %}
            {% for it in p.unstable_devices %}
              {% set ns.out = ns.out + [format_device_line(it) | trim] %}
            {% endfor %}
          {% endif %}
        {% elif urgent_trigger_went_online | bool(false) and urgent_trigger_device_name | trim != '' %}
          {% set ns.out = ["Alle overvåkede enheter er nå online."] %}
        {% endif %}

        {{ (ns.out | join('\n')) | trim }}
      uptime_should_notify_unified: "{{ (uptime_combined_message | trim) != '' }}"

  # ─── Velg logikk basert på trigger ───────────────────────────────────────────
  - choose:

    # ═══════════════════════════════════════════════════════════════════════════
    # DEL 4 – UPTIME KUMA KRITISK (øyeblikkelig statusendring)
    # ═══════════════════════════════════════════════════════════════════════════
    - conditions:
        - condition: template
          value_template: "{{ trigger_is_urgent }}"
      sequence:
        - alias: "Steg 2U - Send øyeblikkelig Uptime Kuma varsel"
          if:
            - condition: template
              value_template: "{{ uptime_should_notify_unified }}"
          then:
            - action: script.varsel_pushover_send_melding_webhome
              data:
                title: "{{ uptime_notification_title | trim }}"
                message: "{{ uptime_combined_message }}"
                destination: "{{ pushover_destination }}"
                priority: "{{ effective_priority | int(0) }}"
                ttl: "{{ pushover_ttl_seconds }}"


    # ═══════════════════════════════════════════════════════════════════════════
    # DEL 1 – BATTERI NIVÅ  +  DEL 2 – LANGSOMT SIGNAL
    # (planlagt sjekk og HA-oppstart)
    # ═══════════════════════════════════════════════════════════════════════════
    default:

      # ── Del 1 – Batteri nivå ──────────────────────────────────────────────────

      # Steg 2B – Bygg batteriliste (prosent)
      - alias: "Steg 2B - Bygg batteriliste (prosent)"
        variables:
          lite_batteri_prosent: |-
            {%- set ns = namespace(map={}, names={}, ages={}, lines=[]) -%}
            {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
            {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}

            {%- for s in states.sensor
                  | selectattr('attributes.device_class','defined')
                  | selectattr('attributes.device_class','eq','battery') -%}
              {%- set eid = s.entity_id -%}
              {%- set did = device_id(eid) -%}
              {%- if eid in ignore_e or (did and did in ignore_d) -%}
                {# Ignorert #}
              {%- else -%}
                {%- set state_str = s.state -%}
                {%- set is_num = state_str | is_number -%}
                {%- if is_num -%}
                  {%- set val = state_str | float -%}
                {%- else -%}
                  {%- set val = none -%}
                {%- endif -%}
                {%- set base = s.name
                    | regex_replace('(?i)(?:\\s|^)(battery|batteri|level)(?:\\s|$)', ' ')
                    | replace(' Battery+', '')
                    | regex_replace('\\s{2,}', ' ')
                    | regex_replace('\\s*\\+\\s*$', '')
                    | regex_replace('(?i)\\s*level\\s*$', '')
                    | trim -%}
                {%- set norm = base | lower | regex_replace('[^\\w\\s:]', '') | regex_replace('\\s{2,}', ' ') | trim -%}
                {%- set age_s = (as_timestamp(now()) - as_timestamp(s.last_changed, default=0) | float(0)) | int(0) -%}
                {%- if is_num and 0 <= val < (threshold | float(0)) -%}
                  {%- if norm not in ns.map or val < ns.map[norm] -%}
                    {%- set ns.map = dict(ns.map, **{norm: val}) -%}
                    {%- set ns.names = dict(ns.names, **{norm: base}) -%}
                    {%- set ns.ages = dict(ns.ages, **{norm: age_s}) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}

            {%- for norm, v in ns.map | dictsort(by='value') -%}
              {%- set age_s = ns.ages[norm] | int(0) -%}
              {%- set d = (age_s // 86400) | int(0) -%}
              {%- set h = ((age_s % 86400) // 3600) | int(0) -%}
              {%- set m = ((age_s % 3600) // 60) | int(0) -%}
              {%- if d > 0 -%}
                {%- set age_txt = d|string ~ 'd ' ~ h|string ~ 'h' -%}
              {%- elif h > 0 -%}
                {%- set age_txt = h|string ~ 'h ' ~ m|string ~ 'm' -%}
              {%- elif m > 0 -%}
                {%- set age_txt = m|string ~ 'm' -%}
              {%- else -%}
                {%- set age_txt = (age_s % 60)|string ~ 's' -%}
              {%- endif -%}
              {%- set ns.lines = ns.lines + ['- ' ~ ns.names[norm] ~ ' | ' ~ age_txt ~ ' / ' ~ (v | round(0) | int) ~ '%'] -%}
            {%- endfor -%}
            {{ ns.lines | join('\n') }}

      # Steg 3B – Bygg digital batteriliste (binary_sensor)
      - alias: "Steg 3B - Bygg digital batteriliste (binary_sensor)"
        variables:
          lite_batteri_digital: |-
            {%- set ns = namespace(lines=[]) -%}
            {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
            {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}
            {# Bare eksplisitt lavt-batteri signal skal varsles her; unknown/unavailable håndteres av signal-sjekkene. #}
            {%- set items = states.binary_sensor
                | selectattr('attributes.device_class','eq','battery')
                | selectattr('state','eq','on')
                | sort(attribute='name') | list -%}

            {%- for e in items -%}
              {%- set eid = e.entity_id -%}
              {%- set did = device_id(eid) -%}
              {%- if eid in ignore_e or (did and did in ignore_d) -%}
                {# Ignorert #}
              {%- else -%}
                {%- set base = e.name
                    | regex_replace('(?i)\\bbattery\\s*low\\b:?',' ')
                    | regex_replace('(?i)\\bbatteri\\s*lav\\b:?',' ')
                    | regex_replace('(?i)\\bbattery\\b:?',' ')
                    | regex_replace('(?i)\\bbatteri\\b:?',' ')
                    | regex_replace('\\s*\\+\\s*$','')
                    | regex_replace('\\s*:\\s*$','')
                    | regex_replace('\\s{2,}',' ')
                    | trim -%}
                {%- set age_s = (as_timestamp(now()) - as_timestamp(e.last_changed, default=0) | float(0)) | int(0) -%}
                {%- set d = (age_s // 86400) | int(0) -%}
                {%- set h = ((age_s % 86400) // 3600) | int(0) -%}
                {%- set m = ((age_s % 3600) // 60) | int(0) -%}
                {%- if d > 0 -%}
                  {%- set age_txt = d|string ~ 'd ' ~ h|string ~ 'h' -%}
                {%- elif h > 0 -%}
                  {%- set age_txt = h|string ~ 'h ' ~ m|string ~ 'm' -%}
                {%- elif m > 0 -%}
                  {%- set age_txt = m|string ~ 'm' -%}
                {%- else -%}
                  {%- set age_txt = (age_s % 60)|string ~ 's' -%}
                {%- endif -%}
                {%- set ns.lines = ns.lines + ['- ' ~ base ~ ' | ' ~ age_txt ~ ' / Lavt'] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.lines | join('\n') }}

      # Steg 4B – Fjern duplikater (digital vs prosent)
      - alias: "Steg 4B - Fjern duplikater (digital vs prosent)"
        variables:
          lite_batteri_digital_nodup: >-
            {%- set ns = namespace(lines=[]) -%}
            {%- set low_names = (lite_batteri_prosent | default(''))
                .split('\n')
                | map('trim')
                | select('match','^- ')
                | map('regex_replace','^- ','')
                | map('regex_replace','\\s*\\|.*$','')
                | map('regex_replace','\\s*\\+\\s*$', '')
                | map('regex_replace','\\s{2,}',' ')
                | map('lower')
                | list
            -%}
            {%- for line in (lite_batteri_digital | default('')).split('\n')
                  | map('trim')
                  | select('match','^- ') -%}
              {%- set raw = line | regex_replace('^- ','') -%}
              {%- set name_norm = raw
                  | regex_replace('\\s*\\|.*$','')
                  | regex_replace('\\s*\\+\\s*$', '')
                  | regex_replace('\\s{2,}',' ')
                  | lower
              -%}
              {%- if name_norm not in low_names -%}
                {%- set ns.lines = ns.lines + [ line ] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.lines | join('\n') }}

      # Steg 5B – Rydd bort meningsløse linjer (batteri nivå)
      - alias: "Steg 5B - Rydd bort meningsløse linjer (batteri nivå)"
        variables:
          lite_batteri_prosent_clean: >-
            {% set out = namespace(lines=[]) %}
            {% for line in (lite_batteri_prosent | default('')).split('\n') %}
              {% set l = line | trim %}
              {% if l == '' %}
              {% elif not (l.startswith('- ')) %}
              {% else %}
                {% set name = (l | regex_replace('^-\\s*','') | regex_replace('\\s*\\|.*$','') | trim) %}
                {% if name != '' and (name | lower) != 'battery' %}
                  {% set out.lines = out.lines + [l] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ out.lines | join('\n') }}

          lite_batteri_digital_clean: >-
            {% set out = namespace(lines=[]) %}
            {% for line in (lite_batteri_digital_nodup | default('')).split('\n') %}
              {% set l = line | trim %}
              {% if l == '' %}
              {% elif not (l.startswith('- ')) %}
              {% else %}
                {% set name = (l | regex_replace('^-\\s*','') | regex_replace('\\s*\\|.*$','') | trim) %}
                {% if name != '' and (name | lower) != 'battery' %}
                  {% set out.lines = out.lines + [l] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ out.lines | join('\n') }}

      # Steg 6B – Bygg samlet batteri nivå-melding
      - alias: "Steg 6B - Bygg samlet batteri nivå-melding"
        variables:
          combined_message_batteri: >-
            {% set parts = namespace(lines=[]) %}
            {% if (lite_batteri_prosent_clean | trim) != '' %}
              {% set parts.lines = parts.lines + ["Lavt batteri, under " ~ (threshold | string) ~ "%. (| Endret / Batteri%):", lite_batteri_prosent_clean, ""] %}
            {% endif %}
            {% if (lite_batteri_digital_clean | trim) != '' %}
              {% set parts.lines = parts.lines + ["Disse enhetene rapporterer digitalt lavt batteri:", lite_batteri_digital_clean, ""] %}
            {% endif %}
            {% if debug_on %}
              {% set parts.lines = parts.lines + [
                "---",
                "Debug (Del 1 – batteri nivå):",
                "- trigger: " ~ trigger_label,
                "- manual_run: " ~ (manual_run | string),
                "- threshold: " ~ (threshold | string) ~ "%",
                "- ignored_entities: " ~ ((ignore_entities | count) | string),
                "- ignored_devices: " ~ ((ignore_devices | count) | string)
              ] %}
            {% endif %}
            {{ (parts.lines | join('\n')) | trim }}

      # ── Del 2 – Langsomt signal ───────────────────────────────────────────────

      # Steg 7S – Bygg per-device aktivitetsindeks (langsomt signal)
      - alias: "Steg 7S - Bygg per-device aktivitetsindeks (langsomt signal)"
        variables:
          device_activity_index: |-
            {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
            {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}
            {%- set ns = namespace(idx={}, seen=[]) -%}

            {%- for s in states.sensor
                  | selectattr('attributes.device_class','defined')
                  | selectattr('attributes.device_class','eq','battery') -%}
              {%- set did = device_id(s.entity_id) -%}
              {%- if s.entity_id not in ignore_e
                  and did is not none
                  and did not in ignore_d
                  and did not in ns.seen -%}
                {%- set ns.seen = ns.seen + [did] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- for b in states.binary_sensor
                  | selectattr('attributes.device_class','eq','battery') -%}
              {%- set did = device_id(b.entity_id) -%}
              {%- if b.entity_id not in ignore_e
                  and did is not none
                  and did not in ignore_d
                  and did not in ns.seen -%}
                {%- set ns.seen = ns.seen + [did] -%}
              {%- endif -%}
            {%- endfor -%}

            {%- for did in ns.seen -%}
              {%- set w = namespace(ts=0, ent='', src='') -%}
              {%- for ent in device_entities(did) -%}
                {%- set st_obj = states[ent] -%}
                {%- if st_obj is not none -%}
                  {%- if st_obj.entity_id.split('.')[0] in ['sensor','binary_sensor'] -%}
                    {%- set t_upd = as_timestamp(st_obj.last_changed, default=0) | float(0) -%}
                    {%- if t_upd > w.ts -%}
                      {%- set w.ts = t_upd -%}
                      {%- set w.ent = ent -%}
                      {%- set w.src = 'meta:last_changed' -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- set ls = state_attr(ent,'last_seen') -%}
                  {%- if ls is not none -%}
                    {%- set t_ls = as_timestamp(ls, default=0) | float(0) -%}
                    {%- if t_ls > w.ts -%}
                      {%- set w.ts = t_ls -%}
                      {%- set w.ent = ent -%}
                      {%- set w.src = 'attr:last_seen' -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- if 'last_seen' in (ent | lower) -%}
                    {%- set t2 = as_timestamp(states(ent), default=0) | float(0) -%}
                    {%- if t2 > w.ts -%}
                      {%- set w.ts = t2 -%}
                      {%- set w.ent = ent -%}
                      {%- set w.src = 'state:last_seen_entity' -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set age_s = (as_timestamp(now()) - w.ts) | int(0) -%}
              {%- set ns.idx = dict(ns.idx, **{
                did: {
                  'winner_entity': w.ent,
                  'winner_source': w.src,
                  'winner_ts': w.ts,
                  'winner_age_s': age_s
                }
              }) -%}
            {%- endfor -%}
            {{ ns.idx | to_json }}
            {# Merk: output er JSON; størrelse er proporsjonal med antall unike devices. #}

      # Steg 8R – Nylig mistet signal (Del 3, kun ved time_pattern)
      - if:
          - condition: template
            value_template: "{{ trigger_is_time_pattern }}"
        then:
          # Steg 8R-A – Nylig mistet signal: rå liste
          - alias: "Steg 8R-A - Nylig mistet signal rå liste (Del 3)"
            variables:
              nylig_mistet_raw: |-
                {%- set threshold_s = (threshold_seconds | int(0)) -%}
                {%- set interval_s = (interval_seconds | int(0)) -%}
                {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
                {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}
                {%- set _raw_idx = device_activity_index | default({}) -%}
                {%- set idx = _raw_idx if _raw_idx is mapping else (_raw_idx | default('{}') | from_json) -%}
                {%- set ns = namespace(map={}, lines=[]) -%}

                {# ===== sensor battery ===== #}
                {%- for s in states.sensor
                      | selectattr('attributes.device_class','defined')
                      | selectattr('attributes.device_class','eq','battery') -%}
                  {%- set eid = s.entity_id -%}
                  {%- set did = device_id(eid) -%}
                  {%- if eid in ignore_e or (did and did in ignore_d) -%}
                  {%- else -%}
                    {%- set base = s.name
                        | regex_replace('(?i)(?:\\s|^)(battery|batteri|level)(?:\\s|$)', ' ')
                        | replace(' Battery+', '')
                        | regex_replace('\\s{2,}', ' ')
                        | regex_replace('\\s*\\+\\s*$', '')
                        | regex_replace('(?i)\\s*level\\s*$', '')
                        | trim -%}
                    {%- set norm = base | lower | regex_replace('[^\\w\\s:]', '') | regex_replace('\\s{2,}', ' ') | trim -%}
                    {%- if did and did in idx -%}
                      {%- set age_s = idx[did]['winner_age_s'] | int(0) -%}
                    {%- else -%}
                      {%- set ts = as_timestamp(s.last_changed, default=0) | float(0) -%}
                      {%- set age_s = (as_timestamp(now()) - ts) | int(0) -%}
                    {%- endif -%}
                    {%- set st = s.state -%}
                    {%- set in_alert_window = (age_s >= threshold_s) and (age_s < interval_s) -%}
                    {%- if in_alert_window -%}
                      {%- if norm != '' -%}
                        {%- set keep = false -%}
                        {%- if norm not in ns.map -%}
                          {%- set keep = true -%}
                        {%- else -%}
                          {%- set cur = ns.map[norm] -%}
                          {%- set cur_unavail = cur['state'] in ['unknown','unavailable'] -%}
                          {%- if is_unavail and not cur_unavail -%}
                            {%- set keep = true -%}
                          {%- elif (age_s | int(0)) > (cur['age_s'] | int(0)) -%}
                            {%- set keep = true -%}
                          {%- endif -%}
                        {%- endif -%}
                        {%- if keep -%}
                          {%- set ns.map = dict(ns.map, **{norm: {'base': base, 'age_s': age_s, 'state': st}}) -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}

                {# ===== binary_sensor battery ===== #}
                {%- for b in states.binary_sensor
                      | selectattr('attributes.device_class','eq','battery') -%}
                  {%- set eid = b.entity_id -%}
                  {%- set did = device_id(eid) -%}
                  {%- if eid in ignore_e or (did and did in ignore_d) -%}
                  {%- else -%}
                    {%- set base = b.name
                        | regex_replace('(?i)\\bbattery\\s*low\\b:?',' ')
                        | regex_replace('(?i)\\bbatteri\\s*lav\\b:?',' ')
                        | regex_replace('(?i)\\bbattery\\b:?',' ')
                        | regex_replace('(?i)\\bbatteri\\b:?',' ')
                        | regex_replace('\\s*\\+\\s*$','')
                        | regex_replace('\\s*:\\s*$','')
                        | regex_replace('\\s{2,}',' ')
                        | trim -%}
                    {%- set norm = base | lower | regex_replace('[^\\w\\s:]', '') | regex_replace('\\s{2,}', ' ') | trim -%}
                    {%- if did and did in idx -%}
                      {%- set age_s = idx[did]['winner_age_s'] | int(0) -%}
                    {%- else -%}
                      {%- set ts = as_timestamp(b.last_changed, default=0) | float(0) -%}
                      {%- set age_s = (as_timestamp(now()) - ts) | int(0) -%}
                    {%- endif -%}
                    {%- set st = b.state -%}
                    {%- set in_alert_window = (age_s >= threshold_s) and (age_s < interval_s) -%}
                    {%- if in_alert_window -%}
                      {%- if norm != '' -%}
                        {%- set keep = false -%}
                        {%- if norm not in ns.map -%}
                          {%- set keep = true -%}
                        {%- else -%}
                          {%- set cur = ns.map[norm] -%}
                          {%- set cur_unavail = cur['state'] in ['unknown','unavailable'] -%}
                          {%- if is_unavail and not cur_unavail -%}
                            {%- set keep = true -%}
                          {%- elif (age_s | int(0)) > (cur['age_s'] | int(0)) -%}
                            {%- set keep = true -%}
                          {%- endif -%}
                        {%- endif -%}
                        {%- if keep -%}
                          {%- set ns.map = dict(ns.map, **{norm: {'base': base, 'age_s': age_s, 'state': st}}) -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}

                {# ===== Render sortert (eldst først) ===== #}
                {%- set items = namespace(lst=[]) -%}
                {%- for norm, it in ns.map.items() -%}
                  {%- set items.lst = items.lst + [{'age_s': it['age_s']|int(0), 'base': it['base']|string, 'state': it['state']|string}] -%}
                {%- endfor -%}
                {%- for it in (items.lst | sort(attribute='age_s', reverse=true)) -%}
                  {%- set age_s = it.age_s -%}
                  {%- set base = it.base -%}
                  {%- set d = (age_s // 86400) | int(0) -%}
                  {%- set h = ((age_s % 86400) // 3600) | int(0) -%}
                  {%- set m = ((age_s % 3600) // 60) | int(0) -%}
                  {%- if d > 0 -%}
                    {%- set age_txt = d|string ~ 'd ' ~ h|string ~ 'h' -%}
                  {%- elif h > 0 -%}
                    {%- set age_txt = h|string ~ 'h ' ~ m|string ~ 'm' -%}
                  {%- elif m > 0 -%}
                    {%- set age_txt = m|string ~ 'm' -%}
                  {%- else -%}
                    {%- set s = (age_s % 60) | int(0) -%}
                    {%- set age_txt = s|string ~ 's' -%}
                  {%- endif -%}
                  {%- set ns.lines = ns.lines + ['- ' ~ base ~ ' | ' ~ age_txt] -%}
                {%- endfor -%}
                {{ ns.lines | join('\n') }}
              # Alltid synlig i trace – viser hvilken entity/kilde som ga nyeste aktivitet
              nylig_mistet_debug: |-
                {%- set threshold_s = (threshold_seconds | int(0)) -%}
                {%- set interval_s = (interval_seconds | int(0)) -%}
                {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
                {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}
                {%- set _raw_idx = device_activity_index | default({}) -%}
                {%- set idx = _raw_idx if _raw_idx is mapping else (_raw_idx | default('{}') | from_json) -%}
                {%- set ns = namespace(out=[]) -%}
                {%- for s in states.sensor
                      | selectattr('attributes.device_class','defined')
                      | selectattr('attributes.device_class','eq','battery') -%}
                  {%- set eid = s.entity_id -%}
                  {%- set did = device_id(eid) -%}
                  {%- if eid not in ignore_e and not (did and did in ignore_d) -%}
                    {%- if did and did in idx -%}
                      {%- set w = idx[did] -%}
                      {%- set age_s = w['winner_age_s'] | int(0) -%}
                    {%- else -%}
                      {%- set age_s = (as_timestamp(now()) - as_timestamp(s.last_changed, default=0) | float(0)) | int(0) -%}
                      {%- set w = {'winner_entity': eid, 'winner_source': 'meta:last_changed', 'winner_age_s': age_s} -%}
                    {%- endif -%}
                    {%- set st = s.state -%}
                    {%- set is_unavail = st in ['unknown','unavailable'] -%}
                    {%- set in_alert_window = (age_s >= threshold_s) and (age_s < interval_s) -%}
                    {%- if in_alert_window -%}
                      {%- set ns.out = ns.out + [{'entity_id': eid, 'name': s.name, 'state': st, 'age_s': age_s, 'winner_entity': w['winner_entity'], 'winner_source': w['winner_source'], 'winner_age_s': w['winner_age_s']}] -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- for b in states.binary_sensor
                      | selectattr('attributes.device_class','eq','battery') -%}
                  {%- set eid = b.entity_id -%}
                  {%- set did = device_id(eid) -%}
                  {%- if eid not in ignore_e and not (did and did in ignore_d) -%}
                    {%- if did and did in idx -%}
                      {%- set w = idx[did] -%}
                      {%- set age_s = w['winner_age_s'] | int(0) -%}
                    {%- else -%}
                      {%- set age_s = (as_timestamp(now()) - as_timestamp(b.last_changed, default=0) | float(0)) | int(0) -%}
                      {%- set w = {'winner_entity': eid, 'winner_source': 'meta:last_changed', 'winner_age_s': age_s} -%}
                    {%- endif -%}
                    {%- set st = b.state -%}
                    {%- set is_unavail = st in ['unknown','unavailable'] -%}
                    {%- set in_alert_window = (age_s >= threshold_s) and (age_s < interval_s) -%}
                    {%- if in_alert_window -%}
                      {%- set ns.out = ns.out + [{'entity_id': eid, 'name': b.name, 'state': st, 'age_s': age_s, 'winner_entity': w['winner_entity'], 'winner_source': w['winner_source'], 'winner_age_s': w['winner_age_s']}] -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.out | to_json }}
          # Steg 8R-B – Nylig mistet signal: renset
          - alias: "Steg 8R-B - Nylig mistet signal renset (Del 3)"
            variables:
              nylig_mistet_clean: >-
                {% set out = namespace(map={}, order=[]) %}
                {% for line in (nylig_mistet_raw | default('')).split('\n') %}
                  {% set l = line | trim %}
                  {% if l == '' %}
                  {% elif not l.startswith('- ') %}
                  {% else %}
                    {% set name = (l | regex_replace('^-\\s*','') | regex_replace('\\s*\\|.*$','') | trim) %}
                    {% set canon = name
                      | regex_replace('(?i)\\s+level\\s*$','')
                      | regex_replace('\\s{2,}',' ')
                      | trim
                      | lower %}
                    {% if name != '' and canon != 'battery' %}
                      {% if canon not in out.map %}
                        {% set out.map = dict(out.map, **{canon: l}) %}
                        {% set out.order = out.order + [canon] %}
                      {% else %}
                        {% set current = out.map[canon] %}
                        {% set current_name = (current | regex_replace('^-\\s*','') | regex_replace('\\s*\\|.*$','') | trim) %}
                        {% if (name | length) < (current_name | length) %}
                          {% set out.map = dict(out.map, **{canon: l}) %}
                        {% endif %}
                      {% endif %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {% set lines = namespace(lst=[]) %}
                {% for canon in out.order %}
                  {% set lines.lst = lines.lst + [out.map[canon]] %}
                {% endfor %}
                {{ lines.lst | join('\n') }}
        else:
          # Ikke time_pattern – sett tomme variabler så etterfølgende steg kan referere dem
          - alias: "Steg 8R - Ikke time_pattern, tomme variabler"
            variables:
              nylig_mistet_raw: ""
              nylig_mistet_debug: ""
              nylig_mistet_clean: ""

      # Steg 8S – Finn batteri-enheter uten signal på lenge (langsomt, rå)
      - alias: "Steg 8S - Finn batteri-enheter uten signal på lenge (langsomt, rå)"
        variables:
          lang_offline_raw: |-
            {%- set threshold_s = (max_age_seconds | int(0)) -%}
            {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
            {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}
            {%- set _raw_idx = device_activity_index | default({}) -%}
            {%- set idx = _raw_idx if _raw_idx is mapping else (_raw_idx | default('{}') | from_json) -%}
            {%- set ns = namespace(map={}, lines=[]) -%}

            {# ===== sensor battery ===== #}
            {%- for s in states.sensor
                  | selectattr('attributes.device_class','defined')
                  | selectattr('attributes.device_class','eq','battery') -%}
              {%- set eid = s.entity_id -%}
              {%- set did = device_id(eid) -%}
              {%- if eid in ignore_e or (did and did in ignore_d) -%}
                {# ignorert #}
              {%- else -%}
                {%- set base = s.name
                    | regex_replace('(?i)(?:\\s|^)(battery|batteri|level)(?:\\s|$)', ' ')
                    | replace(' Battery+', '')
                    | regex_replace('\\s{2,}', ' ')
                    | regex_replace('\\s*\\+\\s*$', '')
                    | regex_replace('(?i)\\s*level\\s*$', '')
                    | trim -%}
                {%- set norm = base | lower | regex_replace('[^\\w\\s:]', '') | regex_replace('\\s{2,}', ' ') | trim -%}
                {%- if did and did in idx -%}
                  {%- set age_s = idx[did]['winner_age_s'] | int(0) -%}
                {%- else -%}
                  {%- set ts = as_timestamp(s.last_changed, default=0) | float(0) -%}
                  {%- set age_s = (as_timestamp(now()) - ts) | int(0) -%}
                {%- endif -%}
                {%- set st = s.state -%}
                {%- if age_s >= threshold_s and norm != '' -%}
                  {%- set keep = false -%}
                  {%- if norm not in ns.map -%}
                    {%- set keep = true -%}
                  {%- else -%}
                    {%- set cur = ns.map[norm] -%}
                    {%- if (age_s | int(0)) > (cur['age_s'] | int(0)) -%}
                      {%- set keep = true -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- if keep -%}
                    {%- set ns.map = dict(ns.map, **{norm: {'base': base, 'age_s': age_s, 'state': st}}) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}

            {# ===== binary_sensor battery ===== #}
            {%- for b in states.binary_sensor
                  | selectattr('attributes.device_class','eq','battery') -%}
              {%- set eid = b.entity_id -%}
              {%- set did = device_id(eid) -%}
              {%- if eid in ignore_e or (did and did in ignore_d) -%}
                {# ignorert #}
              {%- else -%}
                {%- set base = b.name
                    | regex_replace('(?i)\\bbattery\\s*low\\b:?',' ')
                    | regex_replace('(?i)\\bbatteri\\s*lav\\b:?',' ')
                    | regex_replace('(?i)\\bbattery\\b:?',' ')
                    | regex_replace('(?i)\\bbatteri\\b:?',' ')
                    | regex_replace('\\s*\\+\\s*$','')
                    | regex_replace('\\s*:\\s*$','')
                    | regex_replace('\\s{2,}',' ')
                    | trim -%}
                {%- set norm = base | lower | regex_replace('[^\\w\\s:]', '') | regex_replace('\\s{2,}', ' ') | trim -%}
                {%- if did and did in idx -%}
                  {%- set age_s = idx[did]['winner_age_s'] | int(0) -%}
                {%- else -%}
                  {%- set ts = as_timestamp(b.last_changed, default=0) | float(0) -%}
                  {%- set age_s = (as_timestamp(now()) - ts) | int(0) -%}
                {%- endif -%}
                {%- set st = b.state -%}
                {%- if age_s >= threshold_s and norm != '' -%}
                  {%- set keep = false -%}
                  {%- if norm not in ns.map -%}
                    {%- set keep = true -%}
                  {%- else -%}
                    {%- set cur = ns.map[norm] -%}
                    {%- if (age_s | int(0)) > (cur['age_s'] | int(0)) -%}
                      {%- set keep = true -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- if keep -%}
                    {%- set ns.map = dict(ns.map, **{norm: {'base': base, 'age_s': age_s, 'state': st}}) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}

            {# ===== Render sortert (eldst først) ===== #}
            {%- set items = namespace(lst=[]) -%}
            {%- for norm, it in ns.map.items() -%}
              {%- set items.lst = items.lst + [{'age_s': it['age_s']|int(0), 'base': it['base']|string, 'state': it['state']|string}] -%}
            {%- endfor -%}
            {%- for it in (items.lst | sort(attribute='age_s', reverse=true)) -%}
              {%- set age_s = it.age_s -%}
              {%- set base = it.base -%}
              {%- set d = (age_s // 86400) | int(0) -%}
              {%- set h = ((age_s % 86400) // 3600) | int(0) -%}
              {%- set m = ((age_s % 3600) // 60) | int(0) -%}
              {%- if d > 0 -%}
                {%- set age_txt = d|string ~ 'd ' ~ h|string ~ 'h' -%}
              {%- elif h > 0 -%}
                {%- set age_txt = h|string ~ 'h ' ~ m|string ~ 'm' -%}
              {%- elif m > 0 -%}
                {%- set age_txt = m|string ~ 'm' -%}
              {%- else -%}
                {%- set s = (age_s % 60) | int(0) -%}
                {%- set age_txt = s|string ~ 's' -%}
              {%- endif -%}
              {%- set ns.lines = ns.lines + ['- ' ~ base ~ ' | ' ~ age_txt] -%}
            {%- endfor -%}
            {{ ns.lines | join('\n') }}

          # Alltid synlig i trace – viser hvilken entity/kilde som ga nyeste aktivitet
          lang_offline_debug: |-
            {%- set threshold_s = (max_age_seconds | int(0)) -%}
            {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
            {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}
            {%- set _raw_idx = device_activity_index | default({}) -%}
            {%- set idx = _raw_idx if _raw_idx is mapping else (_raw_idx | default('{}') | from_json) -%}
            {%- set ns = namespace(out=[]) -%}
            {%- for s in states.sensor
                  | selectattr('attributes.device_class','defined')
                  | selectattr('attributes.device_class','eq','battery') -%}
              {%- set eid = s.entity_id -%}
              {%- set did = device_id(eid) -%}
              {%- if eid not in ignore_e and not (did and did in ignore_d) -%}
                {%- if did and did in idx -%}
                  {%- set w = idx[did] -%}
                  {%- set age_s = w['winner_age_s'] | int(0) -%}
                {%- else -%}
                  {%- set age_s = (as_timestamp(now()) - as_timestamp(s.last_changed, default=0) | float(0)) | int(0) -%}
                  {%- set w = {'winner_entity': eid, 'winner_source': 'meta:last_changed', 'winner_age_s': age_s} -%}
                {%- endif -%}
                {%- set st = s.state -%}
                {%- if age_s >= threshold_s -%}
                  {%- set ns.out = ns.out + [{'entity_id': eid, 'name': s.name, 'state': st, 'age_s': age_s, 'winner_entity': w['winner_entity'], 'winner_source': w['winner_source'], 'winner_age_s': w['winner_age_s']}] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- for b in states.binary_sensor
                  | selectattr('attributes.device_class','eq','battery') -%}
              {%- set eid = b.entity_id -%}
              {%- set did = device_id(eid) -%}
              {%- if eid not in ignore_e and not (did and did in ignore_d) -%}
                {%- if did and did in idx -%}
                  {%- set w = idx[did] -%}
                  {%- set age_s = w['winner_age_s'] | int(0) -%}
                {%- else -%}
                  {%- set age_s = (as_timestamp(now()) - as_timestamp(b.last_changed, default=0) | float(0)) | int(0) -%}
                  {%- set w = {'winner_entity': eid, 'winner_source': 'meta:last_changed', 'winner_age_s': age_s} -%}
                {%- endif -%}
                {%- set st = b.state -%}
                {%- if age_s >= threshold_s -%}
                  {%- set ns.out = ns.out + [{'entity_id': eid, 'name': b.name, 'state': st, 'age_s': age_s, 'winner_entity': w['winner_entity'], 'winner_source': w['winner_source'], 'winner_age_s': w['winner_age_s']}] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.out | to_json }}

      # Steg 9S – Rydd bort meningsløse linjer (langsomt signal)
      - alias: "Steg 9S - Rydd bort meningsløse linjer (langsomt signal)"
        variables:
          lang_offline_clean: >-
            {% set out = namespace(map={}, order=[]) %}
            {% for line in (lang_offline_raw | default('')).split('\n') %}
              {% set l = line | trim %}
              {% if l == '' %}
              {% elif not l.startswith('- ') %}
              {% else %}
                {% set name = (l | regex_replace('^-\\s*','') | regex_replace('\\s*\\|.*$','') | trim) %}
                {% set canon = name
                  | regex_replace('(?i)\\s+level\\s*$','')
                  | regex_replace('\\s{2,}',' ')
                  | trim
                  | lower %}
                {% if name != '' and canon != 'battery' %}
                  {% if canon not in out.map %}
                    {% set out.map = dict(out.map, **{canon: l}) %}
                    {% set out.order = out.order + [canon] %}
                  {% else %}
                    {% set current = out.map[canon] %}
                    {% set current_name = (current | regex_replace('^-\\s*','') | regex_replace('\\s*\\|.*$','') | trim) %}
                    {% if (name | length) < (current_name | length) %}
                      {% set out.map = dict(out.map, **{canon: l}) %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% set lines = namespace(lst=[]) %}
            {% for canon in out.order %}
              {% set lines.lst = lines.lst + [out.map[canon]] %}
            {% endfor %}
            {{ lines.lst | join('\n') }}

