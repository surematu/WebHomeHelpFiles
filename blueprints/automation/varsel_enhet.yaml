          combined_message_batteri_final: >-
            {% set parts = namespace(lines=[]) %}
            {% if (lite_batteri_prosent_clean | trim) != '' %}
              {% set parts.lines = parts.lines + ["Lavt batteri, under " ~ (threshold | string) ~ "%. (| Endret / Batteri%):", lite_batteri_prosent_clean, ""] %}
            {% endif %}
            {% if (lite_batteri_digital_final | trim) != '' %}
              {% set parts.lines = parts.lines + ["Disse enhetene rapporterer digitalt lavt batteri:", lite_batteri_digital_final, ""] %}
            {% endif %}
            {% if debug_on %}
              {% set parts.lines = parts.lines + [
                "---",
                "Debug (Del 1 – batteri nivå):",
                "- trigger: " ~ trigger_label,
                "- manual_run: " ~ (manual_run | string),
                "- threshold: " ~ (threshold | string) ~ "%",
                "- ignored_entities: " ~ ((ignore_entities | count) | string),
                "- ignored_devices: " ~ ((ignore_devices | count) | string)
              ] %}
            {% endif %}
            {{ (parts.lines | join('\n')) | trim }}

      # ── Send varsel ───────────────────────────────────────────────────────────

      # Steg 11A – Sjekk om nylig-mistet skyldes HA-restart
      # all_offline_at_restart = true dersom alle nylig-offline enheter
      # gikk offline innenfor 10 min av sist HA-oppstart.
      - alias: "Steg 11A - Sjekk om nylig-mistet skyldes HA-restart"
        variables:
          all_offline_at_restart: >-
            {%- set tol = 600 -%}
            {%- set _raw = nylig_mistet_debug | default([]) -%}
            {%- set dbg = _raw if (_raw is iterable and _raw is not string)
                else (_raw | from_json if (_raw | string | trim | length > 0) else []) -%}
            {%- set cnt = dbg | count -%}
            {%- if not trigger_is_time_pattern or cnt == 0 or ha_start_age_s <= 0 -%}
              false
            {%- else -%}
              {%- set ns = namespace(all_match=true) -%}
              {%- for item in dbg -%}
                {%- set age = item.winner_age_s | int(0) -%}
                {%- if ((age - ha_start_age_s) | abs) > tol -%}
                  {%- set ns.all_match = false -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.all_match }}
            {%- endif -%}

      # Steg 11 – Bygg samlet varsel (planlagt sjekk)
      - alias: "Steg 11 - Bygg samlet varsel (planlagt sjekk)"
        variables:
          notification_title: >-
            {%- set nylig_cnt = (nylig_mistet_clean | default('') | trim)
                .split('\n') | select('match', '^- ') | list | count -%}
            {%- if trigger_is_time_pattern and nylig_cnt > 0 -%}
              {%- set _is_restart = all_offline_at_restart | bool(false) -%}
              {%- if uptime_should_notify_unified -%}
                {%- set _pu = uptime_report_payload if uptime_report_payload is mapping else uptime_report_payload | from_json -%}
                {%- set _uptime_new = _pu.new_down_count | int(0) -%}
                {%- set _total_new = nylig_cnt + _uptime_new -%}
                {%- if _total_new == 1 and nylig_cnt == 1 -%}
                  {%- set _first = (nylig_mistet_clean | trim).split('\n')[0]
                      | regex_replace('^-\\s*', '') | regex_replace('\\s*\\|.*$', '') | trim -%}
                  🔴 {{ _first }}{{ ' uten signal etter restart' if _is_restart else ' mistet signal' }}
                {%- elif _total_new == 1 and _uptime_new == 1 -%}
                  🔴 {{ _pu.down_new[0].device_name }} gikk offline
                {%- else -%}
                  🔴 {{ _total_new }} nye enheter med avvik
                {%- endif -%}
              {%- elif nylig_cnt == 1 -%}
                {%- set _first = (nylig_mistet_clean | trim).split('\n')[0]
                    | regex_replace('^-\\s*', '') | regex_replace('\\s*\\|.*$', '') | trim -%}
                🔴 {{ _first }}{{ ' uten signal etter restart' if _is_restart else ' mistet signal' }}
              {%- else -%}
                🔴 {{ nylig_cnt }} enheter{{ ' uten signal etter restart' if _is_restart else ' mistet signal' }}
              {%- endif -%}
            {%- else -%}
            {%- set ns = namespace(trigger_reason_device_names=[]) -%}
            {%- for line in (lang_offline_clean | default('')).split('\n') | map('trim') | select('match', '^- ') -%}
              {%- set name = line | regex_replace('^-\\s*', '') | regex_replace('\\s*\\|.*$', '') | trim -%}
              {%- if name != '' and (name | lower) not in (ns.trigger_reason_device_names | map('lower') | list) -%}
                {%- set ns.trigger_reason_device_names = ns.trigger_reason_device_names + [name] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set total_ns = namespace(names=ns.trigger_reason_device_names) -%}
            {%- for section in [
              offline_full_final | default(''),
              lite_batteri_prosent_clean | default(''),
              lite_batteri_digital_final | default('')
            ] -%}
              {%- for line in section.split('\n') | map('trim') | select('match', '^- ') -%}
                {%- set name = line | regex_replace('^-\\s*', '') | regex_replace('\\s*\\|.*$', '') | trim -%}
                {%- if name != '' and (name | lower) not in (total_ns.names | map('lower') | list) -%}
                  {%- set total_ns.names = total_ns.names + [name] -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {%- set has_signal_loss = (lang_offline_clean | trim) != '' or (offline_full_final | trim) != '' -%}
            {%- set has_low_battery = (lite_batteri_prosent_clean | trim) != '' or (lite_batteri_digital_final | trim) != '' -%}
            {%- set has_uptime_issue = uptime_should_notify_unified -%}
            {%- if has_uptime_issue -%}
              {%- set p_u = uptime_report_payload if uptime_report_payload is mapping else uptime_report_payload | from_json -%}
              {%- for dev in (p_u.down_all + p_u.unstable_devices) -%}
                {%- if (dev.device_name | lower) not in (total_ns.names | map('lower') | list) -%}
                  {%- set total_ns.names = total_ns.names + [dev.device_name] -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
            {%- set reason_cnt = ns.trigger_reason_device_names | count -%}
            {%- set total_cnt = total_ns.names | count -%}
            {%- if has_uptime_issue and trigger_is_time_pattern -%}
              {{ uptime_notification_title }}
            {%- elif has_uptime_issue and (has_signal_loss or has_low_battery) -%}
              {%- if total_cnt == 1 -%}
                🔴 1 enhet med avvik
              {%- else -%}
                🔴 {{ total_cnt }} enheter med avvik
              {%- endif -%}
            {%- elif has_uptime_issue -%}
              {{ uptime_notification_title }}
            {%- elif manual_run and total_cnt > 0 -%}
              {%- if total_cnt == 1 -%}
                {{ '🔴' if has_signal_loss else '🟠' }} 1 enhet med avvik
              {%- else -%}
                {{ '🔴' if has_signal_loss else '🟠' }} {{ total_cnt }} enheter med avvik
              {%- endif -%}
            {%- elif has_signal_loss and reason_cnt == 1 -%}
              🔴 {{ ns.trigger_reason_device_names[0] }} uten signal
            {%- elif has_signal_loss and reason_cnt > 1 -%}
              🔴 {{ reason_cnt }} enheter uten signal
            {%- elif has_signal_loss -%}
              🔴 Enheter uten signal
            {%- elif has_low_battery and total_cnt == 1 -%}
              🟠 1 enhet med lavt batteri
            {%- elif has_low_battery and total_cnt > 1 -%}
              🟠 {{ total_cnt }} enheter med lavt batteri
            {%- elif has_low_battery -%}
              🟠 Lavt batterinivå
            {%- else -%}
              🟠 Batterivarsel
            {%- endif -%}
            {%- endif -%}

          merged_message: >-
            {% set parts = namespace(lines=[]) %}
            {% if (nylig_mistet_clean | trim) != '' %}
              {% set parts.lines = parts.lines + [
                "Disse enhetene mistet signal siden forrige sjekk (terskel: " ~ (threshold_label | string) ~ "):",
                nylig_mistet_clean,
                ""
              ] %}
            {% endif %}
            {% if (combined_message_signal | trim) != '' %}
              {% set parts.lines = parts.lines + [combined_message_signal | trim] %}
            {% endif %}
            {% if (combined_message_batteri_final | trim) != '' %}
              {% if parts.lines | count > 0 %}
                {% set parts.lines = parts.lines + [''] %}
              {% endif %}
              {% set parts.lines = parts.lines + [combined_message_batteri_final | trim] %}
            {% endif %}
            {% if uptime_should_notify_unified %}
              {% if parts.lines | count > 0 %}
                {% set parts.lines = parts.lines + [''] %}
              {% endif %}
              {% set parts.lines = parts.lines + [uptime_combined_message | trim] %}
            {% endif %}
            {{ (parts.lines | join('\n')) | trim }}

      # Steg 11B – Beregn om varselet skal sendes
      # Felles krav: merged_message må ikke være tom.
      # time_pattern-kjøringer: i tillegg kreves nylig-mistet-seksjon eller Uptime Kuma-innhold
      #   (for å unngå tomme time_pattern-varsler der ingenting nytt har skjedd).
      # Planlagte/manuelle kjøringer: ingen ekstra krav utover ikke-tom melding.
      - alias: "Steg 11B - Beregn should_send"
        variables:
          should_send: >-
            {{
              merged_message | trim != ''
              and (
                not trigger_is_time_pattern
                or (nylig_mistet_clean | trim) != ''
                or uptime_should_notify_unified
              )
            }}

      # Steg 12 – Send samlet varsel (planlagt sjekk)
      - alias: "Steg 12 - Send samlet varsel (planlagt sjekk)"
        if:
          - condition: template
            value_template: "{{ should_send }}"
        then:
          - action: script.varsel_pushover_send_melding_webhome
            data:
              title: "{{ notification_title | trim }}"
              message: "{{ merged_message }}"
              destination: "{{ pushover_destination }}"
              priority: "{{ effective_priority | int(0) }}"
              ttl: "{{ pushover_ttl_seconds }}"
