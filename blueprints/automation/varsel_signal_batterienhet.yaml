blueprint:
  name: Varsel - Batteri-enheter uten signal på lenge (WebHome)
  description: >
    Varsler når batteri-enheter ikke har rapportert inn på en stund.

    Slik finner vi "sist sett" (mest robust):
      - Vi tar NYESTE tidspunkt på hele device-et ved å se på alle entities på samme device:
        * state_attr(entity,'last_seen') hvis finnes
        * entity_id som inneholder "last_seen" (og parsbar timestamp i state)
        * ellers fallback: entity.last_changed  (ikke last_updated, da last_updated
          også endres ved attribute-oppdateringer uten at state faktisk endrer seg)
      -> Dette gjør at BLE/Zigbee-enheter som oppdaterer f.eks. "Signal Strength" ofte,
         ikke feilaktig flagges bare fordi batteri-% ikke endrer seg.

    Overvåker:
      - sensor.* med device_class: battery
      - binary_sensor.* med device_class: battery

    Format:
      - "- Navn (5h 39m)" (ingen batteri % og ingen signal)

    Terskel:
      - Kan settes som duration (f.eks. 00:05:00 for test), default 72 timer.

    Blueprint versjon: 2026.03.01
  domain: automation
  author: WebHome
  source_url: https://github.com/surematu/WebHomeHelpFiles/blob/main/blueprints/automation/varsel_signal_batterienhet.yaml
  homeassistant:
    min_version: 2025.11.0

  input:
    notify_target:
      name: Send varsel til
      description: Velg én eller flere notify-tjenester
      selector:
        entity:
          domain: notify
          multiple: true

    max_age:
      name: Maks tid siden sist signal
      description: >
        Varsle hvis enhet ikke er sett på mer enn dette. (Default 72 timer.)
        Kan reduseres til 15 minutter hvis du kun har enheter som responderer raskt.
        NB: Shelly WiFi-temperatursensorer responderer noen ganger ikke på 1-2 timer.
      default:
        hours: 72
      selector:
        duration:

    include_unavailable:
      name: Ta med unknown/unavailable i varsel
      description: >
        Hvis på: enheter der batteri-entity er unknown/unavailable blir også listet.
        Hvis du får støy, sett denne til av.
      default: true
      selector:
        boolean:

    ignore_entities:
      name: Ignorer entities (valgfritt)
      description: Velg entities du vil skjule fra rapporten.
      default: []
      selector:
        entity:
          multiple: true

    ignore_devices:
      name: Ignorer devices (valgfritt)
      description: Velg devices du vil skjule (skjuler alle batteri-entities knyttet til device).
      default: []
      selector:
        device:
          multiple: true

    check_time:
      name: Tid for planlagt sjekk
      default: "09:00:00"
      selector:
        time:

    check_weekdays:
      name: Ukedag(er) for planlagt sjekk
      default:
        - mon
        - wed
        - fri
      selector:
        select:
          multiple: true
          mode: list
          options:
            - { label: Mandag, value: mon }
            - { label: Tirsdag, value: tue }
            - { label: Onsdag, value: wed }
            - { label: Torsdag, value: thu }
            - { label: Fredag, value: fri }
            - { label: Lørdag, value: sat }
            - { label: Søndag, value: sun }

    run_on_startup:
      name: Kjør ved oppstart av Home Assistant
      default: false
      selector:
        boolean:

    include_debug_details:
      name: Legg til debug-detaljer i varselet
      default: false
      selector:
        boolean:

mode: restart

trigger:
  - platform: time
    at: !input check_time
    weekday: !input check_weekdays
    id: scheduled_check

  - platform: homeassistant
    event: start
    id: ha_start
    enabled: !input run_on_startup

condition: []

action:
  # Steg 1 - Inputs -> tydelige variabler
  - alias: "Steg 1 - Sett grunnvariabler"
    variables:
      max_age: !input max_age
      include_unavailable: !input include_unavailable
      ignore_entities: !input ignore_entities
      ignore_devices: !input ignore_devices
      debug_on: !input include_debug_details

      # Bygg terskel i sekunder og en fin label (for header)
      max_age_seconds: >-
        {% set d = max_age %}
        {{ (d.get('days',0)|int * 86400)
         + (d.get('hours',0)|int * 3600)
         + (d.get('minutes',0)|int * 60)
         + (d.get('seconds',0)|int) }}
      max_age_label: >-
        {% set d = max_age %}
        {% set days = d.get('days',0)|int %}
        {% set hours = d.get('hours',0)|int %}
        {% set mins = d.get('minutes',0)|int %}
        {% set secs = d.get('seconds',0)|int %}
        {% set parts = namespace(p=[]) %}
        {% if days > 0 %}{% set parts.p = parts.p + [days|string ~ 'd'] %}{% endif %}
        {% if hours > 0 %}{% set parts.p = parts.p + [hours|string ~ 'h'] %}{% endif %}
        {% if mins > 0 %}{% set parts.p = parts.p + [mins|string ~ 'm'] %}{% endif %}
        {% if secs > 0 and (days==0 and hours==0) %}{% set parts.p = parts.p + [secs|string ~ 's'] %}{% endif %}
        {{ parts.p | join(' ') if parts.p | count > 0 else '0s' }}

  # Steg 2A - Bygg per-device aktivitetsindeks (synlig i trace/debug)
  # For hvert device med en batteri-entity: finn hvilken entity som gir
  # den nyeste aktiviteten (winner_entity/source/ts/age_s).
  - alias: "Steg 2A - Bygg per-device aktivitetsindeks"
    variables:
      device_activity_index: |-
        {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
        {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}
        {%- set ns = namespace(idx={}, seen=[]) -%}

        {# Samle unike device_ids fra batteri-entities (sensor + binary_sensor) #}
        {%- for s in states.sensor
              | selectattr('attributes.device_class','defined')
              | selectattr('attributes.device_class','eq','battery') -%}
          {%- set did = device_id(s.entity_id) -%}
          {%- if s.entity_id not in ignore_e
              and did is not none
              and did not in ignore_d
              and did not in ns.seen -%}
            {%- set ns.seen = ns.seen + [did] -%}
          {%- endif -%}
        {%- endfor -%}
        {%- for b in states.binary_sensor
              | selectattr('attributes.device_class','eq','battery') -%}
          {%- set did = device_id(b.entity_id) -%}
          {%- if b.entity_id not in ignore_e
              and did is not none
              and did not in ignore_d
              and did not in ns.seen -%}
            {%- set ns.seen = ns.seen + [did] -%}
          {%- endif -%}
        {%- endfor -%}

        {# For hvert device_id: finn vinnende entity (nyeste aktivitet) #}
        {%- for did in ns.seen -%}
          {%- set w = namespace(ts=0, ent='', src='') -%}
          {%- for ent in device_entities(did) -%}
            {%- set st_obj = states[ent] -%}
            {%- if st_obj is not none -%}

              {# A) last_changed (baseline – reflects actual state changes, not just attribute writes) #}
              {%- set t_upd = as_timestamp(st_obj.last_changed, default=0) | float(0) -%}
              {%- if t_upd > w.ts -%}
                {%- set w.ts = t_upd -%}
                {%- set w.ent = ent -%}
                {%- set w.src = 'meta:last_changed' -%}
              {%- endif -%}

              {# B) last_seen-attributt (vinner hvis nyere) #}
              {%- set ls = state_attr(ent,'last_seen') -%}
              {%- if ls is not none -%}
                {%- set t_ls = as_timestamp(ls, default=0) | float(0) -%}
                {%- if t_ls > w.ts -%}
                  {%- set w.ts = t_ls -%}
                  {%- set w.ent = ent -%}
                  {%- set w.src = 'attr:last_seen' -%}
                {%- endif -%}
              {%- endif -%}

              {# C) last_seen-sensor med timestamp i state (vinner hvis nyere) #}
              {%- if 'last_seen' in (ent | lower) -%}
                {%- set t2 = as_timestamp(states(ent), default=0) | float(0) -%}
                {%- if t2 > w.ts -%}
                  {%- set w.ts = t2 -%}
                  {%- set w.ent = ent -%}
                  {%- set w.src = 'state:last_seen_entity' -%}
                {%- endif -%}
              {%- endif -%}

            {%- endif -%}
          {%- endfor -%}
          {%- set age_s = (as_timestamp(now()) - w.ts) | int(0) -%}
          {%- set ns.idx = dict(ns.idx, **{
            did: {
              'winner_entity': w.ent,
              'winner_source': w.src,
              'winner_ts': w.ts,
              'winner_age_s': age_s
            }
          }) -%}
        {%- endfor -%}
        {{ ns.idx | to_json }}
        {# Merk: output er JSON; størrelse er proporsjonal med antall unike devices. #}

  # Steg 2B - Finn batteri-enheter uten signal på lenge (rå)
  # Bruker device_activity_index fra 2A i stedet for å re-skanne device_entities.
  # stale_debug_winners viser for hvert inkludert element hvilken entity/kilde
  # som ga den nyeste aktiviteten – alltid synlig i trace-utdata.
  - alias: "Steg 2B - Finn batteri-enheter uten signal på lenge (rå)"
    variables:
      stale_list_raw: |-
        {%- set threshold_s = (max_age_seconds | int(0)) -%}
        {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
        {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}
        {#
          device_activity_index: produced by Steg 2A as a to_json string.
          Depending on the HA version / template engine, it may arrive already
          parsed as a mapping – handle both cases, and fall back to {} on any
          other input (empty string, undefined, etc.) to avoid a ValueError.
        #}
        {%- if device_activity_index is mapping -%}
          {%- set idx = device_activity_index -%}
        {%- elif device_activity_index is string and (device_activity_index | trim) != '' -%}
          {%- set idx = device_activity_index | from_json -%}
        {%- else -%}
          {%- set idx = {} -%}
        {%- endif -%}
        {%- for s in states.sensor
              | selectattr('attributes.device_class','defined')
              | selectattr('attributes.device_class','eq','battery') -%}

          {%- set eid = s.entity_id -%}
          {%- set did = device_id(eid) -%}

          {%- if eid in ignore_e or (did and did in ignore_d) -%}
            {# ignorert #}
          {%- else -%}

            {# navn + dedupe-nøkkel (samme stil som tidligere) #}
            {%- set base = s.name
                | regex_replace('(?i)(?:\\s|^)(battery|batteri|level)(?:\\s|$)', ' ')
                | replace(' Battery+', '')
                | regex_replace('\\s{2,}', ' ')
                | regex_replace('\\s*\\+\\s*$', '')
                | trim -%}

            {%- set norm = base
                | lower
                | regex_replace('[^\\w\\s:]', '')
                | regex_replace('\\s{2,}', ' ')
                | trim -%}

            {# Hent ts/age fra indeks, eller fall tilbake til entity.last_changed #}
            {%- if did and did in idx -%}
              {%- set age_s = idx[did]['winner_age_s'] | int(0) -%}
            {%- else -%}
              {%- set ts = as_timestamp(s.last_changed, default=0) | float(0) -%}
              {%- set age_s = (as_timestamp(now()) - ts) | int(0) -%}
            {%- endif -%}

            {%- set st = s.state -%}
            {%- set is_unavail = st in ['unknown','unavailable'] -%}
            {%- set is_stale = age_s >= threshold_s -%}

            {%- if (is_stale) or (include_unavailable and is_unavail) -%}

              {# dedupe: behold verste (eldst), og la unavail "vinne" #}
              {%- if norm != '' -%}
                {%- set keep = false -%}
                {%- if norm not in ns.map -%}
                  {%- set keep = true -%}
                {%- else -%}
                  {%- set cur = ns.map[norm] -%}
                  {%- set cur_unavail = cur['state'] in ['unknown','unavailable'] -%}
                  {%- if is_unavail and not cur_unavail -%}
                    {%- set keep = true -%}
                  {%- elif (age_s | int(0)) > (cur['age_s'] | int(0)) -%}
                    {%- set keep = true -%}
                  {%- endif -%}
                {%- endif -%}

                {%- if keep -%}
                  {%- set ns.map = dict(ns.map, **{
                    norm: {
                      'base': base,
                      'age_s': age_s,
                      'state': st
                    }
                  }) -%}
                {%- endif -%}
              {%- endif -%}

            {%- endif -%}

          {%- endif -%}
        {%- endfor -%}

        {# ===== binary_sensor battery ===== #}
        {%- for b in states.binary_sensor
              | selectattr('attributes.device_class','eq','battery') -%}

          {%- set eid = b.entity_id -%}
          {%- set did = device_id(eid) -%}

          {%- if eid in ignore_e or (did and did in ignore_d) -%}
            {# ignorert #}
          {%- else -%}

            {# navn (samme stil som dine digitale) #}
            {%- set base = b.name
                | regex_replace('(?i)\\bbattery\\s*low\\b:?',' ')
                | regex_replace('(?i)\\bbatteri\\s*lav\\b:?',' ')
                | regex_replace('(?i)\\bbattery\\b:?',' ')
                | regex_replace('(?i)\\bbatteri\\b:?',' ')
                | regex_replace('\\s*\\+\\s*$','')
                | regex_replace('\\s*:\\s*$','')
                | regex_replace('\\s{2,}',' ')
                | trim -%}

            {%- set norm = base
                | lower
                | regex_replace('[^\\w\\s:]', '')
                | regex_replace('\\s{2,}', ' ')
                | trim -%}

            {# Hent ts/age fra indeks, eller fall tilbake til entity.last_updated #}
            {%- if did and did in idx -%}
              {%- set age_s = idx[did]['winner_age_s'] | int(0) -%}
            {%- else -%}
              {%- set ts = as_timestamp(b.last_updated, default=0) | float(0) -%}
              {%- set age_s = (as_timestamp(now()) - ts) | int(0) -%}
            {%- endif -%}

            {%- set st = b.state -%}
            {%- set is_unavail = st in ['unknown','unavailable'] -%}
            {%- set is_stale = age_s >= threshold_s -%}

            {%- if (is_stale) or (include_unavailable and is_unavail) -%}

              {# dedupe: behold verste (eldst), og la unavail "vinne" #}
              {%- if norm != '' -%}
                {%- set keep = false -%}
                {%- if norm not in ns.map -%}
                  {%- set keep = true -%}
                {%- else -%}
                  {%- set cur = ns.map[norm] -%}
                  {%- set cur_unavail = cur['state'] in ['unknown','unavailable'] -%}
                  {%- if is_unavail and not cur_unavail -%}
                    {%- set keep = true -%}
                  {%- elif (age_s | int(0)) > (cur['age_s'] | int(0)) -%}
                    {%- set keep = true -%}
                  {%- endif -%}
                {%- endif -%}

                {%- if keep -%}
                  {%- set ns.map = dict(ns.map, **{
                    norm: {
                      'base': base,
                      'age_s': age_s,
                      'state': st
                    }
                  }) -%}
                {%- endif -%}
              {%- endif -%}

            {%- endif -%}

          {%- endif -%}
        {%- endfor -%}

        {# ===== Render sortert (eldst først) ===== #}
        {%- set items = namespace(lst=[]) -%}
        {%- for norm, it in ns.map.items() -%}
          {%- set items.lst = items.lst + [(it['age_s']|int(0), it['base']|string)] -%}
        {%- endfor -%}

        {%- for age_s, base in (items.lst | sort(reverse=true)) -%}
          {%- set d = (age_s // 86400) | int(0) -%}
          {%- set h = ((age_s % 86400) // 3600) | int(0) -%}
          {%- set m = ((age_s % 3600) // 60) | int(0) -%}

          {%- if d > 0 -%}
            {%- set age_txt = d|string ~ 'd ' ~ h|string ~ 'h' -%}
          {%- elif h > 0 -%}
            {%- set age_txt = h|string ~ 'h ' ~ m|string ~ 'm' -%}
          {%- elif m > 0 -%}
            {%- set age_txt = m|string ~ 'm' -%}
          {%- else -%}
            {%- set s = (age_s % 60) | int(0) -%}
            {%- set age_txt = s|string ~ 's' -%}
          {%- endif -%}

          {%- set ns.lines = ns.lines + ['- ' ~ base ~ ' (' ~ age_txt ~ ')'] -%}
        {%- endfor -%}

        {{ ns.lines | join('\n') }}

      stale_debug_winners: |-
        {#
          Alltid synlig i trace-utdata (uavhengig av include_debug_details).
          Viser for hvert inkludert batteri-element hvilken entity/kilde
          som ga den nyeste aktiviteten (winner_*).
          Eksempel: en tablet rapportert som "3m" – winner_entity avslører
          hvilken sensor som holder enheten tilsynelatende aktiv.
        #}
        {%- set threshold_s = (max_age_seconds | int(0)) -%}
        {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
        {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}
        {%- set idx = (device_activity_index | default('{}')) | from_json -%}

        {%- for s in states.sensor
              | selectattr('attributes.device_class','defined')
              | selectattr('attributes.device_class','eq','battery') -%}
          {%- set eid = s.entity_id -%}
          {%- set did = device_id(eid) -%}
          {%- if eid not in ignore_e and not (did and did in ignore_d) -%}
            {%- if did and did in idx -%}
              {%- set w = idx[did] -%}
              {%- set age_s = w['winner_age_s'] | int(0) -%}
            {%- else -%}
              {%- set age_s = (as_timestamp(now()) - as_timestamp(s.last_updated, default=0) | float(0)) | int(0) -%}
              {%- set w = {'winner_entity': eid, 'winner_source': 'meta:last_updated', 'winner_age_s': age_s} -%}
            {%- endif -%}
            {%- set st = s.state -%}
            {%- if age_s >= threshold_s or (include_unavailable and st in ['unknown','unavailable']) -%}
              {%- set ns.out = ns.out + [{
                'entity_id': eid,
                'name': s.name,
                'state': st,
                'age_s': age_s,
                'winner_entity': w['winner_entity'],
                'winner_source': w['winner_source'],
                'winner_age_s': w['winner_age_s']
              }] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}

        {%- for b in states.binary_sensor
              | selectattr('attributes.device_class','eq','battery') -%}
          {%- set eid = b.entity_id -%}
          {%- set did = device_id(eid) -%}
          {%- if eid not in ignore_e and not (did and did in ignore_d) -%}
            {%- if did and did in idx -%}
              {%- set w = idx[did] -%}
              {%- set age_s = w['winner_age_s'] | int(0) -%}
            {%- else -%}
              {%- set age_s = (as_timestamp(now()) - as_timestamp(b.last_updated, default=0) | float(0)) | int(0) -%}
              {%- set w = {'winner_entity': eid, 'winner_source': 'meta:last_updated', 'winner_age_s': age_s} -%}
            {%- endif -%}
            {%- set st = b.state -%}
            {%- if age_s >= threshold_s or (include_unavailable and st in ['unknown','unavailable']) -%}
              {%- set ns.out = ns.out + [{
                'entity_id': eid,
                'name': b.name,
                'state': st,
                'age_s': age_s,
                'winner_entity': w['winner_entity'],
                'winner_source': w['winner_source'],
                'winner_age_s': w['winner_age_s']
              }] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}

        {{ ns.out | to_json }}

  # Steg 3 - Rydd bort meningsløse linjer (tomt navn og "Battery")
  - alias: "Steg 3 - Rydd bort meningsløse linjer"
    variables:
      stale_list_clean: >-
        {% set out = namespace(lines=[]) %}
        {% for line in (stale_list_raw | default('')).split('\n') %}
          {% set l = line | trim %}
          {% if l == '' %}
          {% elif not l.startswith('- ') %}
          {% else %}
            {% set name = (l
              | regex_replace('^-\\s*','')
              | regex_replace('\\s*\\(.*$','')
              | trim) %}
            {% if name != '' and (name | lower) != 'battery' %}
              {% set out.lines = out.lines + [l] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ out.lines | join('\n') }}

  # Steg 4 - Bygg endelig melding
  - alias: "Steg 4 - Bygg endelig melding"
    variables:
      combined_message: >-
        {% set parts = namespace(lines=[]) %}

        {% if (stale_list_clean | trim) != '' %}
          {% set parts.lines = parts.lines + [
            "*Batteri-enheter uten signal > " ~ (max_age_label | string) ~ ":*",
            stale_list_clean,
            ""
          ] %}
        {% endif %}

        {% if debug_on %}
          {% set parts.lines = parts.lines + [
            "---",
            "Debug:",
            "- trigger: " ~ trigger.id,
            "- max_age: " ~ (max_age_label | string),
            "- max_age_seconds: " ~ (max_age_seconds | string),
            "- include_unavailable: " ~ (include_unavailable | string),
            "- ignored_entities: " ~ ((ignore_entities | count) | string),
            "- ignored_devices: " ~ ((ignore_devices | count) | string)
          ] %}
        {% endif %}

        {{ (parts.lines | join('\n')) | trim }}

  # Steg 5 - Send varsel hvis vi har noe å melde
  - alias: "Steg 5 - Send varsel"
    if:
      - condition: template
        value_template: "{{ combined_message | trim != '' }}"
    then:
      - action: notify.send_message
        data:
          title: "🟠 *Ingen signal på lenge*"
          message: "{{ combined_message }}"
        target:
          entity_id: !input notify_target
