blueprint:
  name: Varsel - Batteri (nivå + signal) (WebHome)
  description: >
    Samlet overvåkning av batteri-enheter i tre deler:

    Del 1 – Lite batteri (planlagt sjekk):
      - sensor.* med device_class: battery → rapporterer % under terskel
      - binary_sensor.* med device_class: battery → rapporterer digitalt lav-signal
      - Deduper per renset navn, beholder laveste verdi

    Del 2 – Vært offline en stund (planlagt sjekk, samme tid som Del 1):
      - Trigger: minst én enhet har ikke rapportert inn på over angitt tid (standard 72 timer)
      - Meldingen inkluderer alle enheter uten signal fra terskel (standard 2 timer) og opp
      - Enheter som allerede er listet i en tidligere del av samme varsel vises ikke på nytt senere
      - Ved manuell kjøring beskrives listen nøytralt (ikke som "utløste varselet")

    Del 3 – Nylig mistet signal (time_pattern – kjøres hver time):
      - Varsler kun enheter som nettopp har krysset terskelen:
        nylig_mistet_terskel <= alder < (nylig_mistet_terskel + 1 time)
      - Inkluderer oversikt over alle enheter offline lenge og lavt batterinivå

    Felles for alle tre:
      - Én ignore-liste for entities og devices (gjelder alle sjekkene)
      - Debug-detaljer slås på én gang

    Slik finner vi "sist sett" (signal-sjekkene):
      - state_attr(entity, 'last_seen') hvis finnes
      - entity_id med "last_seen" i navnet (og parsbar timestamp i state)
      - Fallback: entity.last_changed for sensor/binary_sensor

    Blueprint versjon: 2026.07.13
  domain: automation
  author: WebHome
  source_url: https://github.com/surematu/WebHomeHelpFiles/blob/main/blueprints/automation/varsel_batteri.yaml
  homeassistant:
    min_version: 2025.11.0

  input:

    planlagt_sjekk:
      name: "Planlagt sjekk"
      description: >
        Tidspunkt og ukedager for batteri nivå (Del 1) og langsomt signal (Del 2).
        Den raske signal-sjekken (Del 3) kjøres automatisk hver time via time_pattern.
      input:
        check_time:
          name: Tid for planlagt sjekk
          default: "09:05:00"
          selector:
            time:

        check_weekdays:
          name: Ukedag(er) for planlagt sjekk
          default:
            - wed
          selector:
            select:
              multiple: true
              mode: list
              options:
                - { label: Mandag, value: mon }
                - { label: Tirsdag, value: tue }
                - { label: Onsdag, value: wed }
                - { label: Torsdag, value: thu }
                - { label: Fredag, value: fri }
                - { label: Lørdag, value: sat }
                - { label: Søndag, value: sun }

        run_on_startup:
          name: Kjør Del 1 og Del 2 ved oppstart av Home Assistant
          default: false
          selector:
            boolean:

    filtrering:
      name: "Filtrering (gjelder alle sjekkene)"
      description: "Entities og devices som utelates fra batteri nivå, langsomt signal og raskt signal."
      input:
        ignore_entities:
          name: Ignorer entities (valgfritt)
          description: Velg entities du vil skjule fra alle rapporter (sensor/binary_sensor).
          default: []
          selector:
            entity:
              multiple: true

        ignore_devices:
          name: Ignorer devices (valgfritt)
          description: Velg devices du vil skjule (skjuler alle batteri-entities knyttet til device).
          default: []
          selector:
            device:
              multiple: true

    batteri_nivaa:
      name: "Del 1 – Batteri nivå"
      description: "Innstillinger for rapportering av lavt batterinivå (planlagt sjekk)."
      input:
        threshold_percent:
          name: Terskel for lavt batteri (%)
          default: 30
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"

        include_digital_battery_sensors:
          name: "Ta med digitale batterisensorer (binary_sensor device_class: battery)"
          default: true
          selector:
            boolean:

    signal_langsomt:
      name: "Del 2 – Signal langsomt"
      description: >
        Varsler batteri-enheter som ikke har rapportert inn på lenge.
        Kjøres ved planlagt sjekk (samme tid som Del 1).
        NB: Shelly WiFi-temperatursensorer responderer noen ganger ikke på 1–2 timer.
      input:
        max_age:
          name: Maks tid siden sist signal
          description: "Varsle hvis enhet ikke er sett på mer enn dette. Standard: 72 timer."
          default:
            hours: 72
          selector:
            duration:

    signal_raskt:
      name: "Del 3 – Signal raskt"
      description: >
        Varsler batteri-enheter som nylig mistet kontakten (kjøres hver time).
        Varsel-vinduet er nøyaktig én time bredt: last_seen_threshold <= alder < (last_seen_threshold + 1t).
        Hver enhet rapporteres kun én gang – første time den passerer terskelen.
        NB: Shelly WiFi-temperatursensorer responderer noen ganger ikke på 1–2 timer.
      input:
        last_seen_threshold:
          name: Nedre grense – minimum tid siden sist signal
          description: >
            Enheter sett for kortere tid enn dette ignoreres. Standard: 2 timer.
          default:
            hours: 2
          selector:
            duration:

        include_unavailable:
          name: Ta med unknown/unavailable i varselet (raskt signal)
          description: >
            Hvis på: enheter der batteri-entity er unknown/unavailable tas med.
            Slå av hvis du opplever støy.
          default: true
          selector:
            boolean:

    varsling:
      name: "Varsling (Pushover)"
      description: "Innstillinger for Pushover-varsler. Gjelder alle tre sjekkene."
      input:
        pushover_destination:
          name: Pushover destination
          description: Mottakergruppe i script.varsel_pushover_send_melding_webhome
          default: pushover
          selector:
            text:

        pushover_priority:
          name: Pushover priority
          description: Prioritet brukt for varsling
          default: 0
          selector:
            number:
              min: -2
              max: 2
              step: 1
              mode: box

        pushover_ttl:
          name: Pushover TTL (sekunder)
          description: Levetid for varselet (f.eks. 86400 = 1 døgn)
          default: 604800
          selector:
            number:
              min: 0
              max: 604800
              step: 60
              mode: box

    avansert:
      name: "Avansert"
      collapsed: true
      input:
        include_debug_details:
          name: Legg til debug-detaljer i varselet
          description: Legger til ekstra informasjon om trigger, terskler og intervaller i alle varsler.
          default: false
          selector:
            boolean:

mode: restart

trigger:
  # Del 3 – raskt signal: kjøres hver time
  - platform: time_pattern
    hours: /1
    id: time_pattern_check

  # Del 1 + Del 2 – planlagt sjekk
  - platform: time
    at: !input check_time
    weekday: !input check_weekdays
    id: scheduled_check

  # Del 1 + Del 2 – ved HA-oppstart (valgfritt)
  - platform: homeassistant
    event: start
    id: ha_start
    enabled: !input run_on_startup

condition: []

action:
  # ─── Steg 1 – Sett grunnvariabler ────────────────────────────────────────────
  - alias: "Steg 1 - Sett grunnvariabler"
    variables:
      threshold: !input threshold_percent
      include_digital: !input include_digital_battery_sensors
      max_age: !input max_age
      last_seen_threshold: !input last_seen_threshold
      include_unavailable: !input include_unavailable
      ignore_entities: !input ignore_entities
      ignore_devices: !input ignore_devices
      debug_on: !input include_debug_details
      pushover_destination: !input pushover_destination
      pushover_priority: !input pushover_priority
      pushover_ttl: !input pushover_ttl

      # Del 2 – langsomt signal: terskel i sekunder og label
      max_age_seconds: >-
        {% set d = max_age %}
        {{ (d.get('days',0)|int * 86400)
         + (d.get('hours',0)|int * 3600)
         + (d.get('minutes',0)|int * 60)
         + (d.get('seconds',0)|int) }}
      max_age_label: >-
        {% set d = max_age %}
        {% set days = d.get('days',0)|int %}
        {% set hours = d.get('hours',0)|int %}
        {% set mins = d.get('minutes',0)|int %}
        {% set secs = d.get('seconds',0)|int %}
        {% set parts = namespace(p=[]) %}
        {% if days > 0 %}{% set parts.p = parts.p + [days|string ~ 'd'] %}{% endif %}
        {% if hours > 0 %}{% set parts.p = parts.p + [hours|string ~ 'h'] %}{% endif %}
        {% if mins > 0 %}{% set parts.p = parts.p + [mins|string ~ 'm'] %}{% endif %}
        {% if secs > 0 and (days==0 and hours==0) %}{% set parts.p = parts.p + [secs|string ~ 's'] %}{% endif %}
        {{ parts.p | join(' ') if parts.p | count > 0 else '0s' }}

      # Del 3 – raskt signal: terskel i sekunder og label; intervall = terskel + 1t (1 sjekk-syklus)
      threshold_seconds: >-
        {% set d = last_seen_threshold %}
        {{ (d.get('days',0)|int * 86400)
         + (d.get('hours',0)|int * 3600)
         + (d.get('minutes',0)|int * 60)
         + (d.get('seconds',0)|int) }}
      interval_seconds: "{{ threshold_seconds | int(0) + 3600 }}"  # 3600s = 1h = one time_pattern trigger cycle → each device reported at most once
      threshold_label: >-
        {% set d = last_seen_threshold %}
        {% set days = d.get('days',0)|int %}
        {% set hours = d.get('hours',0)|int %}
        {% set mins = d.get('minutes',0)|int %}
        {% set secs = d.get('seconds',0)|int %}
        {% set parts = namespace(p=[]) %}
        {% if days > 0 %}{% set parts.p = parts.p + [days|string ~ 'd'] %}{% endif %}
        {% if hours > 0 %}{% set parts.p = parts.p + [hours|string ~ 'h'] %}{% endif %}
        {% if mins > 0 %}{% set parts.p = parts.p + [mins|string ~ 'm'] %}{% endif %}
        {% if secs > 0 and (days==0 and hours==0) %}{% set parts.p = parts.p + [secs|string ~ 's'] %}{% endif %}
        {{ parts.p | join(' ') if parts.p | count > 0 else '0s' }}

      trigger_id_raw: "{{ trigger.id if trigger is defined and trigger.id is defined else '' }}"
      run_started_by_user: >-
        {{ this is defined and this.context is defined and (this.context.user_id | default('', true) | string | trim) != '' }}
      manual_run: "{{ run_started_by_user or trigger_id_raw == '' }}"
      trigger_is_time_pattern: "{{ (not manual_run) and trigger_id_raw == 'time_pattern_check' }}"
      trigger_is_scheduled: "{{ (not manual_run) and trigger_id_raw == 'scheduled_check' }}"
      trigger_is_ha_start: "{{ (not manual_run) and trigger_id_raw == 'ha_start' }}"
      trigger_label: "{{ trigger_id_raw if trigger_id_raw | trim != '' else 'manual/unknown' }}"

  # ─── Velg logikk basert på trigger ───────────────────────────────────────────
  - choose:

    # ═══════════════════════════════════════════════════════════════════════════
    # DEL 3 – RASKT SIGNAL (time_pattern – kjøres hver time)
    # ═══════════════════════════════════════════════════════════════════════════
    - conditions:
        - condition: template
          value_template: "{{ trigger_is_time_pattern }}"
      sequence:

        # Steg 2R – Bygg per-device aktivitetsindeks (raskt signal)
        - alias: "Steg 2R - Bygg per-device aktivitetsindeks (raskt signal)"
          variables:
            device_activity_index: |-
              {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
              {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}
              {%- set ns = namespace(idx={}, seen=[]) -%}

              {%- for s in states.sensor
                    | selectattr('attributes.device_class','defined')
                    | selectattr('attributes.device_class','eq','battery') -%}
                {%- set did = device_id(s.entity_id) -%}
                {%- if s.entity_id not in ignore_e
                    and did is not none
                    and did not in ignore_d
                    and did not in ns.seen -%}
                  {%- set ns.seen = ns.seen + [did] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- for b in states.binary_sensor
                    | selectattr('attributes.device_class','eq','battery') -%}
                {%- set did = device_id(b.entity_id) -%}
                {%- if b.entity_id not in ignore_e
                    and did is not none
                    and did not in ignore_d
                    and did not in ns.seen -%}
                  {%- set ns.seen = ns.seen + [did] -%}
                {%- endif -%}
              {%- endfor -%}

              {%- for did in ns.seen -%}
                {%- set w = namespace(ts=0, ent='', src='') -%}
                {%- for ent in device_entities(did) -%}
                  {%- set st_obj = states[ent] -%}
                  {%- if st_obj is not none -%}
                    {%- if st_obj.entity_id.split('.')[0] in ['sensor','binary_sensor'] -%}
                      {%- set t_chg = as_timestamp(st_obj.last_changed, default=0) | float(0) -%}
                      {%- if t_chg > w.ts -%}
                        {%- set w.ts = t_chg -%}
                        {%- set w.ent = ent -%}
                        {%- set w.src = 'meta:last_changed' -%}
                      {%- endif -%}
                    {%- endif -%}
                    {%- set ls = state_attr(ent,'last_seen') -%}
                    {%- if ls is not none -%}
                      {%- set t_ls = as_timestamp(ls, default=0) | float(0) -%}
                      {%- if t_ls > w.ts -%}
                        {%- set w.ts = t_ls -%}
                        {%- set w.ent = ent -%}
                        {%- set w.src = 'attr:last_seen' -%}
                      {%- endif -%}
                    {%- endif -%}
                    {%- if 'last_seen' in (ent | lower) -%}
                      {%- set t2 = as_timestamp(states(ent), default=0) | float(0) -%}
                      {%- if t2 > w.ts -%}
                        {%- set w.ts = t2 -%}
                        {%- set w.ent = ent -%}
                        {%- set w.src = 'state:last_seen_entity' -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set age_s = (as_timestamp(now()) - w.ts) | int(0) -%}
                {%- set ns.idx = dict(ns.idx, **{
                  did: {
                    'winner_entity': w.ent,
                    'winner_source': w.src,
                    'winner_ts': w.ts,
                    'winner_age_s': age_s
                  }
                }) -%}
              {%- endfor -%}
              {{ ns.idx | to_json }}
              {# Merk: output er JSON; størrelse er proporsjonal med antall unike devices. #}

        # Steg 3R – Finn batteri-enheter i varsel-vinduet (raskt, rå)
        # Inkluderer enheter der: threshold_seconds <= age_s < interval_seconds
        - alias: "Steg 3R - Finn batteri-enheter i varsel-vinduet (raskt, rå)"
          variables:
            nylig_mistet_raw: |-
              {%- set threshold_s = (threshold_seconds | int(0)) -%}
              {%- set interval_s = (interval_seconds | int(0)) -%}
              {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
              {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}
              {%- set _raw_idx = device_activity_index | default({}) -%}
              {%- set idx = _raw_idx if _raw_idx is mapping else (_raw_idx | default('{}') | from_json) -%}
              {%- set ns = namespace(map={}, lines=[]) -%}

              {# ===== sensor battery ===== #}
              {%- for s in states.sensor
                    | selectattr('attributes.device_class','defined')
                    | selectattr('attributes.device_class','eq','battery') -%}
                {%- set eid = s.entity_id -%}
                {%- set did = device_id(eid) -%}
                {%- if eid in ignore_e or (did and did in ignore_d) -%}
                {%- else -%}
                  {%- set base = s.name
                      | regex_replace('(?i)(?:\\s|^)(battery|batteri|level)(?:\\s|$)', ' ')
                      | replace(' Battery+', '')
                      | regex_replace('\\s{2,}', ' ')
                      | regex_replace('\\s*\\+\\s*$', '')
                      | regex_replace('(?i)\\s*level\\s*$', '')
                      | trim -%}
                  {%- set norm = base | lower | regex_replace('[^\\w\\s:]', '') | regex_replace('\\s{2,}', ' ') | trim -%}
                  {%- if did and did in idx -%}
                    {%- set age_s = idx[did]['winner_age_s'] | int(0) -%}
                  {%- else -%}
                    {%- set ts = as_timestamp(s.last_changed, default=0) | float(0) -%}
                    {%- set age_s = (as_timestamp(now()) - ts) | int(0) -%}
                  {%- endif -%}
                  {%- set st = s.state -%}
                  {%- set is_unavail = st in ['unknown','unavailable'] -%}
                  {%- set in_alert_window = (age_s >= threshold_s) and (age_s < interval_s) -%}
                  {%- if in_alert_window or (include_unavailable and is_unavail and age_s < interval_s) -%}
                    {%- if norm != '' -%}
                      {%- set keep = false -%}
                      {%- if norm not in ns.map -%}
                        {%- set keep = true -%}
                      {%- else -%}
                        {%- set cur = ns.map[norm] -%}
                        {%- set cur_unavail = cur['state'] in ['unknown','unavailable'] -%}
                        {%- if is_unavail and not cur_unavail -%}
                          {%- set keep = true -%}
                        {%- elif (age_s | int(0)) > (cur['age_s'] | int(0)) -%}
                          {%- set keep = true -%}
                        {%- endif -%}
                      {%- endif -%}
                      {%- if keep -%}
                        {%- set ns.map = dict(ns.map, **{norm: {'base': base, 'age_s': age_s, 'state': st}}) -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}

              {# ===== binary_sensor battery ===== #}
              {%- for b in states.binary_sensor
                    | selectattr('attributes.device_class','eq','battery') -%}
                {%- set eid = b.entity_id -%}
                {%- set did = device_id(eid) -%}
                {%- if eid in ignore_e or (did and did in ignore_d) -%}
                {%- else -%}
                  {%- set base = b.name
                      | regex_replace('(?i)\\bbattery\\s*low\\b:?',' ')
                      | regex_replace('(?i)\\bbatteri\\s*lav\\b:?',' ')
                      | regex_replace('(?i)\\bbattery\\b:?',' ')
                      | regex_replace('(?i)\\bbatteri\\b:?',' ')
                      | regex_replace('\\s*\\+\\s*$','')
                      | regex_replace('\\s*:\\s*$','')
                      | regex_replace('\\s{2,}',' ')
                      | trim -%}
                  {%- set norm = base | lower | regex_replace('[^\\w\\s:]', '') | regex_replace('\\s{2,}', ' ') | trim -%}
                  {%- if did and did in idx -%}
                    {%- set age_s = idx[did]['winner_age_s'] | int(0) -%}
                  {%- else -%}
                    {%- set ts = as_timestamp(b.last_changed, default=0) | float(0) -%}
                    {%- set age_s = (as_timestamp(now()) - ts) | int(0) -%}
                  {%- endif -%}
                  {%- set st = b.state -%}
                  {%- set is_unavail = st in ['unknown','unavailable'] -%}
                  {%- set in_alert_window = (age_s >= threshold_s) and (age_s < interval_s) -%}
                  {%- if in_alert_window or (include_unavailable and is_unavail and age_s < interval_s) -%}
                    {%- if norm != '' -%}
                      {%- set keep = false -%}
                      {%- if norm not in ns.map -%}
                        {%- set keep = true -%}
                      {%- else -%}
                        {%- set cur = ns.map[norm] -%}
                        {%- set cur_unavail = cur['state'] in ['unknown','unavailable'] -%}
                        {%- if is_unavail and not cur_unavail -%}
                          {%- set keep = true -%}
                        {%- elif (age_s | int(0)) > (cur['age_s'] | int(0)) -%}
                          {%- set keep = true -%}
                        {%- endif -%}
                      {%- endif -%}
                      {%- if keep -%}
                        {%- set ns.map = dict(ns.map, **{norm: {'base': base, 'age_s': age_s, 'state': st}}) -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}

              {# ===== Render sortert (eldst først) ===== #}
              {%- set items = namespace(lst=[]) -%}
              {%- for norm, it in ns.map.items() -%}
                {%- set items.lst = items.lst + [{'age_s': it['age_s']|int(0), 'base': it['base']|string, 'state': it['state']|string}] -%}
              {%- endfor -%}
              {%- for it in (items.lst | sort(attribute='age_s', reverse=true)) -%}
                {%- set age_s = it.age_s -%}
                {%- set base = it.base -%}
                {%- set d = (age_s // 86400) | int(0) -%}
                {%- set h = ((age_s % 86400) // 3600) | int(0) -%}
                {%- set m = ((age_s % 3600) // 60) | int(0) -%}
                {%- if d > 0 -%}
                  {%- set age_txt = d|string ~ 'd ' ~ h|string ~ 'h' -%}
                {%- elif h > 0 -%}
                  {%- set age_txt = h|string ~ 'h ' ~ m|string ~ 'm' -%}
                {%- elif m > 0 -%}
                  {%- set age_txt = m|string ~ 'm' -%}
                {%- else -%}
                  {%- set s = (age_s % 60) | int(0) -%}
                  {%- set age_txt = s|string ~ 's' -%}
                {%- endif -%}
                {%- set pct_txt = (it.state ~ '%') if (it.state | is_number) else 'Ukjent' -%}
                {%- set ns.lines = ns.lines + ['- ' ~ base ~ ' | ' ~ age_txt ~ ' / ' ~ pct_txt] -%}
              {%- endfor -%}
              {{ ns.lines | join('\n') }}

            # Alltid synlig i trace – viser hvilken entity/kilde som ga nyeste aktivitet
            nylig_mistet_debug: |-
              {%- set threshold_s = (threshold_seconds | int(0)) -%}
              {%- set interval_s = (interval_seconds | int(0)) -%}
              {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
              {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}
              {%- set _raw_idx = device_activity_index | default({}) -%}
              {%- set idx = _raw_idx if _raw_idx is mapping else (_raw_idx | default('{}') | from_json) -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for s in states.sensor
                    | selectattr('attributes.device_class','defined')
                    | selectattr('attributes.device_class','eq','battery') -%}
                {%- set eid = s.entity_id -%}
                {%- set did = device_id(eid) -%}
                {%- if eid not in ignore_e and not (did and did in ignore_d) -%}
                  {%- if did and did in idx -%}
                    {%- set w = idx[did] -%}
                    {%- set age_s = w['winner_age_s'] | int(0) -%}
                  {%- else -%}
                    {%- set age_s = (as_timestamp(now()) - as_timestamp(s.last_changed, default=0) | float(0)) | int(0) -%}
                    {%- set w = {'winner_entity': eid, 'winner_source': 'meta:last_changed', 'winner_age_s': age_s} -%}
                  {%- endif -%}
                  {%- set st = s.state -%}
                  {%- set is_unavail = st in ['unknown','unavailable'] -%}
                  {%- set in_alert_window = (age_s >= threshold_s) and (age_s < interval_s) -%}
                  {%- if in_alert_window or (include_unavailable and is_unavail and age_s < interval_s) -%}
                    {%- set ns.out = ns.out + [{'entity_id': eid, 'name': s.name, 'state': st, 'age_s': age_s, 'winner_entity': w['winner_entity'], 'winner_source': w['winner_source'], 'winner_age_s': w['winner_age_s']}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {%- for b in states.binary_sensor
                    | selectattr('attributes.device_class','eq','battery') -%}
                {%- set eid = b.entity_id -%}
                {%- set did = device_id(eid) -%}
                {%- if eid not in ignore_e and not (did and did in ignore_d) -%}
                  {%- if did and did in idx -%}
                    {%- set w = idx[did] -%}
                    {%- set age_s = w['winner_age_s'] | int(0) -%}
                  {%- else -%}
                    {%- set age_s = (as_timestamp(now()) - as_timestamp(b.last_changed, default=0) | float(0)) | int(0) -%}
                    {%- set w = {'winner_entity': eid, 'winner_source': 'meta:last_changed', 'winner_age_s': age_s} -%}
                  {%- endif -%}
                  {%- set st = b.state -%}
                  {%- set is_unavail = st in ['unknown','unavailable'] -%}
                  {%- set in_alert_window = (age_s >= threshold_s) and (age_s < interval_s) -%}
                  {%- if in_alert_window or (include_unavailable and is_unavail and age_s < interval_s) -%}
                    {%- set ns.out = ns.out + [{'entity_id': eid, 'name': b.name, 'state': st, 'age_s': age_s, 'winner_entity': w['winner_entity'], 'winner_source': w['winner_source'], 'winner_age_s': w['winner_age_s']}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | to_json }}

        # Steg 4R – Rydd bort meningsløse linjer (raskt signal)
        - alias: "Steg 4R - Rydd bort meningsløse linjer (raskt signal)"
          variables:
            nylig_mistet_clean: >-
              {% set out = namespace(map={}, order=[]) %}
              {% for line in (nylig_mistet_raw | default('')).split('\n') %}
                {% set l = line | trim %}
                {% if l == '' %}
                {% elif not l.startswith('- ') %}
                {% else %}
                  {% set name = (l | regex_replace('^-\\s*','') | regex_replace('\\s*\\|.*$','') | trim) %}
                  {% set canon = name
                    | regex_replace('(?i)\\s+level\\s*$','')
                    | regex_replace('\\s{2,}',' ')
                    | trim
                    | lower %}
                  {% if name != '' and canon != 'battery' %}
                    {% if canon not in out.map %}
                      {% set out.map = dict(out.map, **{canon: l}) %}
                      {% set out.order = out.order + [canon] %}
                    {% else %}
                      {% set current = out.map[canon] %}
                      {% set current_name = (current | regex_replace('^-\\s*','') | regex_replace('\\s*\\|.*$','') | trim) %}
                      {% if (name | length) < (current_name | length) %}
                        {% set out.map = dict(out.map, **{canon: l}) %}
                      {% endif %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {% set lines = namespace(lst=[]) %}
              {% for canon in out.order %}
                {% set lines.lst = lines.lst + [out.map[canon]] %}
              {% endfor %}
              {{ lines.lst | join('\n') }}

        # ── Komplett varselbilde for Del 3 ──────────────────────────────────────
        # Steg 4RS-A – Langsomt signal: rå liste (Del 3-kontekst, gjenbruker device_activity_index fra Steg 2R)
        - alias: "Steg 4RS-A - Lang offline rå liste (Del 3)"
          variables:
            lang_offline_raw: |-
              {%- set threshold_s = (max_age_seconds | int(0)) -%}
              {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
              {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}
              {%- set _raw_idx = device_activity_index | default({}) -%}
              {%- set idx = _raw_idx if _raw_idx is mapping else (_raw_idx | default('{}') | from_json) -%}
              {%- set ns = namespace(map={}, lines=[]) -%}

              {%- for s in states.sensor
                    | selectattr('attributes.device_class','defined')
                    | selectattr('attributes.device_class','eq','battery') -%}
                {%- set eid = s.entity_id -%}
                {%- set did = device_id(eid) -%}
                {%- if eid not in ignore_e and not (did and did in ignore_d) -%}
                  {%- set base = s.name
                      | regex_replace('(?i)(?:\\s|^)(battery|batteri|level)(?:\\s|$)', ' ')
                      | replace(' Battery+', '')
                      | regex_replace('\\s{2,}', ' ')
                      | regex_replace('\\s*\\+\\s*$', '')
                      | regex_replace('(?i)\\s*level\\s*$', '')
                      | trim -%}
                  {%- set norm = base | lower | regex_replace('[^\\w\\s:]', '') | regex_replace('\\s{2,}', ' ') | trim -%}
                  {%- if did and did in idx -%}
                    {%- set age_s = idx[did]['winner_age_s'] | int(0) -%}
                  {%- else -%}
                    {%- set age_s = (as_timestamp(now()) - as_timestamp(s.last_changed, default=0) | float(0)) | int(0) -%}
                  {%- endif -%}
                  {%- set st = s.state -%}
                  {%- if age_s >= threshold_s and norm != '' -%}
                    {%- if norm not in ns.map or (age_s | int(0)) > (ns.map[norm]['age_s'] | int(0)) -%}
                      {%- set ns.map = dict(ns.map, **{norm: {'base': base, 'age_s': age_s, 'state': st}}) -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}

              {%- for b in states.binary_sensor
                    | selectattr('attributes.device_class','eq','battery') -%}
                {%- set eid = b.entity_id -%}
                {%- set did = device_id(eid) -%}
                {%- if eid not in ignore_e and not (did and did in ignore_d) -%}
                  {%- set base = b.name
                      | regex_replace('(?i)\\bbattery\\s*low\\b:?',' ')
                      | regex_replace('(?i)\\bbatteri\\s*lav\\b:?',' ')
                      | regex_replace('(?i)\\bbattery\\b:?',' ')
                      | regex_replace('(?i)\\bbatteri\\b:?',' ')
                      | regex_replace('\\s*\\+\\s*$','')
                      | regex_replace('\\s*:\\s*$','')
                      | regex_replace('\\s{2,}',' ')
                      | trim -%}
                  {%- set norm = base | lower | regex_replace('[^\\w\\s:]', '') | regex_replace('\\s{2,}', ' ') | trim -%}
                  {%- if did and did in idx -%}
                    {%- set age_s = idx[did]['winner_age_s'] | int(0) -%}
                  {%- else -%}
                    {%- set age_s = (as_timestamp(now()) - as_timestamp(b.last_changed, default=0) | float(0)) | int(0) -%}
                  {%- endif -%}
                  {%- set st = b.state -%}
                  {%- if age_s >= threshold_s and norm != '' -%}
                    {%- if norm not in ns.map or (age_s | int(0)) > (ns.map[norm]['age_s'] | int(0)) -%}
                      {%- set ns.map = dict(ns.map, **{norm: {'base': base, 'age_s': age_s, 'state': st}}) -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}

              {%- set items = namespace(lst=[]) -%}
              {%- for norm, it in ns.map.items() -%}
                {%- set items.lst = items.lst + [{'age_s': it['age_s']|int(0), 'base': it['base']|string, 'state': it['state']|string}] -%}
              {%- endfor -%}
              {%- for it in (items.lst | sort(attribute='age_s', reverse=true)) -%}
                {%- set age_s = it.age_s -%}
                {%- set d = (age_s // 86400) | int(0) -%}
                {%- set h = ((age_s % 86400) // 3600) | int(0) -%}
                {%- set m = ((age_s % 3600) // 60) | int(0) -%}
                {%- if d > 0 -%}
                  {%- set age_txt = d|string ~ 'd ' ~ h|string ~ 'h' -%}
                {%- elif h > 0 -%}
                  {%- set age_txt = h|string ~ 'h ' ~ m|string ~ 'm' -%}
                {%- elif m > 0 -%}
                  {%- set age_txt = m|string ~ 'm' -%}
                {%- else -%}
                  {%- set age_txt = (age_s % 60)|string ~ 's' -%}
                {%- endif -%}
                {%- set pct_txt = (it.state ~ '%') if (it.state | is_number) else 'Ukjent' -%}
                {%- set ns.lines = ns.lines + ['- ' ~ it.base ~ ' | ' ~ age_txt ~ ' / ' ~ pct_txt] -%}
              {%- endfor -%}
              {{ ns.lines | join('\n') }}

        # Steg 4RS-B – Langsomt signal: rydd bort meningsløse linjer (Del 3)
        - alias: "Steg 4RS-B - Lang offline renset (Del 3)"
          variables:
            lang_offline_clean: >-
              {% set out = namespace(map={}, order=[]) %}
              {% for line in (lang_offline_raw | default('')).split('\n') %}
                {% set l = line | trim %}
                {% if l == '' %}
                {% elif not l.startswith('- ') %}
                {% else %}
                  {% set name = (l | regex_replace('^-\\s*','') | regex_replace('\\s*\\|.*$','') | trim) %}
                  {% set canon = name
                    | regex_replace('(?i)\\s+level\\s*$','')
                    | regex_replace('\\s{2,}',' ')
                    | trim
                    | lower %}
                  {% if name != '' and canon != 'battery' %}
                    {% if canon not in out.map %}
                      {% set out.map = dict(out.map, **{canon: l}) %}
                      {% set out.order = out.order + [canon] %}
                    {% else %}
                      {% set current = out.map[canon] %}
                      {% set current_name = (current | regex_replace('^-\\s*','') | regex_replace('\\s*\\|.*$','') | trim) %}
                      {% if (name | length) < (current_name | length) %}
                        {% set out.map = dict(out.map, **{canon: l}) %}
                      {% endif %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {% set lines = namespace(lst=[]) %}
              {% for canon in out.order %}
                {% set lines.lst = lines.lst + [out.map[canon]] %}
              {% endfor %}
              {{ lines.lst | join('\n') }}

        # Steg 4RB-A – Batteri %: rå liste (Del 3)
        - alias: "Steg 4RB-A - Batteri % rå liste (Del 3)"
          variables:
            lite_batteri_prosent: |-
              {%- set ns = namespace(map={}, names={}, ages={}, lines=[]) -%}
              {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
              {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}

              {%- for s in states.sensor
                    | selectattr('attributes.device_class','defined')
                    | selectattr('attributes.device_class','eq','battery') -%}
                {%- set eid = s.entity_id -%}
                {%- set did = device_id(eid) -%}
                {%- if eid not in ignore_e and not (did and did in ignore_d) -%}
                  {%- set state_str = s.state -%}
                  {%- set is_num = state_str | is_number -%}
                  {%- if is_num -%}
                    {%- set val = state_str | float -%}
                  {%- else -%}
                    {%- set val = none -%}
                  {%- endif -%}
                  {%- set base = s.name
                      | regex_replace('(?i)(?:\\s|^)(battery|batteri|level)(?:\\s|$)', ' ')
                      | replace(' Battery+', '')
                      | regex_replace('\\s{2,}', ' ')
                      | regex_replace('\\s*\\+\\s*$', '')
                      | regex_replace('(?i)\\s*level\\s*$', '')
                      | trim -%}
                  {%- set norm = base | lower | regex_replace('[^\\w\\s:]', '') | regex_replace('\\s{2,}', ' ') | trim -%}
                  {%- set age_s = (as_timestamp(now()) - as_timestamp(s.last_changed, default=0) | float(0)) | int(0) -%}
                  {%- if is_num and val is not none and 0 <= val < (threshold | float(0)) -%}
                    {%- if norm not in ns.map or val < ns.map[norm] -%}
                      {%- set ns.map = dict(ns.map, **{norm: val}) -%}
                      {%- set ns.names = dict(ns.names, **{norm: base}) -%}
                      {%- set ns.ages = dict(ns.ages, **{norm: age_s}) -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}

              {%- for norm, v in ns.map | dictsort(by='value') -%}
                {%- set age_s = ns.ages[norm] | int(0) -%}
                {%- set d = (age_s // 86400) | int(0) -%}
                {%- set h = ((age_s % 86400) // 3600) | int(0) -%}
                {%- set m = ((age_s % 3600) // 60) | int(0) -%}
                {%- if d > 0 -%}
                  {%- set age_txt = d|string ~ 'd ' ~ h|string ~ 'h' -%}
                {%- elif h > 0 -%}
                  {%- set age_txt = h|string ~ 'h ' ~ m|string ~ 'm' -%}
                {%- elif m > 0 -%}
                  {%- set age_txt = m|string ~ 'm' -%}
                {%- else -%}
                  {%- set age_txt = (age_s % 60)|string ~ 's' -%}
                {%- endif -%}
                {%- set ns.lines = ns.lines + ['- ' ~ ns.names[norm] ~ ' | ' ~ age_txt ~ ' / ' ~ (v | round(0) | int) ~ '%'] -%}
              {%- endfor -%}
              {{ ns.lines | join('\n') }}

        # Steg 4RB-B – Digital batteri: rå liste (Del 3)
        - alias: "Steg 4RB-B - Digital batteri rå liste (Del 3)"
          variables:
            lite_batteri_digital: |-
              {%- set ns = namespace(lines=[]) -%}
              {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
              {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}

              {%- if not include_digital -%}
                {{ '' }}
              {%- else -%}
                {%- set items = states.binary_sensor
                    | selectattr('attributes.device_class','eq','battery')
                    | rejectattr('state','eq','off')
                    | sort(attribute='name') | list -%}

                {%- for e in items -%}
                  {%- set eid = e.entity_id -%}
                  {%- set did = device_id(eid) -%}
                  {%- if eid not in ignore_e and not (did and did in ignore_d) -%}
                    {%- set base = e.name
                        | regex_replace('(?i)\\bbattery\\s*low\\b:?',' ')
                        | regex_replace('(?i)\\bbatteri\\s*lav\\b:?',' ')
                        | regex_replace('(?i)\\bbattery\\b:?',' ')
                        | regex_replace('(?i)\\bbatteri\\b:?',' ')
                        | regex_replace('\\s*\\+\\s*$','')
                        | regex_replace('\\s*:\\s*$','')
                        | regex_replace('\\s{2,}',' ')
                        | trim -%}
                    {%- set age_s = (as_timestamp(now()) - as_timestamp(e.last_changed, default=0) | float(0)) | int(0) -%}
                    {%- set d = (age_s // 86400) | int(0) -%}
                    {%- set h = ((age_s % 86400) // 3600) | int(0) -%}
                    {%- set m = ((age_s % 3600) // 60) | int(0) -%}
                    {%- if d > 0 -%}
                      {%- set age_txt = d|string ~ 'd ' ~ h|string ~ 'h' -%}
                    {%- elif h > 0 -%}
                      {%- set age_txt = h|string ~ 'h ' ~ m|string ~ 'm' -%}
                    {%- elif m > 0 -%}
                      {%- set age_txt = m|string ~ 'm' -%}
                    {%- else -%}
                      {%- set age_txt = (age_s % 60)|string ~ 's' -%}
                    {%- endif -%}
                    {%- set ns.lines = ns.lines + ['- ' ~ base ~ ' | ' ~ age_txt ~ ' / Ukjent'] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.lines | join('\n') }}
              {%- endif -%}

        # Steg 4RB-C – Digital batteri: fjern duplikater mot prosent-liste (Del 3)
        - alias: "Steg 4RB-C - Digital batteri uten duplikater (Del 3)"
          variables:
            lite_batteri_digital_nodup: >-
              {%- set ns = namespace(lines=[]) -%}
              {%- set low_names = (lite_batteri_prosent | default(''))
                  .split('\n')
                  | map('trim')
                  | select('match','^- ')
                  | map('regex_replace','^- ','')
                  | map('regex_replace','\\s*\\|.*$','')
                  | map('regex_replace','\\s*\\+\\s*$', '')
                  | map('regex_replace','\\s{2,}',' ')
                  | map('lower')
                  | list
              -%}
              {%- for line in (lite_batteri_digital | default('')).split('\n')
                    | map('trim')
                    | select('match','^- ') -%}
                {%- set raw = line | regex_replace('^- ','') -%}
                {%- set name_norm = raw
                    | regex_replace('\\s*\\|.*$','')
                    | regex_replace('\\s*\\+\\s*$', '')
                    | regex_replace('\\s{2,}',' ')
                    | lower
                -%}
                {%- if name_norm not in low_names -%}
                  {%- set ns.lines = ns.lines + [ line ] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.lines | join('\n') }}

        # Steg 4RB-D – Rydd begge batteri-lister + fjern enheter som allerede er i signal-lister (Del 3)
        - alias: "Steg 4RB-D - Batteri lister renset (Del 3)"
          variables:
            lite_batteri_prosent_clean: >-
              {% set out = namespace(lines=[]) %}
              {% for line in (lite_batteri_prosent | default('')).split('\n') %}
                {% set l = line | trim %}
                {% if l == '' %}
                {% elif not (l.startswith('- ')) %}
                {% else %}
                  {% set name = (l | regex_replace('^-\\s*','') | regex_replace('\\s*\\|.*$','') | trim) %}
                  {% if name != '' and (name | lower) != 'battery' %}
                    {% set out.lines = out.lines + [l] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ out.lines | join('\n') }}
            lite_batteri_digital_clean: >-
              {%- set signal_names = (
                    (nylig_mistet_clean | default(''))
                    ~ '\n' ~
                    (lang_offline_clean | default(''))
                  ).split('\n')
                  | map('trim')
                  | select('match','^- ')
                  | map('regex_replace','^- ','')
                  | map('regex_replace','\\s*\\|.*$','')
                  | map('regex_replace','(?i)\\s+level\\s*$','')
                  | map('regex_replace','\\s{2,}',' ')
                  | map('trim')
                  | map('lower')
                  | list
              -%}
              {%- set out = namespace(lines=[]) -%}
              {%- for line in (lite_batteri_digital_nodup | default('')).split('\n')
                    | map('trim')
                    | select('match','^- ') -%}
                {%- set name = (line
                    | regex_replace('^-\\s*','')
                    | regex_replace('\\s*\\|.*$','')
                    | trim) -%}
                {%- set name_norm = name
                    | regex_replace('(?i)\\s+level\\s*$','')
                    | regex_replace('\\s{2,}',' ')
                    | trim
                    | lower -%}
                {%- if name != '' and (name | lower) != 'battery' and name_norm not in signal_names -%}
                  {%- set out.lines = out.lines + [line] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ out.lines | join('\n') }}

        # Steg 5R – Bygg melding (raskt signal)
        - alias: "Steg 5R - Bygg melding (raskt signal)"
          variables:
            notification_title: >-
              {%- set ns = namespace(names=[]) -%}
              {%- for line in (nylig_mistet_clean | default('')).split('\n') | map('trim') | select('match', '^- ') -%}
                {%- set name = line | regex_replace('^-\\s*', '') | regex_replace('\\s*\\|.*$', '') | trim -%}
                {%- if name != '' and (name | lower) not in (ns.names | map('lower') | list) -%}
                  {%- set ns.names = ns.names + [name] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set cnt = ns.names | count -%}
              {%- if cnt == 1 -%}
                🔴 {{ ns.names[0] }} mistet signal
              {%- elif cnt > 1 -%}
                🔴 {{ cnt }} nye batteri enheter mistet signal
              {%- else -%}
                🔴 Nylig mistet signal
              {%- endif -%}
            combined_message: >-
              {% set parts = namespace(lines=[]) %}
              {% if (nylig_mistet_clean | trim) != '' %}
                {% set parts.lines = parts.lines + [
                  "Disse enhetene mistet signal siden forrige sjekk (terskel: " ~ (threshold_label | string) ~ "):",
                  nylig_mistet_clean,
                  ""
                ] %}
                {% if (lang_offline_clean | trim) != '' %}
                  {% set parts.lines = parts.lines + [
                    "Disse enhetene har ikke hatt signal på over " ~ (max_age_label | string) ~ ":",
                    lang_offline_clean,
                    ""
                  ] %}
                {% endif %}
                {% if (lite_batteri_prosent_clean | trim) != '' %}
                  {% set parts.lines = parts.lines + [
                    "Disse enhetene har batterinivå under " ~ (threshold | string) ~ "%:",
                    lite_batteri_prosent_clean,
                    ""
                  ] %}
                {% endif %}
                {% if (lite_batteri_digital_clean | trim) != '' %}
                  {% set parts.lines = parts.lines + [
                    "Disse enhetene rapporterer digitalt lavt batteri:",
                    lite_batteri_digital_clean,
                    ""
                  ] %}
                {% endif %}
                {% set parts.lines = parts.lines + ["Struktur: Navn | Sist sett / Batteri %."] %}
              {% endif %}
              {% if debug_on %}
                {% set parts.lines = parts.lines + [
                  "---",
                  "Debug (Del 3 – nylig mistet signal):",
                  "- trigger: " ~ trigger_label,
                  "- manual_run: " ~ (manual_run | string),
                  "- terskel: " ~ (threshold_label | string),
                  "- threshold_seconds: " ~ (threshold_seconds | string),
                  "- interval_seconds (auto): " ~ (interval_seconds | string),
                  "- include_unavailable: " ~ (include_unavailable | string),
                  "- ignored_entities: " ~ ((ignore_entities | count) | string),
                  "- ignored_devices: " ~ ((ignore_devices | count) | string)
                ] %}
              {% endif %}
              {{ (parts.lines | join('\n')) | trim }}

        # Steg 6R – Send varsel (raskt signal)
        - alias: "Steg 6R - Send varsel (raskt signal)"
          if:
            - condition: template
              value_template: "{{ nylig_mistet_clean | trim != '' }}"
          then:
            - action: script.varsel_pushover_send_melding_webhome
              data:
                title: "{{ notification_title | trim }}"
                message: "{{ combined_message }}"
                destination: "{{ pushover_destination }}"
                priority: "{{ pushover_priority | int(0) }}"
                ttl: "{{ pushover_ttl | int(604800) }}"

    # ═══════════════════════════════════════════════════════════════════════════
    # DEL 1 – BATTERI NIVÅ  +  DEL 2 – LANGSOMT SIGNAL
    # (planlagt sjekk og HA-oppstart)
    # ═══════════════════════════════════════════════════════════════════════════
    default:

      # ── Del 1 – Batteri nivå ──────────────────────────────────────────────────

      # Steg 2B – Bygg batteriliste (prosent)
      - alias: "Steg 2B - Bygg batteriliste (prosent)"
        variables:
          lite_batteri_prosent: |-
            {%- set ns = namespace(map={}, names={}, ages={}, lines=[]) -%}
            {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
            {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}

            {%- for s in states.sensor
                  | selectattr('attributes.device_class','defined')
                  | selectattr('attributes.device_class','eq','battery') -%}
              {%- set eid = s.entity_id -%}
              {%- set did = device_id(eid) -%}
              {%- if eid in ignore_e or (did and did in ignore_d) -%}
                {# Ignorert #}
              {%- else -%}
                {%- set state_str = s.state -%}
                {%- set is_num = state_str | is_number -%}
                {%- if is_num -%}
                  {%- set val = state_str | float -%}
                {%- else -%}
                  {%- set val = none -%}
                {%- endif -%}
                {%- set base = s.name
                    | regex_replace('(?i)(?:\\s|^)(battery|batteri|level)(?:\\s|$)', ' ')
                    | replace(' Battery+', '')
                    | regex_replace('\\s{2,}', ' ')
                    | regex_replace('\\s*\\+\\s*$', '')
                    | regex_replace('(?i)\\s*level\\s*$', '')
                    | trim -%}
                {%- set norm = base | lower | regex_replace('[^\\w\\s:]', '') | regex_replace('\\s{2,}', ' ') | trim -%}
                {%- set age_s = (as_timestamp(now()) - as_timestamp(s.last_changed, default=0) | float(0)) | int(0) -%}
                {%- if is_num and 0 <= val < (threshold | float(0)) -%}
                  {%- if norm not in ns.map or val < ns.map[norm] -%}
                    {%- set ns.map = dict(ns.map, **{norm: val}) -%}
                    {%- set ns.names = dict(ns.names, **{norm: base}) -%}
                    {%- set ns.ages = dict(ns.ages, **{norm: age_s}) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}

            {%- for norm, v in ns.map | dictsort(by='value') -%}
              {%- set age_s = ns.ages[norm] | int(0) -%}
              {%- set d = (age_s // 86400) | int(0) -%}
              {%- set h = ((age_s % 86400) // 3600) | int(0) -%}
              {%- set m = ((age_s % 3600) // 60) | int(0) -%}
              {%- if d > 0 -%}
                {%- set age_txt = d|string ~ 'd ' ~ h|string ~ 'h' -%}
              {%- elif h > 0 -%}
                {%- set age_txt = h|string ~ 'h ' ~ m|string ~ 'm' -%}
              {%- elif m > 0 -%}
                {%- set age_txt = m|string ~ 'm' -%}
              {%- else -%}
                {%- set age_txt = (age_s % 60)|string ~ 's' -%}
              {%- endif -%}
              {%- set ns.lines = ns.lines + ['- ' ~ ns.names[norm] ~ ' | ' ~ age_txt ~ ' / ' ~ (v | round(0) | int) ~ '%'] -%}
            {%- endfor -%}
            {{ ns.lines | join('\n') }}

      # Steg 3B – Bygg digital batteriliste (binary_sensor)
      - alias: "Steg 3B - Bygg digital batteriliste (binary_sensor)"
        variables:
          lite_batteri_digital: |-
            {%- set ns = namespace(lines=[]) -%}
            {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
            {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}

            {%- if not include_digital -%}
              {{ '' }}
            {%- else -%}
              {%- set items = states.binary_sensor
                  | selectattr('attributes.device_class','eq','battery')
                  | rejectattr('state','eq','off')
                  | sort(attribute='name') | list -%}

              {%- for e in items -%}
                {%- set eid = e.entity_id -%}
                {%- set did = device_id(eid) -%}
                {%- if eid in ignore_e or (did and did in ignore_d) -%}
                  {# Ignorert #}
                {%- else -%}
                  {%- set base = e.name
                      | regex_replace('(?i)\\bbattery\\s*low\\b:?',' ')
                      | regex_replace('(?i)\\bbatteri\\s*lav\\b:?',' ')
                      | regex_replace('(?i)\\bbattery\\b:?',' ')
                      | regex_replace('(?i)\\bbatteri\\b:?',' ')
                      | regex_replace('\\s*\\+\\s*$','')
                      | regex_replace('\\s*:\\s*$','')
                      | regex_replace('\\s{2,}',' ')
                      | trim -%}
                  {%- set age_s = (as_timestamp(now()) - as_timestamp(e.last_changed, default=0) | float(0)) | int(0) -%}
                  {%- set d = (age_s // 86400) | int(0) -%}
                  {%- set h = ((age_s % 86400) // 3600) | int(0) -%}
                  {%- set m = ((age_s % 3600) // 60) | int(0) -%}
                  {%- if d > 0 -%}
                    {%- set age_txt = d|string ~ 'd ' ~ h|string ~ 'h' -%}
                  {%- elif h > 0 -%}
                    {%- set age_txt = h|string ~ 'h ' ~ m|string ~ 'm' -%}
                  {%- elif m > 0 -%}
                    {%- set age_txt = m|string ~ 'm' -%}
                  {%- else -%}
                    {%- set age_txt = (age_s % 60)|string ~ 's' -%}
                  {%- endif -%}
                  {%- set ns.lines = ns.lines + ['- ' ~ base ~ ' | ' ~ age_txt ~ ' / Ukjent'] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.lines | join('\n') }}
            {%- endif -%}

      # Steg 4B – Fjern duplikater (digital vs prosent)
      - alias: "Steg 4B - Fjern duplikater (digital vs prosent)"
        variables:
          lite_batteri_digital_nodup: >-
            {%- set ns = namespace(lines=[]) -%}
            {%- set low_names = (lite_batteri_prosent | default(''))
                .split('\n')
                | map('trim')
                | select('match','^- ')
                | map('regex_replace','^- ','')
                | map('regex_replace','\\s*\\|.*$','')
                | map('regex_replace','\\s*\\+\\s*$', '')
                | map('regex_replace','\\s{2,}',' ')
                | map('lower')
                | list
            -%}
            {%- for line in (lite_batteri_digital | default('')).split('\n')
                  | map('trim')
                  | select('match','^- ') -%}
              {%- set raw = line | regex_replace('^- ','') -%}
              {%- set name_norm = raw
                  | regex_replace('\\s*\\|.*$','')
                  | regex_replace('\\s*\\+\\s*$', '')
                  | regex_replace('\\s{2,}',' ')
                  | lower
              -%}
              {%- if name_norm not in low_names -%}
                {%- set ns.lines = ns.lines + [ line ] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.lines | join('\n') }}

      # Steg 5B – Rydd bort meningsløse linjer (batteri nivå)
      - alias: "Steg 5B - Rydd bort meningsløse linjer (batteri nivå)"
        variables:
          lite_batteri_prosent_clean: >-
            {% set out = namespace(lines=[]) %}
            {% for line in (lite_batteri_prosent | default('')).split('\n') %}
              {% set l = line | trim %}
              {% if l == '' %}
              {% elif not (l.startswith('- ')) %}
              {% else %}
                {% set name = (l | regex_replace('^-\\s*','') | regex_replace('\\s*\\|.*$','') | trim) %}
                {% if name != '' and (name | lower) != 'battery' %}
                  {% set out.lines = out.lines + [l] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ out.lines | join('\n') }}

          lite_batteri_digital_clean: >-
            {% set out = namespace(lines=[]) %}
            {% for line in (lite_batteri_digital_nodup | default('')).split('\n') %}
              {% set l = line | trim %}
              {% if l == '' %}
              {% elif not (l.startswith('- ')) %}
              {% else %}
                {% set name = (l | regex_replace('^-\\s*','') | regex_replace('\\s*\\|.*$','') | trim) %}
                {% if name != '' and (name | lower) != 'battery' %}
                  {% set out.lines = out.lines + [l] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ out.lines | join('\n') }}

      # Steg 6B – Bygg samlet batteri nivå-melding
      - alias: "Steg 6B - Bygg samlet batteri nivå-melding"
        variables:
          combined_message_batteri: >-
            {% set parts = namespace(lines=[]) %}
            {% if (lite_batteri_prosent_clean | trim) != '' %}
              {% set parts.lines = parts.lines + ["Disse enhetene har batterinivå under " ~ (threshold | string) ~ "%:", lite_batteri_prosent_clean, ""] %}
            {% endif %}
            {% if (lite_batteri_digital_clean | trim) != '' %}
              {% set parts.lines = parts.lines + ["Disse enhetene rapporterer digitalt lavt batteri:", lite_batteri_digital_clean, ""] %}
            {% endif %}
            {% if debug_on %}
              {% set parts.lines = parts.lines + [
                "---",
                "Debug (Del 1 – batteri nivå):",
                "- trigger: " ~ trigger_label,
                "- manual_run: " ~ (manual_run | string),
                "- threshold: " ~ (threshold | string) ~ "%",
                "- include_digital: " ~ (include_digital | string),
                "- ignored_entities: " ~ ((ignore_entities | count) | string),
                "- ignored_devices: " ~ ((ignore_devices | count) | string)
              ] %}
            {% endif %}
            {{ (parts.lines | join('\n')) | trim }}

      # ── Del 2 – Langsomt signal ───────────────────────────────────────────────

      # Steg 7S – Bygg per-device aktivitetsindeks (langsomt signal)
      - alias: "Steg 7S - Bygg per-device aktivitetsindeks (langsomt signal)"
        variables:
          device_activity_index: |-
            {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
            {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}
            {%- set ns = namespace(idx={}, seen=[]) -%}

            {%- for s in states.sensor
                  | selectattr('attributes.device_class','defined')
                  | selectattr('attributes.device_class','eq','battery') -%}
              {%- set did = device_id(s.entity_id) -%}
              {%- if s.entity_id not in ignore_e
                  and did is not none
                  and did not in ignore_d
                  and did not in ns.seen -%}
                {%- set ns.seen = ns.seen + [did] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- for b in states.binary_sensor
                  | selectattr('attributes.device_class','eq','battery') -%}
              {%- set did = device_id(b.entity_id) -%}
              {%- if b.entity_id not in ignore_e
                  and did is not none
                  and did not in ignore_d
                  and did not in ns.seen -%}
                {%- set ns.seen = ns.seen + [did] -%}
              {%- endif -%}
            {%- endfor -%}

            {%- for did in ns.seen -%}
              {%- set w = namespace(ts=0, ent='', src='') -%}
              {%- for ent in device_entities(did) -%}
                {%- set st_obj = states[ent] -%}
                {%- if st_obj is not none -%}
                  {%- if st_obj.entity_id.split('.')[0] in ['sensor','binary_sensor'] -%}
                    {%- set t_upd = as_timestamp(st_obj.last_changed, default=0) | float(0) -%}
                    {%- if t_upd > w.ts -%}
                      {%- set w.ts = t_upd -%}
                      {%- set w.ent = ent -%}
                      {%- set w.src = 'meta:last_changed' -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- set ls = state_attr(ent,'last_seen') -%}
                  {%- if ls is not none -%}
                    {%- set t_ls = as_timestamp(ls, default=0) | float(0) -%}
                    {%- if t_ls > w.ts -%}
                      {%- set w.ts = t_ls -%}
                      {%- set w.ent = ent -%}
                      {%- set w.src = 'attr:last_seen' -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- if 'last_seen' in (ent | lower) -%}
                    {%- set t2 = as_timestamp(states(ent), default=0) | float(0) -%}
                    {%- if t2 > w.ts -%}
                      {%- set w.ts = t2 -%}
                      {%- set w.ent = ent -%}
                      {%- set w.src = 'state:last_seen_entity' -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set age_s = (as_timestamp(now()) - w.ts) | int(0) -%}
              {%- set ns.idx = dict(ns.idx, **{
                did: {
                  'winner_entity': w.ent,
                  'winner_source': w.src,
                  'winner_ts': w.ts,
                  'winner_age_s': age_s
                }
              }) -%}
            {%- endfor -%}
            {{ ns.idx | to_json }}
            {# Merk: output er JSON; størrelse er proporsjonal med antall unike devices. #}

      # Steg 8S – Finn batteri-enheter uten signal på lenge (langsomt, rå)
      - alias: "Steg 8S - Finn batteri-enheter uten signal på lenge (langsomt, rå)"
        variables:
          lang_offline_raw: |-
            {%- set threshold_s = (max_age_seconds | int(0)) -%}
            {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
            {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}
            {%- set _raw_idx = device_activity_index | default({}) -%}
            {%- set idx = _raw_idx if _raw_idx is mapping else (_raw_idx | default('{}') | from_json) -%}
            {%- set ns = namespace(map={}, lines=[]) -%}

            {# ===== sensor battery ===== #}
            {%- for s in states.sensor
                  | selectattr('attributes.device_class','defined')
                  | selectattr('attributes.device_class','eq','battery') -%}
              {%- set eid = s.entity_id -%}
              {%- set did = device_id(eid) -%}
              {%- if eid in ignore_e or (did and did in ignore_d) -%}
                {# ignorert #}
              {%- else -%}
                {%- set base = s.name
                    | regex_replace('(?i)(?:\\s|^)(battery|batteri|level)(?:\\s|$)', ' ')
                    | replace(' Battery+', '')
                    | regex_replace('\\s{2,}', ' ')
                    | regex_replace('\\s*\\+\\s*$', '')
                    | regex_replace('(?i)\\s*level\\s*$', '')
                    | trim -%}
                {%- set norm = base | lower | regex_replace('[^\\w\\s:]', '') | regex_replace('\\s{2,}', ' ') | trim -%}
                {%- if did and did in idx -%}
                  {%- set age_s = idx[did]['winner_age_s'] | int(0) -%}
                {%- else -%}
                  {%- set ts = as_timestamp(s.last_changed, default=0) | float(0) -%}
                  {%- set age_s = (as_timestamp(now()) - ts) | int(0) -%}
                {%- endif -%}
                {%- set st = s.state -%}
                {%- if age_s >= threshold_s and norm != '' -%}
                  {%- set keep = false -%}
                  {%- if norm not in ns.map -%}
                    {%- set keep = true -%}
                  {%- else -%}
                    {%- set cur = ns.map[norm] -%}
                    {%- if (age_s | int(0)) > (cur['age_s'] | int(0)) -%}
                      {%- set keep = true -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- if keep -%}
                    {%- set ns.map = dict(ns.map, **{norm: {'base': base, 'age_s': age_s, 'state': st}}) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}

            {# ===== binary_sensor battery ===== #}
            {%- for b in states.binary_sensor
                  | selectattr('attributes.device_class','eq','battery') -%}
              {%- set eid = b.entity_id -%}
              {%- set did = device_id(eid) -%}
              {%- if eid in ignore_e or (did and did in ignore_d) -%}
                {# ignorert #}
              {%- else -%}
                {%- set base = b.name
                    | regex_replace('(?i)\\bbattery\\s*low\\b:?',' ')
                    | regex_replace('(?i)\\bbatteri\\s*lav\\b:?',' ')
                    | regex_replace('(?i)\\bbattery\\b:?',' ')
                    | regex_replace('(?i)\\bbatteri\\b:?',' ')
                    | regex_replace('\\s*\\+\\s*$','')
                    | regex_replace('\\s*:\\s*$','')
                    | regex_replace('\\s{2,}',' ')
                    | trim -%}
                {%- set norm = base | lower | regex_replace('[^\\w\\s:]', '') | regex_replace('\\s{2,}', ' ') | trim -%}
                {%- if did and did in idx -%}
                  {%- set age_s = idx[did]['winner_age_s'] | int(0) -%}
                {%- else -%}
                  {%- set ts = as_timestamp(b.last_changed, default=0) | float(0) -%}
                  {%- set age_s = (as_timestamp(now()) - ts) | int(0) -%}
                {%- endif -%}
                {%- set st = b.state -%}
                {%- if age_s >= threshold_s and norm != '' -%}
                  {%- set keep = false -%}
                  {%- if norm not in ns.map -%}
                    {%- set keep = true -%}
                  {%- else -%}
                    {%- set cur = ns.map[norm] -%}
                    {%- if (age_s | int(0)) > (cur['age_s'] | int(0)) -%}
                      {%- set keep = true -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- if keep -%}
                    {%- set ns.map = dict(ns.map, **{norm: {'base': base, 'age_s': age_s, 'state': st}}) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}

            {# ===== Render sortert (eldst først) ===== #}
            {%- set items = namespace(lst=[]) -%}
            {%- for norm, it in ns.map.items() -%}
              {%- set items.lst = items.lst + [{'age_s': it['age_s']|int(0), 'base': it['base']|string, 'state': it['state']|string}] -%}
            {%- endfor -%}
            {%- for it in (items.lst | sort(attribute='age_s', reverse=true)) -%}
              {%- set age_s = it.age_s -%}
              {%- set base = it.base -%}
              {%- set d = (age_s // 86400) | int(0) -%}
              {%- set h = ((age_s % 86400) // 3600) | int(0) -%}
              {%- set m = ((age_s % 3600) // 60) | int(0) -%}
              {%- if d > 0 -%}
                {%- set age_txt = d|string ~ 'd ' ~ h|string ~ 'h' -%}
              {%- elif h > 0 -%}
                {%- set age_txt = h|string ~ 'h ' ~ m|string ~ 'm' -%}
              {%- elif m > 0 -%}
                {%- set age_txt = m|string ~ 'm' -%}
              {%- else -%}
                {%- set s = (age_s % 60) | int(0) -%}
                {%- set age_txt = s|string ~ 's' -%}
              {%- endif -%}
              {%- set pct_txt = (it.state ~ '%') if (it.state | is_number) else 'Ukjent' -%}
              {%- set ns.lines = ns.lines + ['- ' ~ base ~ ' | ' ~ age_txt ~ ' / ' ~ pct_txt] -%}
            {%- endfor -%}
            {{ ns.lines | join('\n') }}

          # Alltid synlig i trace – viser hvilken entity/kilde som ga nyeste aktivitet
          lang_offline_debug: |-
            {%- set threshold_s = (max_age_seconds | int(0)) -%}
            {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
            {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}
            {%- set _raw_idx = device_activity_index | default({}) -%}
            {%- set idx = _raw_idx if _raw_idx is mapping else (_raw_idx | default('{}') | from_json) -%}
            {%- set ns = namespace(out=[]) -%}
            {%- for s in states.sensor
                  | selectattr('attributes.device_class','defined')
                  | selectattr('attributes.device_class','eq','battery') -%}
              {%- set eid = s.entity_id -%}
              {%- set did = device_id(eid) -%}
              {%- if eid not in ignore_e and not (did and did in ignore_d) -%}
                {%- if did and did in idx -%}
                  {%- set w = idx[did] -%}
                  {%- set age_s = w['winner_age_s'] | int(0) -%}
                {%- else -%}
                  {%- set age_s = (as_timestamp(now()) - as_timestamp(s.last_changed, default=0) | float(0)) | int(0) -%}
                  {%- set w = {'winner_entity': eid, 'winner_source': 'meta:last_changed', 'winner_age_s': age_s} -%}
                {%- endif -%}
                {%- set st = s.state -%}
                {%- if age_s >= threshold_s -%}
                  {%- set ns.out = ns.out + [{'entity_id': eid, 'name': s.name, 'state': st, 'age_s': age_s, 'winner_entity': w['winner_entity'], 'winner_source': w['winner_source'], 'winner_age_s': w['winner_age_s']}] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- for b in states.binary_sensor
                  | selectattr('attributes.device_class','eq','battery') -%}
              {%- set eid = b.entity_id -%}
              {%- set did = device_id(eid) -%}
              {%- if eid not in ignore_e and not (did and did in ignore_d) -%}
                {%- if did and did in idx -%}
                  {%- set w = idx[did] -%}
                  {%- set age_s = w['winner_age_s'] | int(0) -%}
                {%- else -%}
                  {%- set age_s = (as_timestamp(now()) - as_timestamp(b.last_changed, default=0) | float(0)) | int(0) -%}
                  {%- set w = {'winner_entity': eid, 'winner_source': 'meta:last_changed', 'winner_age_s': age_s} -%}
                {%- endif -%}
                {%- set st = b.state -%}
                {%- if age_s >= threshold_s -%}
                  {%- set ns.out = ns.out + [{'entity_id': eid, 'name': b.name, 'state': st, 'age_s': age_s, 'winner_entity': w['winner_entity'], 'winner_source': w['winner_source'], 'winner_age_s': w['winner_age_s']}] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.out | to_json }}

      # Steg 9S – Rydd bort meningsløse linjer (langsomt signal)
      - alias: "Steg 9S - Rydd bort meningsløse linjer (langsomt signal)"
        variables:
          lang_offline_clean: >-
            {% set out = namespace(map={}, order=[]) %}
            {% for line in (lang_offline_raw | default('')).split('\n') %}
              {% set l = line | trim %}
              {% if l == '' %}
              {% elif not l.startswith('- ') %}
              {% else %}
                {% set name = (l | regex_replace('^-\\s*','') | regex_replace('\\s*\\|.*$','') | trim) %}
                {% set canon = name
                  | regex_replace('(?i)\\s+level\\s*$','')
                  | regex_replace('\\s{2,}',' ')
                  | trim
                  | lower %}
                {% if name != '' and canon != 'battery' %}
                  {% if canon not in out.map %}
                    {% set out.map = dict(out.map, **{canon: l}) %}
                    {% set out.order = out.order + [canon] %}
                  {% else %}
                    {% set current = out.map[canon] %}
                    {% set current_name = (current | regex_replace('^-\\s*','') | regex_replace('\\s*\\|.*$','') | trim) %}
                    {% if (name | length) < (current_name | length) %}
                      {% set out.map = dict(out.map, **{canon: l}) %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% set lines = namespace(lst=[]) %}
            {% for canon in out.order %}
              {% set lines.lst = lines.lst + [out.map[canon]] %}
            {% endfor %}
            {{ lines.lst | join('\n') }}

      # Steg 9S-B – Bygg liste over alle enheter uten signal >= terskel (offline_full_raw)
      - alias: "Steg 9S-B - Alle enheter uten signal fra terskel (rå)"
        variables:
          offline_full_raw: |-
            {%- set threshold_s = (threshold_seconds | int(0)) -%}
            {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
            {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}
            {%- set _raw_idx = device_activity_index | default({}) -%}
            {%- set idx = _raw_idx if _raw_idx is mapping else (_raw_idx | default('{}') | from_json) -%}
            {%- set ns = namespace(map={}, lines=[]) -%}

            {# ===== sensor battery ===== #}
            {%- for s in states.sensor
                  | selectattr('attributes.device_class','defined')
                  | selectattr('attributes.device_class','eq','battery') -%}
              {%- set eid = s.entity_id -%}
              {%- set did = device_id(eid) -%}
              {%- if eid in ignore_e or (did and did in ignore_d) -%}
                {# ignorert #}
              {%- else -%}
                {%- set base = s.name
                    | regex_replace('(?i)(?:\\s|^)(battery|batteri|level)(?:\\s|$)', ' ')
                    | replace(' Battery+', '')
                    | regex_replace('\\s{2,}', ' ')
                    | regex_replace('\\s*\\+\\s*$', '')
                    | regex_replace('(?i)\\s*level\\s*$', '')
                    | trim -%}
                {%- set norm = base | lower | regex_replace('[^\\w\\s:]', '') | regex_replace('\\s{2,}', ' ') | trim -%}
                {%- if did and did in idx -%}
                  {%- set age_s = idx[did]['winner_age_s'] | int(0) -%}
                {%- else -%}
                  {%- set ts = as_timestamp(s.last_changed, default=0) | float(0) -%}
                  {%- set age_s = (as_timestamp(now()) - ts) | int(0) -%}
                {%- endif -%}
                {%- set st = s.state -%}
                {%- if age_s >= threshold_s and norm != '' -%}
                  {%- set keep = false -%}
                  {%- if norm not in ns.map -%}
                    {%- set keep = true -%}
                  {%- else -%}
                    {%- set cur = ns.map[norm] -%}
                    {%- if (age_s | int(0)) > (cur['age_s'] | int(0)) -%}
                      {%- set keep = true -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- if keep -%}
                    {%- set ns.map = dict(ns.map, **{norm: {'base': base, 'age_s': age_s, 'state': st}}) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}

            {# ===== binary_sensor battery ===== #}
            {%- for b in states.binary_sensor
                  | selectattr('attributes.device_class','eq','battery') -%}
              {%- set eid = b.entity_id -%}
              {%- set did = device_id(eid) -%}
              {%- if eid in ignore_e or (did and did in ignore_d) -%}
                {# ignorert #}
              {%- else -%}
                {%- set base = b.name
                    | regex_replace('(?i)\\bbattery\\s*low\\b:?',' ')
                    | regex_replace('(?i)\\bbatteri\\s*lav\\b:?',' ')
                    | regex_replace('(?i)\\bbattery\\b:?',' ')
                    | regex_replace('(?i)\\bbatteri\\b:?',' ')
                    | regex_replace('\\s*\\+\\s*$','')
                    | regex_replace('\\s*:\\s*$','')
                    | regex_replace('\\s{2,}',' ')
                    | trim -%}
                {%- set norm = base | lower | regex_replace('[^\\w\\s:]', '') | regex_replace('\\s{2,}', ' ') | trim -%}
                {%- if did and did in idx -%}
                  {%- set age_s = idx[did]['winner_age_s'] | int(0) -%}
                {%- else -%}
                  {%- set ts = as_timestamp(b.last_changed, default=0) | float(0) -%}
                  {%- set age_s = (as_timestamp(now()) - ts) | int(0) -%}
                {%- endif -%}
                {%- set st = b.state -%}
                {%- if age_s >= threshold_s and norm != '' -%}
                  {%- set keep = false -%}
                  {%- if norm not in ns.map -%}
                    {%- set keep = true -%}
                  {%- else -%}
                    {%- set cur = ns.map[norm] -%}
                    {%- if (age_s | int(0)) > (cur['age_s'] | int(0)) -%}
                      {%- set keep = true -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- if keep -%}
                    {%- set ns.map = dict(ns.map, **{norm: {'base': base, 'age_s': age_s, 'state': st}}) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}

            {# ===== Render sortert (eldst først) ===== #}
            {%- set items = namespace(lst=[]) -%}
            {%- for norm, it in ns.map.items() -%}
              {%- set items.lst = items.lst + [{'age_s': it['age_s']|int(0), 'base': it['base']|string, 'state': it['state']|string}] -%}
            {%- endfor -%}
            {%- for it in (items.lst | sort(attribute='age_s', reverse=true)) -%}
              {%- set age_s = it.age_s -%}
              {%- set base = it.base -%}
              {%- set d = (age_s // 86400) | int(0) -%}
              {%- set h = ((age_s % 86400) // 3600) | int(0) -%}
              {%- set m = ((age_s % 3600) // 60) | int(0) -%}
              {%- if d > 0 -%}
                {%- set age_txt = d|string ~ 'd ' ~ h|string ~ 'h' -%}
              {%- elif h > 0 -%}
                {%- set age_txt = h|string ~ 'h ' ~ m|string ~ 'm' -%}
              {%- elif m > 0 -%}
                {%- set age_txt = m|string ~ 'm' -%}
              {%- else -%}
                {%- set s = (age_s % 60) | int(0) -%}
                {%- set age_txt = s|string ~ 's' -%}
              {%- endif -%}
              {%- set pct_txt = (it.state ~ '%') if (it.state | is_number) else 'Ukjent' -%}
              {%- set ns.lines = ns.lines + ['- ' ~ base ~ ' | ' ~ age_txt ~ ' / ' ~ pct_txt] -%}
            {%- endfor -%}
            {{ ns.lines | join('\n') }}

      # Steg 9S-C – Rydd bort meningsløse linjer (alle enheter uten signal fra terskel)
      - alias: "Steg 9S-C - Alle enheter uten signal fra terskel (renset)"
        variables:
          offline_full_clean: >-
            {% set out = namespace(map={}, order=[]) %}
            {% for line in (offline_full_raw | default('')).split('\n') %}
              {% set l = line | trim %}
              {% if l == '' %}
              {% elif not l.startswith('- ') %}
              {% else %}
                {% set name = (l | regex_replace('^-\\s*','') | regex_replace('\\s*\\|.*$','') | trim) %}
                {% set canon = name
                  | regex_replace('(?i)\\s+level\\s*$','')
                  | regex_replace('\\s{2,}',' ')
                  | trim
                  | lower %}
                {% if name != '' and canon != 'battery' %}
                  {% if canon not in out.map %}
                    {% set out.map = dict(out.map, **{canon: l}) %}
                    {% set out.order = out.order + [canon] %}
                  {% else %}
                    {% set current = out.map[canon] %}
                    {% set current_name = (current | regex_replace('^-\\s*','') | regex_replace('\\s*\\|.*$','') | trim) %}
                    {% if (name | length) < (current_name | length) %}
                      {% set out.map = dict(out.map, **{canon: l}) %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% set lines = namespace(lst=[]) %}
            {% for canon in out.order %}
              {% set lines.lst = lines.lst + [out.map[canon]] %}
            {% endfor %}
            {{ lines.lst | join('\n') }}

      # Steg 9S-D – Fjern duplikater mellom signal-lister (senere lister skal ikke gjenta tidligere)
      - alias: "Steg 9S-D - Fjern duplikater mellom signal-lister"
        variables:
          offline_full_final: >-
            {% set filtered = namespace(lines=[]) %}
            {% set lang_names = (lang_offline_clean | default(''))
              .split('\n')
              | map('trim')
              | select('match','^- ')
              | map('regex_replace','^- ','')
              | map('regex_replace','\s*\|.*$','')
              | map('regex_replace','(?i)\s+level\s*$','')
              | map('regex_replace','\s{2,}',' ')
              | map('trim')
              | map('lower')
              | list
            %}
            {% for line in (offline_full_clean | default('')).split('\n') %}
              {% set current_line = line | trim %}
              {% if current_line == '' %}
              {% elif not current_line.startswith('- ') %}
              {% else %}
                {% set name_norm = (current_line
                  | regex_replace('^-\s*','')
                  | regex_replace('\s*\|.*$','')
                  | regex_replace('(?i)\s+level\s*$','')
                  | regex_replace('\s{2,}',' ')
                  | trim
                  | lower) %}
                {% if name_norm not in lang_names %}
                  {% set filtered.lines = filtered.lines + [current_line] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ filtered.lines | join('\n') }}

      # Steg 10S – Bygg endelig langsomt signal-melding
      - alias: "Steg 10S - Bygg endelig signal-melding (vært offline en stund)"
        variables:
          combined_message_signal: >-
            {% set parts = namespace(lines=[]) %}
            {% set msg = namespace(signal_intro='') %}
            {% if manual_run %}
              {% set msg.signal_intro = "Disse enhetene er ikke hørt fra på over " ~ (max_age_label | string) ~ ":" %}
            {% else %}
              {% set msg.signal_intro = "Disse enhetene utløste varselet – ikke hørt fra på over " ~ (max_age_label | string) ~ ":" %}
            {% endif %}
            {% if (lang_offline_clean | trim) != '' %}
              {% set parts.lines = parts.lines + [
                msg.signal_intro,
                lang_offline_clean,
                ""
              ] %}
              {% if (offline_full_final | trim) != '' %}
                {% set parts.lines = parts.lines + [
                  "Alle enheter uten signal siden " ~ (threshold_label | string) ~ ":",
                  offline_full_final,
                  ""
                ] %}
              {% endif %}
            {% endif %}
            {% if debug_on %}
              {% set parts.lines = parts.lines + [
                "---",
                "Debug (Del 2 – vært offline en stund):",
                "- trigger: " ~ trigger_label,
                "- manual_run: " ~ (manual_run | string),
                "- max_age: " ~ (max_age_label | string),
                "- max_age_seconds: " ~ (max_age_seconds | string),
                "- terskel: " ~ (threshold_label | string),
                "- threshold_seconds: " ~ (threshold_seconds | string),
                "- ignored_entities: " ~ ((ignore_entities | count) | string),
                "- ignored_devices: " ~ ((ignore_devices | count) | string)
              ] %}
            {% endif %}
            {{ (parts.lines | join('\n')) | trim }}

      # Steg 10B – Fjern batterinivå-linjer som allerede er rapportert uten signal
      - alias: "Steg 10B - Fjern batterinivå-linjer som allerede er rapportert uten signal"
        variables:
          lite_batteri_digital_final: >-
            {% set ns = namespace(lines=[]) %}
            {% set offline_full_names = (offline_full_clean | default(''))
              .split('\n')
              | map('trim')
              | select('match','^- ')
              | map('regex_replace','^- ','')
              | map('regex_replace','\\s*\\|.*$','')
              | map('regex_replace','(?i)\\s+level\\s*$','')
              | map('regex_replace','\\s{2,}',' ')
              | map('trim')
              | map('lower')
              | list
            %}
            {% for line in (lite_batteri_digital_clean | default('')).split('\n') %}
              {% set l = line | trim %}
              {% if l == '' %}
              {% elif not l.startswith('- ') %}
              {% else %}
                {% set name_norm = (l
                  | regex_replace('^-\\s*','')
                  | regex_replace('\\s*\\|.*$','')
                  | regex_replace('(?i)\\s+level\\s*$','')
                  | regex_replace('\\s{2,}',' ')
                  | trim
                  | lower) %}
                {% if name_norm not in offline_full_names %}
                  {% set ns.lines = ns.lines + [l] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.lines | join('\n') }}
          combined_message_batteri_final: >-
            {% set parts = namespace(lines=[]) %}
            {% if (lite_batteri_prosent_clean | trim) != '' %}
              {% set parts.lines = parts.lines + ["Disse enhetene har batterinivå under " ~ (threshold | string) ~ "%:", lite_batteri_prosent_clean, ""] %}
            {% endif %}
            {% if (lite_batteri_digital_final | trim) != '' %}
              {% set parts.lines = parts.lines + ["Disse enhetene rapporterer digitalt lavt batteri:", lite_batteri_digital_final, ""] %}
            {% endif %}
            {% if debug_on %}
              {% set parts.lines = parts.lines + [
                "---",
                "Debug (Del 1 – batteri nivå):",
                "- trigger: " ~ trigger_label,
                "- manual_run: " ~ (manual_run | string),
                "- threshold: " ~ (threshold | string) ~ "%",
                "- include_digital: " ~ (include_digital | string),
                "- ignored_entities: " ~ ((ignore_entities | count) | string),
                "- ignored_devices: " ~ ((ignore_devices | count) | string)
              ] %}
            {% endif %}
            {{ (parts.lines | join('\n')) | trim }}

      # ── Send varsel ───────────────────────────────────────────────────────────

      # Steg 11 – Bygg samlet varsel (planlagt sjekk)
      - alias: "Steg 11 - Bygg samlet varsel (planlagt sjekk)"
        variables:
          notification_title: >-
            {%- set ns = namespace(trigger_reason_device_names=[]) -%}
            {%- for line in (lang_offline_clean | default('')).split('\n') | map('trim') | select('match', '^- ') -%}
              {%- set name = line | regex_replace('^-\\s*', '') | regex_replace('\\s*\\|.*$', '') | trim -%}
              {%- if name != '' and (name | lower) not in (ns.trigger_reason_device_names | map('lower') | list) -%}
                {%- set ns.trigger_reason_device_names = ns.trigger_reason_device_names + [name] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set total_ns = namespace(names=ns.trigger_reason_device_names) -%}
            {%- for section in [
              offline_full_final | default(''),
              lite_batteri_prosent_clean | default(''),
              lite_batteri_digital_final | default('')
            ] -%}
              {%- for line in section.split('\n') | map('trim') | select('match', '^- ') -%}
                {%- set name = line | regex_replace('^-\\s*', '') | regex_replace('\\s*\\|.*$', '') | trim -%}
                {%- if name != '' and (name | lower) not in (total_ns.names | map('lower') | list) -%}
                  {%- set total_ns.names = total_ns.names + [name] -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {%- set reason_cnt = ns.trigger_reason_device_names | count -%}
            {%- set total_cnt = total_ns.names | count -%}
            {%- set has_signal_loss = (lang_offline_clean | trim) != '' or (offline_full_final | trim) != '' -%}
            {%- set has_low_battery = (lite_batteri_prosent_clean | trim) != '' or (lite_batteri_digital_final | trim) != '' -%}
            {%- if manual_run and total_cnt > 0 -%}
              {%- if total_cnt == 1 -%}
                {{ '🔴' if has_signal_loss else '🟠' }} 1 enhet med avvik
              {%- else -%}
                {{ '🔴' if has_signal_loss else '🟠' }} {{ total_cnt }} enheter med avvik
              {%- endif -%}
            {%- elif has_signal_loss and reason_cnt == 1 -%}
              🔴 {{ ns.trigger_reason_device_names[0] }} uten signal
            {%- elif has_signal_loss and reason_cnt > 1 -%}
              🔴 {{ reason_cnt }} enheter uten signal
            {%- elif has_signal_loss -%}
              🔴 Enheter uten signal
            {%- elif has_low_battery and total_cnt == 1 -%}
              🟠 1 enhet med lavt batteri
            {%- elif has_low_battery and total_cnt > 1 -%}
              🟠 {{ total_cnt }} enheter med lavt batteri
            {%- elif has_low_battery -%}
              🟠 Lavt batterinivå
            {%- else -%}
              🟠 Batterivarsel
            {%- endif -%}
          merged_message: >-
            {% set parts = namespace(lines=[]) %}
            {% if (combined_message_signal | trim) != '' %}
              {% set parts.lines = parts.lines + [combined_message_signal | trim] %}
            {% endif %}
            {% if (combined_message_batteri_final | trim) != '' %}
              {% if parts.lines | count > 0 %}
                {% set parts.lines = parts.lines + [''] %}
              {% endif %}
              {% set parts.lines = parts.lines + [combined_message_batteri_final | trim] %}
            {% endif %}
            {% if parts.lines | count > 0 %}
              {% set parts.lines = parts.lines + ['', 'Struktur: Navn | Sist sett / Batteri %.'] %}
            {% endif %}
            {{ (parts.lines | join('\n')) | trim }}

      # Steg 12 – Send samlet varsel (planlagt sjekk)
      - alias: "Steg 12 - Send samlet varsel (planlagt sjekk)"
        if:
          - condition: template
            value_template: "{{ merged_message | trim != '' }}"
        then:
          - action: script.varsel_pushover_send_melding_webhome
            data:
              title: "{{ notification_title | trim }}"
              message: "{{ merged_message }}"
              destination: "{{ pushover_destination }}"
              priority: "{{ pushover_priority | int(0) }}"
              ttl: "{{ pushover_ttl | int(604800) }}"
