blueprint:
  name: Varsel - Batteri, lavt nivå (WebHome)
  description: >
    Sender varsel om lavt batteri basert på:
      1) sensor.* med device_class: battery (prosent)
         - deduper per "renset" navn og beholder laveste verdi
         - kun numeriske verdier under terskel inkluderes
      2) binary_sensor.* med device_class: battery (digital battery low)
         - tar med de som ikke er 'off'
         - fjerner duplikater som allerede er i liste (1)

    Nytt:
      - Én samlet melding (analog + digital)
      - Ignore-liste for entities (og valgfri ignore-liste for devices)
      - Filtrerer bort meningsløse linjer

    Blueprint versjon: 2026.07.00
  domain: automation
  author: WebHome
  source_url: https://github.com/surematu/WebHomeHelpFiles/blob/main/blueprints/automation/varsel_batteri.yaml
  homeassistant:
    min_version: 2025.11.0

  input:
    pushover_destination:
      name: Pushover destination
      description: Mottakergruppe i script.varsel_pushover_send_melding_webhome
      default: pushover
      selector:
        text:

    pushover_priority:
      name: Pushover priority
      description: Prioritet brukt for varsling
      default: 0
      selector:
        number:
          min: -2
          max: 2
          step: 1
          mode: box

    pushover_ttl:
      name: Pushover TTL (sekunder)
      description: Levetid for varselet (f.eks. 86400 = 1 døgn)
      default: 604800
      selector:
        number:
          min: 0
          max: 604800
          step: 60
          mode: box

    threshold_percent:
      name: Terskel for lavt batteri (%)
      default: 30
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

    include_digital_battery_sensors:
      name: "Ta med digitale batterisensorer (binary_sensor device_class: battery)"
      default: true
      selector:
        boolean:

    ignore_entities:
      name: Ignorer entities (valgfritt)
      description: Velg entities du vil skjule fra rapporten (sensor/binary_sensor).
      default: []
      selector:
        entity:
          multiple: true

    ignore_devices:
      name: Ignorer devices (valgfritt)
      description: Velg devices du vil skjule (skjuler alle batteri-entities knyttet til device).
      default: []
      selector:
        device:
          multiple: true

    check_time:
      name: Tid for planlagt sjekk
      default: "09:05:00"
      selector:
        time:

    check_weekdays:
      name: Ukedag(er) for planlagt sjekk
      default:
        - wed
      selector:
        select:
          multiple: true
          mode: list
          options:
            - { label: Mandag, value: mon }
            - { label: Tirsdag, value: tue }
            - { label: Onsdag, value: wed }
            - { label: Torsdag, value: thu }
            - { label: Fredag, value: fri }
            - { label: Lørdag, value: sat }
            - { label: Søndag, value: sun }

    run_on_startup:
      name: Kjør ved oppstart av Home Assistant
      default: false
      selector:
        boolean:

mode: restart

trigger:
  - platform: time
    at: !input check_time
    weekday: !input check_weekdays
    id: scheduled_check

  - platform: homeassistant
    event: start
    id: ha_start
    enabled: !input run_on_startup

condition: []

action:
  - alias: "Steg 1 - Sett grunnvariabler"
    variables:
      threshold: !input threshold_percent
      include_digital: !input include_digital_battery_sensors
      ignore_entities: !input ignore_entities
      ignore_devices: !input ignore_devices
      pushover_destination: !input pushover_destination
      pushover_priority: !input pushover_priority
      pushover_ttl: !input pushover_ttl

  - alias: "Steg 2 - Bygg batteriliste (prosent)"
    variables:
      low_list_percent: |-
        {%- set ns = namespace(map={}, names={}, lines=[]) -%}
        {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
        {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}

        {%- for s in states.sensor
              | selectattr('attributes.device_class','defined')
              | selectattr('attributes.device_class','eq','battery') -%}

          {%- set eid = s.entity_id -%}
          {%- set did = device_id(eid) -%}

          {%- if eid in ignore_e or (did and did in ignore_d) -%}
            {# Ignorert #}
          {%- else -%}

            {%- set state_str = s.state -%}
            {%- set is_num = state_str | is_number -%}
            {%- if is_num -%}
              {%- set val = state_str | float -%}
            {%- else -%}
              {%- set val = none -%}
            {%- endif -%}

            {#--- Clean display name ---#}
            {%- set base = s.name
                | regex_replace('(?i)(?:\\s|^)(battery|batteri|level)(?:\\s|$)', ' ')
                | replace(' Battery+', '')
                | regex_replace('\\s{2,}', ' ')
                | regex_replace('\\s*\\+\\s*$', '')
                | trim -%}

            {#--- Normalized key for dedupe ---#}
            {%- set norm = base
                | lower
                | regex_replace('[^\\w\\s:]', '')
                | regex_replace('\\s{2,}', ' ')
                | trim -%}

            {#--- Numeric: keep lowest per name if under threshold ---#}
            {%- if is_num and 0 <= val < (threshold | float(0)) -%}
              {%- if norm not in ns.map or val < ns.map[norm] -%}
                {%- set ns.map = dict(ns.map, **{norm: val}) -%}
                {%- set ns.names = dict(ns.names, **{norm: base}) -%}
              {%- endif -%}
            {%- endif -%}

          {%- endif -%}
        {%- endfor -%}

        {#--- Numeric lows sorted ascending ---#}
        {%- for norm, v in ns.map | dictsort(by='value') -%}
          {%- set ns.lines = ns.lines + ['- ' ~ ns.names[norm] ~ ' (' ~ (v | round(0)) ~ '%)'] -%}
        {%- endfor -%}

        {{ ns.lines | join('\n') }}

  - alias: "Steg 3 - Bygg digital batteriliste (binary_sensor)"
    variables:
      low_list_digital: |-
        {%- set ns = namespace(lines=[]) -%}
        {%- set ignore_e = ignore_entities if ignore_entities is iterable else [] -%}
        {%- set ignore_d = ignore_devices if ignore_devices is iterable else [] -%}

        {%- if not include_digital -%}
          {{ '' }}
        {%- else -%}
          {%- set items = states.binary_sensor
              | selectattr('attributes.device_class','eq','battery')
              | rejectattr('state','eq','off')
              | sort(attribute='name') | list -%}

          {%- for e in items -%}
            {%- set eid = e.entity_id -%}
            {%- set did = device_id(eid) -%}

            {%- if eid in ignore_e or (did and did in ignore_d) -%}
              {# Ignorert #}
            {%- else -%}

              {%- set base = e.name
                  | regex_replace('(?i)\\bbattery\\s*low\\b:?',' ')
                  | regex_replace('(?i)\\bbatteri\\s*lav\\b:?',' ')
                  | regex_replace('(?i)\\bbattery\\b:?',' ')
                  | regex_replace('(?i)\\bbatteri\\b:?',' ')
                  | regex_replace('\\s*\\+\\s*$','')
                  | regex_replace('\\s*:\\s*$','')
                  | regex_replace('\\s{2,}',' ')
                  | trim -%}

              {%- if e.state == 'on' -%}
                {%- set status = 'Low' -%}
              {%- elif e.state in ['unknown','unavailable','none'] -%}
                {%- set status = 'Unknown' -%}
              {%- else -%}
                {%- set status = e.state | title -%}
              {%- endif -%}

              {%- set ns.lines = ns.lines + ['- ' ~ base ~ ' (' ~ status ~ ')'] -%}

            {%- endif -%}
          {%- endfor -%}

          {{ ns.lines | join('\n') }}
        {%- endif -%}

  - alias: "Steg 4 - Fjern duplikater (digital vs prosent)"
    variables:
      low_list_digital_nodup: >-
        {%- set ns = namespace(lines=[]) -%}

        {%- set low_names = (low_list_percent | default(''))
            .split('\n')
            | map('trim')
            | select('match','^- ')
            | map('regex_replace','^- ','')
            | map('regex_replace','\\s*\\([^)]*\\)\\s*$','')
            | map('regex_replace','\\s*\\+\\s*$', '')
            | map('regex_replace','\\s{2,}',' ')
            | map('lower')
            | list
        -%}

        {%- for line in (low_list_digital | default('')).split('\n')
              | map('trim')
              | select('match','^- ') -%}
          {%- set raw = line | regex_replace('^- ','') -%}
          {%- set name_norm = raw
              | regex_replace('\\s*\\([^)]*\\)\\s*$','')
              | regex_replace('\\s*\\+\\s*$', '')
              | regex_replace('\\s{2,}',' ')
              | lower
          -%}
          {%- if name_norm not in low_names -%}
            {%- set ns.lines = ns.lines + [ line ] -%}
          {%- endif -%}
        {%- endfor -%}

        {{ ns.lines | join('\n') }}

  - alias: "Steg 5A - Rydd bort meningsløse linjer før melding"
    variables:
      low_list_percent_clean: >-
        {% set out = namespace(lines=[]) %}
        {% for line in (low_list_percent | default('')).split('\n') %}
          {% set l = line | trim %}
          {% if l == '' %}
          {% elif not (l.startswith('- ')) %}
          {% else %}
            {% set name = (l
              | regex_replace('^-\\s*','')
              | regex_replace('\\s*\\([^)]*\\)\\s*$','')
              | trim) %}
            {% if name != '' and (name | lower) != 'battery' %}
              {% set out.lines = out.lines + [l] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ out.lines | join('\n') }}

      low_list_digital_clean: >-
        {% set out = namespace(lines=[]) %}
        {% for line in (low_list_digital_nodup | default('')).split('\n') %}
          {% set l = line | trim %}
          {% if l == '' %}
          {% elif not (l.startswith('- ')) %}
          {% else %}
            {% set name = (l
              | regex_replace('^-\\s*','')
              | regex_replace('\\s*\\([^)]*\\)\\s*$','')
              | trim) %}
            {% if name != '' and (name | lower) != 'battery' %}
              {% set out.lines = out.lines + [l] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ out.lines | join('\n') }}

  - alias: "Steg 5 - Bygg samlet melding (analog + digital)"
    variables:
      combined_message: >-
        {% set parts = namespace(lines=[]) %}

        {% if (low_list_percent_clean | trim) != '' %}
          {% set parts.lines = parts.lines + ["*Batteri % under " ~ (threshold | string) ~ "%:*", low_list_percent_clean, ""] %}
        {% endif %}

        {% if (low_list_digital_clean | trim) != '' %}
          {% set parts.lines = parts.lines + ["*Digital batteri lavt:*", low_list_digital_clean, ""] %}
        {% endif %}

        {{ (parts.lines | join('\n')) | trim }}

  - alias: "Steg 6 - Send samlet varsel"
    if:
      - condition: template
        value_template: "{{ combined_message | trim != '' }}"
    then:
      - action: script.varsel_pushover_send_melding_webhome
        data:
          title: "🟠 *Batteri lavt*"
          message: "{{ combined_message }}"
          destination: "{{ pushover_destination }}"
          priority: "{{ pushover_priority | int(0) }}"
          ttl: "{{ pushover_ttl | int(21600) }}"
