blueprint:
  name: Varsel - Printer - Blekk/Toner lavt (WebHome)
  description: >
    Auto-detekterer printer/skriversensorer og sender varsel ved:
      - Lav blekk/toner under terskel (%)
      - Sensor(er) er unknown/unavailable (valgfritt)

    Triggere:
      - Planlagt sjekk (default: onsdag 09:00)
      - Wake-up: Valgte entities går fra unavailable/unknown -> tilgjengelig,
        og vi venter X minutter før vi sjekker (stabil drift / oppdaterte nivåer).

    Blueprint versjon: 2026.07.00
  domain: automation
  source_url: https://github.com/surematu/WebHomeHelpFiles/blob/main/blueprints/automation/varsel_printer.yaml
  author: WebHome
  homeassistant:
    min_version: 2025.11.0

  input:
    pushover_destination:
      name: Pushover destination
      description: Mottakergruppe i script.varsel_pushover_send_melding_webhome
      default: pushover
      selector:
        text:

    pushover_priority:
      name: Pushover priority
      description: Prioritet brukt for varsling
      default: 0
      selector:
        number:
          min: -2
          max: 2
          step: 1
          mode: box

    pushover_ttl:
      name: Pushover TTL (sekunder)
      description: Levetid for varselet (f.eks. 86400 = 1 døgn)
      default: 604800
      selector:
        number:
          min: 0
          max: 604800
          step: 60
          mode: box

    ink_threshold_percent:
      name: Varsle når blekk/toner er under (%)
      default: 10
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

    check_time:
      name: Tid for planlagt sjekk
      default: "09:00:00"
      selector:
        time:

    check_weekdays:
      name: Ukedag(er) for planlagt sjekk
      default:
        - wed
      selector:
        select:
          multiple: true
          mode: list
          options:
            - { label: Mandag, value: mon }
            - { label: Tirsdag, value: tue }
            - { label: Onsdag, value: wed }
            - { label: Torsdag, value: thu }
            - { label: Fredag, value: fri }
            - { label: Lørdag, value: sat }
            - { label: Søndag, value: sun }

    printer_entity_keyword:
      name: Nøkkelord i entity_id (for auto-detektering)
      description: Default "printer" matcher f.eks. sensor.printer_*.
      default: "printer"
      selector:
        text:

    availability_trigger_entities:
      name: Wake-up entities
      description: >
        Velg entity(er) som trigges når de går fra unavailable/unknown -> tilgjengelig.
        (NB: state-trigger krever minst én entity.)
      selector:
        entity:
          multiple: true

    wakeup_stable_minutes:
      name: Ventetid etter online (minutter)
      description: >
        Når wake-up entity blir tilgjengelig: vent dette antallet minutter før blekk-sjekk.
        Med mode: restart vil blafring føre til at ventetiden starter på nytt.
      default: 360
      selector:
        number:
          min: 0
          max: 720
          step: 1
          unit_of_measurement: "min"

    include_debug_details:
      name: Legg til debug-detaljer i varselet
      default: false
      selector:
        boolean:

mode: restart

trigger:
  - platform: time
    at: !input check_time
    weekday: !input check_weekdays
    id: scheduled_check

  - platform: state
    entity_id: !input availability_trigger_entities
    from:
      - unavailable
      - unknown
    id: wakeup_available

condition: []

action:
  - alias: "Steg 1 - Sett grunnvariabler"
    variables:
      threshold: !input ink_threshold_percent
      kw: !input printer_entity_keyword
      stable_minutes: !input wakeup_stable_minutes
      include_na: false
      debug_on: !input include_debug_details
      pushover_destination: !input pushover_destination
      pushover_priority: !input pushover_priority
      pushover_ttl: !input pushover_ttl

  - alias: "Steg 2 - Wake-up: vent på stabil drift"
    if:
      - condition: template
        value_template: "{{ trigger.id == 'wakeup_available' and (stable_minutes | int(0)) > 0 }}"
    then:
      - alias: "Steg 2A - Delay X minutter"
        delay:
          minutes: !input wakeup_stable_minutes

      - alias: "Steg 2B - Hvis den ble utilgjengelig i ventetiden: stopp"
        if:
          - condition: template
            value_template: "{{ states(trigger.entity_id) in ['unavailable','unknown'] }}"
        then:
          - stop: "Wake-up entity ble utilgjengelig før ventetiden var ferdig."

  - alias: "Steg 3 - Kort ekstra ventetid (blekk % rekker å oppdatere)"
    delay:
      seconds: 5

  - alias: "Steg 4 - Finn blekk/toner-sensorer (rått)"
    variables:
      ink_entities_raw: >-
        {% set kw_l = kw | lower %}
        {% set ink_words = ['blekk','ink','toner','cartridge','kartusj','cyan','magenta','yellow','black','svart','gul','gult'] %}
        {% set ns = namespace(ids=[]) %}

        {% for s in states.sensor %}
          {% set eid = s.entity_id %}
          {% set eid_l = eid | lower %}
          {% if kw_l in eid_l %}
            {% set friendly = state_attr(eid,'friendly_name') or s.name or eid %}
            {% set name_l = friendly | lower %}
            {% set uom = state_attr(eid,'unit_of_measurement') or '' %}
            {% set st = states(eid) %}
            {% set is_num = st | is_number %}
            {% set val = (st | float(999)) if is_num else 999 %}

            {% set hit = namespace(v=false) %}
            {% for w in ink_words %}
              {% if w in eid_l or w in name_l %}
                {% set hit.v = true %}
              {% endif %}
            {% endfor %}

            {% set looks_percent = (uom in ['%','％']) or (is_num and 0 <= val <= 100) %}

            {% if hit.v and looks_percent and ('status' not in eid_l) %}
              {% set ns.ids = ns.ids + [eid] %}
            {% endif %}
          {% endif %}
        {% endfor %}

        {{ (ns.ids | unique | list | sort) | to_json }}

  - alias: "Steg 5 - Parse blekk/toner-liste (robust)"
    variables:
      ink_entities: >-
        {% if ink_entities_raw is string %}
          {{ ink_entities_raw | from_json(default=[]) }}
        {% else %}
          {{ ink_entities_raw }}
        {% endif %}

  - alias: "Steg 6 - Finn status-sensorer (rått)"
    variables:
      status_entities_raw: >-
        {% set kw_l = kw | lower %}
        {% set ns = namespace(ids=[]) %}
        {% for s in states.sensor %}
          {% set eid = s.entity_id %}
          {% set eid_l = eid | lower %}
          {% if kw_l in eid_l %}
            {% set friendly = state_attr(eid,'friendly_name') or s.name or eid %}
            {% set name_l = friendly | lower %}
            {% if 'status' in eid_l or 'status' in name_l %}
              {% set ns.ids = ns.ids + [eid] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ (ns.ids | unique | list | sort) | to_json }}

  - alias: "Steg 7 - Parse statusliste (robust)"
    variables:
      status_entities: >-
        {% if status_entities_raw is string %}
          {{ status_entities_raw | from_json(default=[]) }}
        {% else %}
          {{ status_entities_raw }}
        {% endif %}

  - alias: "Steg 8 - Bygg rapport (JSON, men uten Undefined-feller)"
    variables:
      report_raw: >-
        {% set threshold_f = threshold | float(0) %}
        {% set ns = namespace(printers={}, matched_ink=0, matched_status=0) %}

        {# 8A: Status per printer #}
        {% for eid in status_entities %}
          {% set did = device_id(eid) %}
          {% set obj = eid.split('.')[1] %}
          {% set parts = obj.split('_') %}
          {% set fallback_key = (parts[0:2] | join('_')) if (parts | count) >= 2 else obj %}
          {% set key = did if did else fallback_key %}

          {% set dn = device_name(eid) %}
          {% set fn = state_attr(eid,'friendly_name') or eid %}
          {% set printer_name = (dn if dn else fn) %}

          {% if key not in ns.printers %}
            {% set ns.printers = dict(ns.printers, **{key: {'name': printer_name, 'status': '', 'low': {}, 'na': {}}}) %}
          {% endif %}

          {% set p = ns.printers[key] %}
          {% set ns.printers = dict(ns.printers, **{key: dict(p, **{'status': (states(eid) | string)})}) %}
          {% set ns.matched_status = ns.matched_status + 1 %}
        {% endfor %}

        {# 8B: Blekk/Toner per printer #}
        {% for eid in ink_entities %}
          {% set ns.matched_ink = ns.matched_ink + 1 %}

          {% set did = device_id(eid) %}
          {% set obj = eid.split('.')[1] %}
          {% set parts = obj.split('_') %}
          {% set fallback_key = (parts[0:2] | join('_')) if (parts | count) >= 2 else obj %}
          {% set key = did if did else fallback_key %}

          {% set dn = device_name(eid) %}
          {% set fn = state_attr(eid,'friendly_name') or eid %}
          {% set printer_name = (dn if dn else fn) %}

          {% if key not in ns.printers %}
            {% set ns.printers = dict(ns.printers, **{key: {'name': printer_name, 'status': '', 'low': {}, 'na': {}}}) %}
          {% endif %}

          {% set p = ns.printers[key] %}

          {% set friendly = state_attr(eid,'friendly_name') or eid %}
          {% set name_l = (friendly | lower) %}
          {% set eid_l = (eid | lower) %}

          {% if 'svart' in name_l or 'black' in name_l or 'svart' in eid_l or 'black' in eid_l %}
            {% set color_norm = 'black' %}
            {% set color_label = 'Svart' %}
          {% elif 'magenta' in name_l or 'magenta' in eid_l %}
            {% set color_norm = 'magenta' %}
            {% set color_label = 'Magenta' %}
          {% elif 'cyan' in name_l or 'cyan' in eid_l %}
            {% set color_norm = 'cyan' %}
            {% set color_label = 'Cyan' %}
          {% elif 'gul' in name_l or 'gult' in name_l or 'yellow' in name_l or 'gul' in eid_l or 'yellow' in eid_l %}
            {% set color_norm = 'yellow' %}
            {% set color_label = 'Gul' %}
          {% else %}
            {% set color_norm = eid_l %}
            {% set color_label = (friendly
              | regex_replace('(?i)\b(printer|blekk|ink|toner|cartridge|kartusj|gjenvaerende|gjenstående|gjenstar|igjen|remaining|level|nivå|prosent|percent|status)\b',' ')
              | regex_replace('\s{2,}',' ')
              | trim) %}
            {% if color_label | trim == '' %}
              {% set color_label = 'Ukjent' %}
            {% endif %}
          {% endif %}

          {% set st = states(eid) %}
          {% if st | is_number %}
            {% set val = st | float(999) %}
            {% if 0 <= val < threshold_f %}
              {% set low_map = p.low %}
              {% set existing = (low_map[color_norm]['value'] if color_norm in low_map else 999) %}
              {% if val < existing %}
                {% set low_map2 = dict(low_map, **{color_norm: {'label': (color_label | string), 'value': val}}) %}
                {% set ns.printers = dict(ns.printers, **{key: dict(p, **{'low': low_map2})}) %}
              {% endif %}
            {% endif %}
          {% else %}
            {% set is_scheduled = (trigger.id | default('') == 'scheduled_check') %}
            {% if false and st in ['unavailable','unknown'] and not is_scheduled %}
              {% set na_map = p.na %}
              {% if color_norm not in na_map %}
                {% set na_map2 = dict(na_map, **{color_norm: (color_label | string)}) %}
                {% set ns.printers = dict(ns.printers, **{key: dict(p, **{'na': na_map2})}) %}
              {% endif %}
            {% endif %}
          {% endif %}
        {% endfor %}

        {# 8C: Render melding uten sort(attribute=...) #}
        {% set out = namespace(lines=[], problem_names=[]) %}

        {# sorter printere med tupler: (navn, key) #}
        {% set pt = namespace(items=[]) %}
        {% for k, p in ns.printers.items() %}
          {% set pt.items = pt.items + [((p['name'] | string), k)] %}
        {% endfor %}

        {% for pname, k in (pt.items | sort) %}
          {% set p = ns.printers[k] %}
          {% set low_map = p['low'] %}
          {% set na_map = p['na'] %}

          {% if (low_map | count) > 0 or (na_map | count) > 0 %}
            {% set out.problem_names = out.problem_names + [pname] %}
            {% set out.lines = out.lines + ['*' ~ pname ~ '*'] %}

            {% set sttxt = (p['status'] | default('', true) | string) %}
            {% if sttxt | trim != '' %}
              {% set out.lines = out.lines + ['Status: ' ~ sttxt] %}
            {% endif %}

            {# low: sorter via (value,label)-tupler #}
            {% set lt = namespace(items=[]) %}
            {% for _, item in low_map.items() %}
              {% set lt.items = lt.items + [((item['value'] | float(999)), (item['label'] | string))] %}
            {% endfor %}
            {% for v, lab in (lt.items | sort) %}
              {% set out.lines = out.lines + ['• ' ~ lab ~ ': ' ~ (v | round(0)) ~ '%'] %}
            {% endfor %}

            {# na: dictsort (alfabetisk) #}
            {% for _, lab in (na_map | dictsort) %}
              {% set out.lines = out.lines + ['• ' ~ (lab | string) ~ ': (n/a)'] %}
            {% endfor %}

            {% set out.lines = out.lines + [''] %}
          {% endif %}
        {% endfor %}

        {% set notify = (out.problem_names | count) > 0 %}
        {% set title_name = (out.problem_names[0] if (out.problem_names | count) == 1 else 'Printer') %}
        {% set title = "🟠 *" ~ (title_name | string) ~ " – Blekk/Toner (< " ~ (threshold_f | round(0)) ~ "%)*" %}

        {# Count total low and na entries for offline detection #}
        {% set total_low = namespace(count=0) %}
        {% set total_na = namespace(count=0) %}
        {% for k, p in ns.printers.items() %}
          {% set total_low.count = total_low.count + (p['low'] | count) %}
          {% set total_na.count = total_na.count + (p['na'] | count) %}
        {% endfor %}

        {{ {
          "notify": notify,
          "title": title,
          "message": (out.lines | join('\n')) | trim,
          "total_low_count": total_low.count,
          "total_na_count": total_na.count,
          "total_ink_count": ns.matched_ink,
          "debug": {
            "trigger_id": (trigger.id | default('', true) | string),
            "trigger_entity": ((trigger.entity_id | default('', true)) | string),
            "matched_ink": ns.matched_ink,
            "matched_status": ns.matched_status,
            "ink_count": (ink_entities | count),
            "status_count": (status_entities | count)
          }
        } | to_json }}

  - alias: "Steg 9 - Parse rapport (robust)"
    variables:
      report: >-
        {% if report_raw is string %}
          {{ report_raw | from_json(default={}) }}
        {% else %}
          {{ report_raw }}
        {% endif %}

  - alias: "Steg 10 - Sjekk om vi skal varsle"
    condition: template
    value_template: "{{ report.notify | default(false) }}"

  - alias: "Steg 11 - Bygg endelig meldingstekst"
    variables:
      final_message: >-
        {% set base = report.message | default('') %}
        {% if debug_on %}
          {% set d = report.debug %}
          {% set debug_text = "\n\n---\nDebug:\n- trigger: " ~ (d.trigger_id | default('')) ~ "\n- trigger_entity: " ~ (d.trigger_entity | default('')) ~ "\n- matched_ink: " ~ (d.matched_ink | default(0)) %}
          {{ base ~ debug_text }}
        {% else %}
          {{ base }}
        {% endif %}

  - alias: "Steg 12 - Send varsel"
    action: script.varsel_pushover_send_melding_webhome
    data:
      title: "{{ report.title | default('🟠 *Printer – Blekk* 🟠') }}"
      message: "{{ final_message }}"
      destination: "{{ pushover_destination }}"
      priority: "{{ pushover_priority | int(0) }}"
      ttl: "{{ pushover_ttl | int(604800) }}"
