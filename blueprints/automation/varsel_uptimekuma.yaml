blueprint:
  name: Varsel - UptimeKuma Rapport (WebHome Automation)
  description: >
    Overvåker Uptime Kuma-enheter automatisk (ingen manuell entity-velging nødvendig)
    ved å oppdage devices som har en entity hvis friendly_name slutter på "Uptime (30 days)".

    Logikk:
      - Kjøres hver time (timepattern).
      - Kan også kjøres etter valgt ukedag/tid (planlagt sjekk).
      - Finner alle aktuelle devices via "Uptime (30 days)"-entity.
      - For hvert device:
        * Finn "Status"-sensor.
        * Hvis status != "Up", regnes den som ned.
      - Varsel sendes kun når:
        * Minst én enhet har gått ned i løpet av siste time (ny hendelse), ELLER
        * Automatiseringen kjøres manuelt eller via planlagt sjekk.
      - Når varsel først sendes:
        * Ta med ALLE enheter som nå er nede.
        * Inkluder oppetid for Dag/Måned/År i rapportlinjen.
      - Ved manuell kjøring eller planlagt sjekk:
        * Rapporter alle nede-enheter uansett når de gikk ned.

    Kritiske sensorer (øyeblikkelig varsel):
      - Velg status-sensorer som skal utløse varselet øyeblikkelig når de går ned.
      - Tittelen vil vise enhetsnavnet som utløste varselet.
      - Beskrivelsen inkluderer alle nede-enheter som normalt.

    Timepattern-triggeren kjøres hvert time og sjekker kun enheter som gikk ned
    i siste time. Planlagt sjekk og manuell kjøring viser ALLE nede-enheter.

    Oppetid vises som "(dag%/måned%/år%)" uten desimaler, basert på sensorene
    "Uptime (1 day)", "Uptime (30 days)" og "Uptime (365 days)".

    Blueprint versjon: 2026.07.08
  domain: automation
  author: WebHome
  source_url: https://github.com/surematu/WebHomeHelpFiles/blob/main/blueprints/automation/varsel_uptimekuma.yaml
  homeassistant:
    min_version: 2026.7.0

  input:
    check_time:
      name: Tid for planlagt sjekk
      default: "09:00:00"
      selector:
        time:

    check_weekdays:
      name: Ukedag(er) for planlagt sjekk
      default:
        - mon
        - wed
        - fri
      selector:
        select:
          multiple: true
          mode: list
          options:
            - { label: Mandag, value: mon }
            - { label: Tirsdag, value: tue }
            - { label: Onsdag, value: wed }
            - { label: Torsdag, value: thu }
            - { label: Fredag, value: fri }
            - { label: Lørdag, value: sat }
            - { label: Søndag, value: sun }

    pushover_destination:
      name: Pushover destination
      description: Mottakergruppe i script.varsel_pushover_send_melding_webhome
      default: pushover
      selector:
        text:

    pushover_priority:
      name: Pushover priority
      description: Prioritet sendt til scriptet (typisk -2 til 2)
      default: 1
      selector:
        number:
          min: -2
          max: 2
          step: 1
          mode: box

    pushover_ttl:
      name: Pushover TTL (sekunder)
      description: Levetid for varselet (f.eks. 86400 = 1 døgn)
      default: 86400
      selector:
        number:
          min: 0
          max: 86400
          step: 60
          mode: box

    urgent_sensors:
      name: Kritiske sensorer (øyeblikkelig varsel)
      description: >
        Velg status-sensorer fra Uptime Kuma som skal utløse varselet øyeblikkelig
        når de går ned (fra "Up" til annen status). Tittelen vil vise enhetsnavnet
        som utløste varselet. Beskrivelsen inkluderer alle nede-enheter som normalt.
        La feltet stå tomt for å ikke bruke denne funksjonen.
      default: []
      selector:
        entity:
          multiple: true
          domain: sensor

    include_debug_details:
      name: Legg til debug-detaljer i varselet
      default: false
      selector:
        boolean:

mode: restart

trigger:
  - platform: time_pattern
    hours: "/1"
    id: hourly_check

  - platform: time
    at: !input check_time
    weekday: !input check_weekdays
    id: scheduled_check

  - platform: state
    entity_id: !input urgent_sensors
    from: "Up"
    to:
      - "Down"
      - "Pending"
      - "Maintenance"
    id: urgent_sensor_trigger

condition: []

action:
  - alias: "Steg 1 - Sett grunnvariabler"
    variables:
      debug_on: !input include_debug_details
      pushover_destination: !input pushover_destination
      pushover_priority: !input pushover_priority
      pushover_ttl: !input pushover_ttl

      interval_seconds: 3600

      manual_run: "{{ trigger is not defined or trigger.id is not defined or trigger.id == 'scheduled_check' }}"
      show_all_down: "{{ trigger is not defined or trigger.id is not defined or trigger.id == 'scheduled_check' or trigger.id == 'urgent_sensor_trigger' }}"
      urgent_trigger_device_name: >-
        {%- if trigger is defined and trigger.id is defined and trigger.id == 'urgent_sensor_trigger' -%}
          {%- set did = device_id(trigger.entity_id) -%}
          {{ device_attr(did, 'name') | default(trigger.entity_id, true) }}
        {%- else -%}
          {{ '' }}
        {%- endif -%}

  - alias: "Steg 2 - Finn Uptime Kuma devices"
    variables:
      devices: |-
        {%- set interval_s = interval_seconds | int(3600) -%}
        {%- set now_ts = as_timestamp(now()) | int(0) -%}
        {%- set ns = namespace(
              seen_devices=[],
              all_devices=[],
              debug=[]
            ) -%}

        {# Finn kandidater: entities der friendly_name slutter på "Uptime (30 days)" #}
        {%- for s in states.sensor -%}
          {%- set fname = state_attr(s.entity_id, 'friendly_name') | default(s.name, true) -%}
          {%- if fname.endswith('Uptime (30 days)') -%}
            {%- set did = device_id(s.entity_id) -%}
            {%- if did and did not in ns.seen_devices -%}
              {%- set ns.seen_devices = ns.seen_devices + [did] -%}

              {%- set dev_name = device_attr(did, 'name') | default('Ukjent enhet', true) -%}
              {%- set dev_model = device_attr(did, 'model') | default('', true) -%}
              {%- set dev_manufacturer = device_attr(did, 'manufacturer') | default('', true) -%}
              {%- set ents = device_entities(did) if did else [] -%}

              {%- set found = namespace(status_eid='', uptime1_eid='', uptime30_eid='', uptime365_eid='') -%}

              {# Finn Status + Uptime-entiteter på device #}
              {%- for e in ents -%}
                {%- set st_obj = states[e] -%}
                {%- if st_obj is not none -%}
                  {%- set fn = state_attr(e, 'friendly_name') | default(st_obj.name, true) -%}
                  {%- if fn.endswith(' Status') and found.status_eid == '' -%}
                    {%- set found.status_eid = e -%}
                  {%- endif -%}
                  {%- if fn.endswith('Uptime (1 day)') and found.uptime1_eid == '' -%}
                    {%- set found.uptime1_eid = e -%}
                  {%- endif -%}
                  {%- if fn.endswith('Uptime (30 days)') and found.uptime30_eid == '' -%}
                    {%- set found.uptime30_eid = e -%}
                  {%- endif -%}
                  {%- if fn.endswith('Uptime (365 days)') and found.uptime365_eid == '' -%}
                    {%- set found.uptime365_eid = e -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}

              {%- if found.status_eid != '' -%}
                {%- set status_state = states(found.status_eid) | string -%}
                {%- set is_up = (status_state | lower) == 'up' -%}
                {%- set uptime30 = states(found.uptime30_eid) if found.uptime30_eid != '' else 'ukjent' -%}
                {%- set status_obj = states[found.status_eid] -%}
                {%- set lc_ts = as_timestamp(status_obj.last_changed, default=0) | int(0) -%}
                {%- set age_s = (now_ts - lc_ts) | int(0) -%}
                {%- set is_new = (not is_up) and (age_s >= 0) and (age_s < interval_s) -%}

                {%- set dev_info = {
                  'device_id': did,
                  'device_name': dev_name,
                  'model': dev_model,
                  'manufacturer': dev_manufacturer,
                  'status_eid': found.status_eid,
                  'uptime1_eid': found.uptime1_eid,
                  'uptime30_eid': found.uptime30_eid,
                  'uptime365_eid': found.uptime365_eid,
                  'status': status_state,
                  'uptime1': states(found.uptime1_eid) if found.uptime1_eid != '' else 'ukjent',
                  'uptime30': uptime30,
                  'uptime365': states(found.uptime365_eid) if found.uptime365_eid != '' else 'ukjent',
                  'is_up': is_up,
                  'last_changed_ts': lc_ts,
                  'age_s': age_s,
                  'is_new': is_new
                } -%}
                {%- set ns.all_devices = ns.all_devices + [dev_info] -%}
              {%- else -%}
                {%- set ns.debug = ns.debug + ['Mangler Status på device: ' ~ dev_name] -%}
                {%- set uptime30_val = states(found.uptime30_eid) if found.uptime30_eid != '' else 'ukjent' -%}
                {%- set dev_info = {
                  'device_id': did,
                  'device_name': dev_name,
                  'model': dev_model,
                  'manufacturer': dev_manufacturer,
                  'status_eid': '',
                  'uptime1_eid': found.uptime1_eid,
                  'uptime30_eid': found.uptime30_eid,
                  'uptime365_eid': found.uptime365_eid,
                  'status': 'ukjent',
                  'uptime1': states(found.uptime1_eid) if found.uptime1_eid != '' else 'ukjent',
                  'uptime30': uptime30_val,
                  'uptime365': states(found.uptime365_eid) if found.uptime365_eid != '' else 'ukjent',
                  'is_up': false,
                  'last_changed_ts': 0,
                  'age_s': 0,
                  'is_new': false
                } -%}
                {%- set ns.all_devices = ns.all_devices + [dev_info] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}

        {%- set sorted_devices = ns.all_devices | sort(attribute='device_name') -%}

        {{
          {
            'all_devices': sorted_devices,
            'total_count': sorted_devices | count,
            'debug': ns.debug
          } | tojson
        }}

  - alias: "Steg 3 - Bygg nedeliste"
    variables:
      report_payload: |-
        {%- set d = devices if devices is mapping else devices | from_json -%}
        {%- set ns = namespace(down_all=[], down_new=[]) -%}

        {%- for dev in d.all_devices -%}
          {%- if not dev.is_up -%}
            {%- set ns.down_all = ns.down_all + [dev] -%}
            {%- if dev.is_new -%}
              {%- set ns.down_new = ns.down_new + [dev] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}

        {%- set sorted_down = ns.down_all | sort(attribute='device_name') -%}

        {{
          {
            'devices_found': d.total_count,
            'down_count': ns.down_all | count,
            'new_down_count': ns.down_new | count,
            'should_notify': (show_all_down or ((ns.down_new | count) > 0)) and ((ns.down_all | count) > 0),
            'down_all': sorted_down,
            'debug': d.debug
          } | tojson
        }}

  - alias: "Steg 4 - Bygg melding"
    variables:
      notification_title: >-
        {% set p = report_payload if report_payload is mapping else report_payload | from_json %}
        {% set urgent_dev = urgent_trigger_device_name | trim %}
        {% if p.should_notify %}
          {% if urgent_dev != '' %}
            🔴 {{ urgent_dev }} er offline
          {% elif p.down_count == 1 %}
            🔴 {{ p.down_all[0].device_name }} er offline
          {% else %}
            🔴 {{ p.down_count }} enheter offline
          {% endif %}
        {% else %}
          UptimeKuma
        {% endif %}
      combined_message: >-
        {% set p = report_payload if report_payload is mapping else report_payload | from_json %}
        {% set dev_list = devices if devices is mapping else devices | from_json %}
        {% set ns = namespace(names=[], detail_lines=[], out=[]) %}

        {% if p.should_notify %}
          {% for it in p.down_all %}
            {% set age_s = it.age_s | int(0) %}
            {% set d = (age_s // 86400) | int(0) %}
            {% set h = ((age_s % 86400) // 3600) | int(0) %}
            {% set m = ((age_s % 3600) // 60) | int(0) %}
            {% if d > 0 %}
              {% set age_txt = d|string ~ "d " ~ h|string ~ "h" %}
            {% elif h > 0 %}
              {% set age_txt = h|string ~ "h " ~ m|string ~ "m" %}
            {% elif m > 0 %}
              {% set age_txt = m|string ~ "m" %}
            {% else %}
              {% set age_txt = (age_s % 60)|string ~ "s" %}
            {% endif %}
            {% set u1 = (it.uptime1 | float(0)) | int %}
            {% set u30 = (it.uptime30 | float(0)) | int %}
            {% set u365 = (it.uptime365 | float(0)) | int %}
            {% set ns.names = ns.names + [it.device_name] %}
            {% set prefix = "- " if p.down_count > 1 else "" %}
            {% set ns.detail_lines = ns.detail_lines + [prefix ~ it.device_name ~ ", nede i " ~ age_txt ~ " (oppetid " ~ u1|string ~ "%/" ~ u30|string ~ "%/" ~ u365|string ~ "%)"] %}
          {% endfor %}

          {% if p.down_count > 1 %}
            {% set ns.out = ns.out + [ns.names | join(', ') ~ " er offline.", ""] %}
          {% endif %}
          {% set ns.out = ns.out + ns.detail_lines %}
          {% set ns.out = ns.out + ["", "Oppetid er presentert for; Dag/Måned/År."] %}
        {% endif %}

        {% if debug_on %}
          {% set ns.out = ns.out + [
            "",
            "---",
            "Debug:",
            "- trigger: " ~ (trigger.id if trigger is defined and trigger.id is defined else 'manual/unknown'),
            "- manual_run: " ~ (manual_run | string),
            "- show_all_down: " ~ (show_all_down | string),
            "- urgent_trigger_device: " ~ (urgent_trigger_device_name | trim if urgent_trigger_device_name | trim != '' else 'n/a'),
            "- interval_seconds: 3600",
            "- devices_found: " ~ ((p.devices_found | int(0)) | string),
            "- down_count: " ~ ((p.down_count | int(0)) | string),
            "- new_down_count: " ~ ((p.new_down_count | int(0)) | string),
            "- should_notify: " ~ ((p.should_notify) | string),
            "",
            "Alle devices (" ~ (dev_list.total_count | string) ~ "):"
          ] %}
          {% for dev in dev_list.all_devices %}
            {% set age_s = dev.age_s | int(0) %}
            {% set dv = (age_s // 86400) | int(0) %}
            {% set hv = ((age_s % 86400) // 3600) | int(0) %}
            {% set mv = ((age_s % 3600) // 60) | int(0) %}
            {% if dv > 0 %}
              {% set age_txt = dv|string ~ "d " ~ hv|string ~ "h" %}
            {% elif hv > 0 %}
              {% set age_txt = hv|string ~ "h " ~ mv|string ~ "m" %}
            {% elif mv > 0 %}
              {% set age_txt = mv|string ~ "m" %}
            {% else %}
              {% set age_txt = (age_s % 60)|string ~ "s" %}
            {% endif %}
            {% if dev.is_up %}
              {% set ns.out = ns.out + [
                "  " ~ dev.device_name ~ ": Up | oppetid: " ~ (dev.uptime1|float(0)|int)|string ~ "%/" ~ (dev.uptime30|float(0)|int)|string ~ "%/" ~ (dev.uptime365|float(0)|int)|string ~ "%"
              ] %}
            {% else %}
              {% set ns.out = ns.out + [
                "  " ~ dev.device_name ~ ": " ~ dev.status ~ " | oppetid: " ~ (dev.uptime1|float(0)|int)|string ~ "%/" ~ (dev.uptime30|float(0)|int)|string ~ "%/" ~ (dev.uptime365|float(0)|int)|string ~ "%" ~ " | nede i: " ~ age_txt ~ (" [NY]" if dev.is_new else "")
              ] %}
            {% endif %}
          {% endfor %}
          {% for dline in p.debug %}
            {% set ns.out = ns.out + ["- note: " ~ dline] %}
          {% endfor %}
        {% endif %}

        {{ (ns.out | join('\n')) | trim }}

  - alias: "Steg 5 - Send varsel"
    if:
      - condition: template
        value_template: "{{ combined_message | trim != '' }}"
    then:
      - action: script.varsel_pushover_send_melding_webhome
        metadata: {}
        data:
          title: "{{ notification_title | trim }}"
          message: "{{ combined_message }}"
          destination: "{{ pushover_destination }}"
          priority: "{{ pushover_priority | int(0) }}"
          ttl: "{{ pushover_ttl | int(21600) }}"
