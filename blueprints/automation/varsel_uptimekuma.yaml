blueprint:
  name: Varsel - UptimeKuma Rapport (WebHome Automation)
  description: >
    Overvåker Uptime Kuma-enheter automatisk (ingen manuell entity-velging nødvendig)
    ved å oppdage devices som har en entity hvis friendly_name slutter på "Uptime (30 days)".

    Logikk:
      - Kjøres hver time.
      - Finner alle aktuelle devices via "Uptime (30 days)"-entity.
      - For hvert device:
        * Finn "Status"-sensor.
        * Hvis status != "Up", regnes den som ned.
      - Varsel sendes kun når:
        * Minst én enhet har gått ned i løpet av siste time (ny hendelse), ELLER
        * Automatiseringen kjøres manuelt.
      - Når varsel først sendes:
        * Ta med ALLE enheter som nå er nede.
        * Inkluder "Uptime (30 days)" i rapportlinjen.
      - Ved manuell kjøring:
        * Rapporter alle nede-enheter uansett når de gikk ned.

    "Ny i siste time" beregnes ved å bruke tidspunkt for siste state-endring på Status-entity
    (last_changed), og sjekke om den er innenfor valgt intervall (standard 1 time).

    Blueprint versjon: 2026.07.04
  domain: automation
  author: WebHome
  source_url: https://github.com/surematu/WebHomeHelpFiles/blob/main/blueprints/automation/varsel_uptimekuma.yaml
  homeassistant:
    min_version: 2026.7.0

  input:
    check_interval:
      name: Sjekkfrekvens (for "ny i vindu")
      description: >
        Hvor stort vindu som regnes som "ny nedetid".
        Standard: 1 time.
      default:
        hours: 1
      selector:
        duration:

    pushover_destination:
      name: Pushover destination
      description: Mottakergruppe i script.varsel_pushover_send_melding_webhome
      default: pushover
      selector:
        text:

    pushover_priority:
      name: Pushover priority
      description: Prioritet sendt til scriptet (typisk -2 til 2)
      default: 1
      selector:
        number:
          min: -2
          max: 2
          step: 1
          mode: box

    pushover_ttl:
      name: Pushover TTL (sekunder)
      description: Levetid for varselet (f.eks. 86400 = 1 døgn)
      default: 86400
      selector:
        number:
          min: 0
          max: 86400
          step: 60
          mode: box

    include_debug_details:
      name: Legg til debug-detaljer i varselet
      default: false
      selector:
        boolean:

mode: restart

trigger:
  - platform: time_pattern
    hours: "/1"
    id: hourly_check

condition: []

action:
  - alias: "Steg 1 - Sett grunnvariabler"
    variables:
      check_interval: !input check_interval
      debug_on: !input include_debug_details
      pushover_destination: !input pushover_destination
      pushover_priority: !input pushover_priority
      pushover_ttl: !input pushover_ttl

      interval_seconds: >-
        {% set d = check_interval %}
        {{ (d.get('days',0)|int * 86400)
         + (d.get('hours',0)|int * 3600)
         + (d.get('minutes',0)|int * 60)
         + (d.get('seconds',0)|int) }}

      interval_label: >-
        {% set d = check_interval %}
        {% set days = d.get('days',0)|int %}
        {% set hours = d.get('hours',0)|int %}
        {% set mins = d.get('minutes',0)|int %}
        {% set secs = d.get('seconds',0)|int %}
        {% set parts = namespace(p=[]) %}
        {% if days > 0 %}{% set parts.p = parts.p + [days|string ~ 'd'] %}{% endif %}
        {% if hours > 0 %}{% set parts.p = parts.p + [hours|string ~ 'h'] %}{% endif %}
        {% if mins > 0 %}{% set parts.p = parts.p + [mins|string ~ 'm'] %}{% endif %}
        {% if secs > 0 and (days==0 and hours==0) %}{% set parts.p = parts.p + [secs|string ~ 's'] %}{% endif %}
        {{ parts.p | join(' ') if parts.p | count > 0 else '0s' }}

      manual_run: "{{ trigger is not defined or trigger.id is not defined }}"

  - alias: "Steg 2 - Finn Uptime Kuma devices"
    variables:
      devices: |-
        {%- set interval_s = interval_seconds | int(3600) -%}
        {%- set now_ts = as_timestamp(now()) | int(0) -%}
        {%- set ns = namespace(
              seen_devices=[],
              all_devices=[],
              debug=[]
            ) -%}

        {# Finn kandidater: entities der friendly_name slutter på "Uptime (30 days)" #}
        {%- for s in states.sensor -%}
          {%- set fname = state_attr(s.entity_id, 'friendly_name') | default(s.name, true) -%}
          {%- if fname.endswith('Uptime (30 days)') -%}
            {%- set did = device_id(s.entity_id) -%}
            {%- if did and did not in ns.seen_devices -%}
              {%- set ns.seen_devices = ns.seen_devices + [did] -%}

              {%- set dev_name = device_attr(did, 'name') | default('Ukjent enhet', true) -%}
              {%- set dev_model = device_attr(did, 'model') | default('', true) -%}
              {%- set dev_manufacturer = device_attr(did, 'manufacturer') | default('', true) -%}
              {%- set ents = device_entities(did) if did else [] -%}

              {%- set found = namespace(status_eid='', uptime30_eid='') -%}

              {# Finn Status + Uptime (30 days) på device #}
              {%- for e in ents -%}
                {%- set st_obj = states[e] -%}
                {%- if st_obj is not none -%}
                  {%- set fn = state_attr(e, 'friendly_name') | default(st_obj.name, true) -%}
                  {%- if fn.endswith(' Status') and found.status_eid == '' -%}
                    {%- set found.status_eid = e -%}
                  {%- endif -%}
                  {%- if fn.endswith('Uptime (30 days)') and found.uptime30_eid == '' -%}
                    {%- set found.uptime30_eid = e -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}

              {%- if found.status_eid != '' -%}
                {%- set status_state = states(found.status_eid) | string -%}
                {%- set is_up = (status_state | lower) == 'up' -%}
                {%- set uptime30 = states(found.uptime30_eid) if found.uptime30_eid != '' else 'ukjent' -%}
                {%- set status_obj = states[found.status_eid] -%}
                {%- set lc_ts = as_timestamp(status_obj.last_changed, default=0) | int(0) -%}
                {%- set age_s = (now_ts - lc_ts) | int(0) -%}
                {%- set is_new = (not is_up) and (age_s >= 0) and (age_s < interval_s) -%}

                {%- set dev_info = {
                  'device_id': did,
                  'device_name': dev_name,
                  'model': dev_model,
                  'manufacturer': dev_manufacturer,
                  'status_eid': found.status_eid,
                  'uptime30_eid': found.uptime30_eid,
                  'status': status_state,
                  'uptime30': uptime30,
                  'is_up': is_up,
                  'last_changed_ts': lc_ts,
                  'age_s': age_s,
                  'is_new': is_new
                } -%}
                {%- set ns.all_devices = ns.all_devices + [dev_info] -%}
              {%- else -%}
                {%- set ns.debug = ns.debug + ['Mangler Status på device: ' ~ dev_name] -%}
                {%- set uptime30_val = states(found.uptime30_eid) if found.uptime30_eid != '' else 'ukjent' -%}
                {%- set dev_info = {
                  'device_id': did,
                  'device_name': dev_name,
                  'model': dev_model,
                  'manufacturer': dev_manufacturer,
                  'status_eid': '',
                  'uptime30_eid': found.uptime30_eid,
                  'status': 'ukjent',
                  'uptime30': uptime30_val,
                  'is_up': false,
                  'last_changed_ts': 0,
                  'age_s': 0,
                  'is_new': false
                } -%}
                {%- set ns.all_devices = ns.all_devices + [dev_info] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}

        {%- set sorted_devices = ns.all_devices | sort(attribute='device_name') -%}

        {{
          {
            'all_devices': sorted_devices,
            'total_count': sorted_devices | count,
            'debug': ns.debug
          } | tojson
        }}

  - alias: "Steg 3 - Bygg nedeliste"
    variables:
      report_payload: |-
        {%- set d = devices if devices is mapping else devices | from_json -%}
        {%- set ns = namespace(down_all=[], down_new=[]) -%}

        {%- for dev in d.all_devices -%}
          {%- if not dev.is_up -%}
            {%- set ns.down_all = ns.down_all + [dev] -%}
            {%- if dev.is_new -%}
              {%- set ns.down_new = ns.down_new + [dev] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}

        {%- set sorted_down = ns.down_all | sort(attribute='device_name') -%}

        {{
          {
            'devices_found': d.total_count,
            'down_count': ns.down_all | count,
            'new_down_count': ns.down_new | count,
            'should_notify': (manual_run or ((ns.down_new | count) > 0)) and ((ns.down_all | count) > 0),
            'down_all': sorted_down,
            'debug': d.debug
          } | tojson
        }}

  - alias: "Steg 4 - Bygg melding"
    variables:
      combined_message: >-
        {% set p = report_payload if report_payload is mapping else report_payload | from_json %}
        {% set dev_list = devices if devices is mapping else devices | from_json %}
        {% set lines = namespace(v=[]) %}

        {% if p.should_notify %}
          {% if manual_run %}
            {% set lines.v = lines.v + [
              "*UptimeKuma: Manuell rapport (alle som er nede nå)*",
              ""
            ] %}
          {% else %}
            {% set lines.v = lines.v + [
              "*UptimeKuma: Nye nedetider siste " ~ (interval_label | string) ~ " (viser alle som er nede nå)*",
              ""
            ] %}
          {% endif %}

          {% for it in p.down_all %}
            {% set age_s = it.age_s | int(0) %}
            {% set d = (age_s // 86400) | int(0) %}
            {% set h = ((age_s % 86400) // 3600) | int(0) %}
            {% set m = ((age_s % 3600) // 60) | int(0) %}

            {% if d > 0 %}
              {% set age_txt = d|string ~ "d " ~ h|string ~ "h" %}
            {% elif h > 0 %}
              {% set age_txt = h|string ~ "h " ~ m|string ~ "m" %}
            {% elif m > 0 %}
              {% set age_txt = m|string ~ "m" %}
            {% else %}
              {% set age_txt = (age_s % 60)|string ~ "s" %}
            {% endif %}

            {% set lines.v = lines.v + [
              "- " ~ it.device_name ~ " (Status: " ~ it.status ~ ", Uptime 30d: " ~ it.uptime30 ~ ", nede i: " ~ age_txt ~ ")"
            ] %}
          {% endfor %}
        {% endif %}

        {% if debug_on %}
          {% set lines.v = lines.v + [
            "",
            "---",
            "Debug:",
            "- trigger: " ~ (trigger.id if trigger is defined and trigger.id is defined else 'manual/unknown'),
            "- manual_run: " ~ (manual_run | string),
            "- interval: " ~ (interval_label | string),
            "- interval_seconds: " ~ (interval_seconds | string),
            "- devices_found: " ~ ((p.devices_found | int(0)) | string),
            "- down_count: " ~ ((p.down_count | int(0)) | string),
            "- new_down_count: " ~ ((p.new_down_count | int(0)) | string),
            "- should_notify: " ~ ((p.should_notify) | string),
            "",
            "Alle devices (" ~ (dev_list.total_count | string) ~ "):"
          ] %}
          {% for dev in dev_list.all_devices %}
            {% set age_s = dev.age_s | int(0) %}
            {% set dv = (age_s // 86400) | int(0) %}
            {% set hv = ((age_s % 86400) // 3600) | int(0) %}
            {% set mv = ((age_s % 3600) // 60) | int(0) %}
            {% if dv > 0 %}
              {% set age_txt = dv|string ~ "d " ~ hv|string ~ "h" %}
            {% elif hv > 0 %}
              {% set age_txt = hv|string ~ "h " ~ mv|string ~ "m" %}
            {% elif mv > 0 %}
              {% set age_txt = mv|string ~ "m" %}
            {% else %}
              {% set age_txt = (age_s % 60)|string ~ "s" %}
            {% endif %}
            {% if dev.is_up %}
              {% set lines.v = lines.v + [
                "  " ~ dev.device_name ~ ": Up | uptime30: " ~ dev.uptime30
              ] %}
            {% else %}
              {% set lines.v = lines.v + [
                "  " ~ dev.device_name ~ ": " ~ dev.status ~ " | uptime30: " ~ dev.uptime30 ~ " | nede i: " ~ age_txt ~ (" [NY]" if dev.is_new else "")
              ] %}
            {% endif %}
          {% endfor %}
          {% for dline in p.debug %}
            {% set lines.v = lines.v + ["- note: " ~ dline] %}
          {% endfor %}
        {% endif %}

        {{ (lines.v | join('\n')) | trim }}

  - alias: "Steg 5 - Send varsel"
    if:
      - condition: template
        value_template: "{{ combined_message | trim != '' }}"
    then:
      - action: script.varsel_pushover_send_melding_webhome
        metadata: {}
        data:
          title: "🔴 Enhet er gått offline"
          message: "{{ combined_message }}"
          destination: "{{ pushover_destination }}"
          priority: "{{ pushover_priority | int(0) }}"
          ttl: "{{ pushover_ttl | int(21600) }}"
