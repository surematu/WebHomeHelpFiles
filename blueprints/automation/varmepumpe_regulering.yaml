blueprint:
  name: Varmepumpe (Rom) Robot (WebHome Automation)
  description: >
    Regulerer varmepumpe-settpunkt lineært mellom:
      - Offset ved 0% pådrag (grader_under_min)
      - Offset ved 100% pådrag (grader_over_maks)
    Basissettpunkt = max(iclimate_varme_rt_spk, comfort_temp hvis finnes).
    Pådrag-signal (0-100%):
    - Bruker power_percent fra overordnet climate.
    - Hvis power_percent mangler brukes 50% som standard.

    Vifte-logikk styres av boolean-input: false = ingen vifteregulering, true = vifte boost.
    Vifte boost brukes for å hjelpe varmepumpa med å flytte mer luft når varmebehovet er høyt
    eller når overordnet climate står i frost, f.eks. medium ved lavt behov og high ved høyt behov.

    Valgfri sekundær varmepumpe-entitet kan synkes 30 sekunder etter primær varmepumpe.
    Primær entitet prioriteres alltid først, mens sekundær kan brukes som reserve eller for
    funksjoner som kun støttes der.

    Settpunkt-skriving:

    Ved varme (heat):
      Pådrag 0–panelovn_padrag_grense% (default 60%) styrer varmepumpe normalisert 0–100%.
      Pådrag panelovn_padrag_grense–100% kan aktivere i tillegg varme-climate (panelovn)
      med proporsjonal temperatur-styring (ingen binær av/på):
        - Panelovn-settpunkt skaleres lineært fra frost-setpunkt (romtemp ≥ settpunkt)
          til rom-settpunkt (romtemp ≥ panelovn_delta_maks °C under settpunkt, default 2°C).
        - Lineær interpolasjon – panelovnen øker gradvis uten plutselig av/på-sykler.
        - Panelovnen holdes igjen til varmepumpas faktiske settpunkt har nådd minst 80 %
          av varmepumpas egen varmekurve, slik at varmepumpa får prøve først.
      Formål: prioritere varmepumpa; panelovn brukes som proporsjonal supplement.

    Ved kjøling (cool):
      Pådrag 0–100% gir invertert settpunkt-kurve til varmepumpa:
        - 0% pådrag → høy setpunkt (lite kjøling)
        - 100% pådrag → lav setpunkt (maks kjøling)
      Variablene grader_under_min og grader_over_maks gjenbrukes, men med invertert fortegn.

    Kjøling (valgfri):
    Aktiver kjøling for å la varmepumpa automatisk bytte mellom heat og cool.
      - Ved gyldig driftsmodus styrer VINTER/SOMMER default-modus.
      - Override aktiveres kun ved for kaldt/for varmt avvik fra settpunkt.
      - Hysterese brukes for å skru override AV igjen, for å unngå modus-flapping.
      - Ugyldig driftsmodus: varmepumpa holdes i heat-modus.
      - Kjøling sperres alltid når iclimate_varme_rt_spk < iclimate_varme_rt_sp_comfort_spkifnocomfort (f.eks. eco/natt-senking),
        og varmepumpa tvinges da til heat uansett romtemperatur.
      - Overordnet climate oppdateres automatisk til heat/cool basert på beregnet modus.
      - Automasjonen trigges ved endring av driftsmodus (VINTER/SOMMER).

    Varme-climate (valgfri):
    Frost-settpunkt leses automatisk fra overordnet climate (preset_temperatures.frost_temp).
    Skriving til varme-climate klampes alltid til klimaets min_temp og max_temp.

    Avrunding av settpunkt:
    Betinget på inum_max_step: heltall-steg (1, 2, 3, …) gir alltid heltalls-settpunkt;
    halvt steg (0.5, 1.5, 2.5, …) tillater halvgrads-verdier (f.eks. 22.5).

    Varsling (Valgfri):
    Valgfri Pushover-notifikasjon ved endringer. Av som standard (ix_pushover_varsling=false).

    Dokumentasjon/wiki:
    https://github.com/surematu/WebHomeHelpFiles/blob/main/README_varmepumpe_regulering.md

    Blueprint versjon: 2026.08.03
  domain: automation
  source_url: https://github.com/surematu/WebHomeHelpFiles/blob/main/blueprints/automation/varmepumpe_regulering.yaml
  author: WebHome
  homeassistant:
    min_version: 2025.11.0

  input:
    varme:
      name: Varme
      icon: mdi:fire
      collapsed: true
      input:
        rom_climate:
          name: Klima - Overordnet styring for rom (Versatile Thermostat)
          selector:
            entity:
              domain: climate

        inputselect_varmepumpe_auto_manuell:
          name: Input select - Varmepumpe AUTO/MANUELL (valgfri)
          description: >
            Valgfri input_select med valg AUTO/MANUELL.
            AUTO eller tom input = automasjonen kan styre varmepumpe (modus, settpunkt, vifte).
            MANUELL = automasjonen leser fortsatt data, men skriver ikke til varmepumpa.
          default: ""
          selector:
            entity:
              domain: input_select

        inputselect_varme_auto_manuell:
          name: Input select - Varme AUTO/MANUELL (valgfri)
          description: >
            Valgfri input_select med valg AUTO/MANUELL.
            AUTO eller tom input = automasjonen kan styre varme-utganger.
            MANUELL = automasjonen skriver ikke til panelovn climate, digital varmeutgang eller prosent-utgang.
          default: ""
          selector:
            entity:
              domain: input_select

        panelovn_padrag_grense:
          name: Pådrag-grense varmepumpe / panelovn (%)
          description: >
            Delingspunkt mellom varmepumpe og panelovn når modus er varme.
            Fra 0% til denne grensen brukes hele pådraget på varmepumpa (normalisert 0–100%).
            Over grensen kan panelovn få resten av pådraget, men først etter at varmepumpa
            faktisk har nådd minst 80% av sin egen varmekurve.
            Høyere verdi = varmepumpa prioriteres lenger før panelovn får bidra.
            Standard 60 %. Krever at minst én varme-utgang er konfigurert.
          default: 60
          selector:
            number:
              min: 40
              max: 60
              step: 5
              mode: slider
              unit_of_measurement: "%"

    varmepumpe:
      name: Varmepumpe
      icon: mdi:heat-pump
      collapsed: true
      input:
        varmepumpe_climate:
          name: Climate - Varmepumpe
          selector:
            entity:
              domain: climate

        varmepumpe_climate_sekundar:
          name: Climate - Varmepumpe sekundær (valgfri)
          description: >
            Valgfri sekundær climate-entitet for samme varmepumpe.
            Primær varmepumpe skrives alltid først.
            30 sekunder senere sammenlignes sekundær entitet med ønsket modus, settpunkt og vifte,
            og eventuelle manglende endringer skrives dit også.
            Nyttig når sekundær entitet har reservefunksjon eller støtter funksjoner som primær ikke har.
          default: ""
          selector:
            entity:
              domain: climate

        maks_endring_per_kjoring:
          name: Maks endring per kjøring (°C)
          description: "Begrenser hvor mye varmepumpe-settpunktet kan endres per kjøring. Default 1°C."
          default: 1
          selector:
            number:
              min: 0
              max: 5
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

        grader_under_min:
          name: Grader i forhold til settpunkt ved 0% pådrag (grader_under_min)
          description: >
            Offset i °C relativt til iclimate_varme_rt_max_spk_spcomfort når varmepumpe_output_power=0.
            Default -4 betyr basis-4. Sett f.eks 1–4 for basis+1 til basis+4.
          default: -4
          selector:
            number:
              min: -10
              max: 10
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

        grader_over_maks:
          name: Grader i forhold til settpunkt ved 100% pådrag (grader_over_maks)
          description: >
            Offset i °C relativt til iclimate_varme_rt_max_spk_spcomfort når varmepumpe_output_power=100.
            Default 3 betyr basis+3.
          default: 3
          selector:
            number:
              min: -10
              max: 10
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

        varmepumpe_min_temp_overstyring:
          name: Varmepumpe minimum settpunkt (valgfri overstyring)
          description: >
            Valgfri manuell minimumsgrense for hva automasjonen får skrive til varmepumpa.
            Brukes når rapportert min_temp i climate-attributter ikke stemmer i praksis, eller når du
            ønsker ekstra begrensning. Tomt felt = ingen manuell overstyring.
            Effektiv minimumsgrense blir strengeste verdi: max(rapportert min_temp, manuell minimum).
          default: ""
          selector:
            text:

        varmepumpe_maks_temp_overstyring:
          name: Varmepumpe maksimum settpunkt (valgfri overstyring)
          description: >
            Valgfri manuell maksimumsgrense for hva automasjonen får skrive til varmepumpa.
            Brukes når rapportert max_temp i climate-attributter ikke stemmer i praksis, eller når du
            ønsker ekstra begrensning. Tomt felt = ingen manuell overstyring.
            Effektiv maksimumsgrense blir strengeste verdi: min(rapportert max_temp, manuell maksimum).
          default: ""
          selector:
            text:

    vifte:
      name: Vifte
      icon: mdi:fan
      collapsed: true
      input:
        vifte_boost:
          name: Vifte boost (på/av)
          description: >
            false = ingen automatisk vifteregulering.
            true = automasjonen prøver å hjelpe varmepumpa med mer luftflyt:
            frost-preset gir high, lavt pådrag kan gi medium, og høyt pådrag gir high.
            Nyttig når varmepumpa reagerer tregt eller trenger ekstra sirkulasjon ved stort varmebehov.
          default: false
          selector:
            boolean: {}

    kjoling:
      name: Kjøling
      icon: mdi:snowflake
      collapsed: true
      input:
        ix_kjoling_aktiv:
          name: Aktiver kjøling (valgfri)
          description: >
            Hvis aktivert, kan varmepumpa automatisk bytte mellom heat og cool
            basert på romtemperatur relativt til rom-settpunktet.
            Hvis deaktivert, brukes alltid heat-modus (eksisterende oppførsel).
          default: false
          selector:
            boolean: {}

        inum_kjoling_sommer_kaldt_grense:
          name: SOMMER – tving varme når romtemp er så mange grader under settpunkt (°C)
          description: >
            I SOMMER-modus: tving heat-modus når iclimate_varme_rt_pv < iclimate_varme_rt_spk − denne verdien.
            Sikrer at rommet ikke blir for kaldt selv om sommermodus foretrekker kjøling.
            Default 2°C.
          default: 2
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

        inum_kjoling_av_delta_sommer:
          name: SOMMER - Hysterese varme av
          description: >
            SOMMER: tvungen varme slås av når romtemp >= (settpunkt − inum_kjoling_sommer_kaldt_grense) + hysterese.
            Hysteresen regnes fra terskelen som slo varmen PÅ, ikke fra settpunktet.
            Eksempel: settpunkt=22, kaldt_grense=3, hysterese=1 → varme startet ved 22−3=19°C, slås av igjen ved 19+1=20°C.
            Default 1°C.
          default: 1
          selector:
            number:
              min: 0
              max: 3
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

        inum_kjoling_vinter_varmt_grense:
          name: VINTER – tillat kjøling når romtemp er så mange grader over settpunkt (°C)
          description: >
            I VINTER-modus: tillat cool-modus som nødoverkobling når iclimate_varme_rt_pv >= iclimate_varme_rt_spk + denne verdien.
            Sikrer at rommet ikke blir for varmt selv om vintermodus foretrekker varme.
            Default 2°C.
          default: 2
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

        inum_kjoling_av_delta_vinter:
          name: VINTER - Hysterese kjøling av
          description: >
            VINTER: tvungen kjøling slås av når romtemp <= (settpunkt + inum_kjoling_vinter_varmt_grense) − hysterese.
            Hysteresen regnes fra terskelen som slo kjølingen PÅ, ikke fra settpunktet.
            Eksempel: settpunkt=22, varmt_grense=3, hysterese=1 → kjøling startet ved 22+3=25°C, slås av igjen ved 25−1=24°C.
            Default 1°C.
          default: 1
          selector:
            number:
              min: 0
              max: 3
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

    panelovn:
      name: Panelovn
      icon: mdi:radiator
      collapsed: true
      input:
        varme_climate:
          name: Climate - Varme
          description: >
            Valgfri. Varme-climate som styres basert på beregnet modus (heat/cool).
            Hvis beregnet modus er kjøling eller overordnet er av, settes dette klimaet til frost-settpunkt
            (leses fra preset_temperatures.frost_temp på overordnet climate, typisk 10 °C).
            Ellers ved varme settes settpunktet lik overordnet settpunkt.
            Settpunktet klampes alltid til klimaets min_temp og max_temp.
          default: ""
          selector:
            entity:
              domain: climate

        panelovn_delta_maks:
          name: Temperaturspenn for panelovn 0–100 % (°C)
          description: >
            Hvor mange grader rommet kan ligge under settpunkt før panelovn-climate er på 100%.
            0 °C under settpunkt gir 0% panelovn (frost), og valgt spenn under settpunkt gir 100%.
            Mellom disse nivåene reguleres panelovn lineært.
            Lav verdi = panelovn reagerer raskere/aggressivt hvis varmepumpa bruker tid på å hente seg inn.
            Høy verdi = roligere opptrapping.
            Denne verdien deaktiverer ikke panelovn alene; bruk tom varme-utgang eller MANUELL for å slå av panelovn-styring.
            Eksempel: 1 °C gir rask respons, mens 5 °C gjør at panelovn bygger seg mye roligere opp.
            Standard 2.0 °C.
          default: 2.0
          selector:
            number:
              min: 0.5
              max: 5
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

        varme_switch:
          name: Utgang - Varme utgang digital (switch)
          description: >
            Valgfri. Digital utgang (switch/relé) som supplement ved høyt pådrag, styrt i faste trinn.
            Kan brukes alene eller i tillegg til climate-panelovn.
            Fast 30-minutters syklus med 10-minutters steg:
            under 30% = av, 30–59% = på 10 min / av 20 min, 60–89% = på 20 min / av 10 min, 90–100% = på hele tiden.
            Krever at panelovn pådrag-grense og panelovn_hp_ready er oppfylt – samme vilkår som for climate-panelovn.
          default: ""
          selector:
            entity:
              domain: switch

        panelovn_prosent_output:
          name: Utgang - Varme pådrag panelovn (input_number)
          description: >
            Valgfri. Skriver beregnet panelovn-pådrag (0–100%) til valgt input_number.
            Brukes når du vil styre egen syklustid utenfor denne automasjonen i stedet for innebygd switch-trinnstyring.
          default: ""
          selector:
            entity:
              domain: input_number

    varsling:
      name: "Varsling (Valgfri)"
      icon: mdi:bell-outline
      collapsed: true
      input:
        ix_pushover_varsling:
          name: Aktiver Pushover-varsling
          description: >
            Standard av (false). Aktiverer debug-varsling via Pushover ved hver kjøring som
            fører til en endring. Nyttig for feilsøking av settpunkt- og panelovn-logikk.
          default: false
          selector:
            boolean: {}

        varsel_ved_manuell_kjoring:
          name: Send varsel ved manuell kjøring
          description: >
            Sett til true for å sende varsel når automasjonen kjøres manuelt.
            Sett til false for å ikke sende varsel ved manuell kjøring.
          default: true
          selector:
            boolean: {}

        pushover_destination:
          name: Pushover destination
          description: Mottakergruppe i script.varsel_pushover_send_melding_webhome.
          default: pushover
          selector:
            text:

        pushover_priority:
          name: Pushover priority
          default: -1
          selector:
            number:
              min: -2
              max: 2
              step: 1
              mode: box

        pushover_ttl_hours:
          name: Levetid varsel (timer)
          description: Hvor lenge skal varslet være synlig før det forsvinner?
          default: 6
          selector:
            number:
              min: 0
              max: 168
              step: 1
              unit_of_measurement: h
              mode: box

mode: restart

triggers:
  - trigger: time_pattern
    minutes: "/10"

  - trigger: state
    entity_id: !input rom_climate
    attribute: temperature

  - trigger: state
    entity_id: input_select.driftsmodus_vinter_sommer

actions:
  - delay:
      seconds: 5

  # Steg 0: inputs
  - variables:
      iclimate_varme: !input rom_climate
      iclimate_varmepumpe: !input varmepumpe_climate
      iclimate_varmepumpe_sekundar: !input varmepumpe_climate_sekundar
      iinputselect_varmepumpe_auto_manuell: !input inputselect_varmepumpe_auto_manuell
      iinputselect_varme_auto_manuell: !input inputselect_varme_auto_manuell
      inum_offset_min: !input grader_under_min
      inum_offset_maks: !input grader_over_maks
      inum_max_step: !input maks_endring_per_kjoring
      itext_varmepumpe_min_temp_overstyring: !input varmepumpe_min_temp_overstyring
      itext_varmepumpe_maks_temp_overstyring: !input varmepumpe_maks_temp_overstyring
      ix_vifte_aktiv: !input vifte_boost
      ix_kjoling_aktiv: !input ix_kjoling_aktiv
      inum_kjoling_av_delta_sommer: !input inum_kjoling_av_delta_sommer
      inum_kjoling_av_delta_vinter: !input inum_kjoling_av_delta_vinter
      inum_kjoling_sommer_kaldt_grense: !input inum_kjoling_sommer_kaldt_grense
      inum_kjoling_vinter_varmt_grense: !input inum_kjoling_vinter_varmt_grense
      iclimate_varme_styrt: !input varme_climate
      inum_panelovn_padrag_grense: !input panelovn_padrag_grense
      inum_panelovn_delta_maks: !input panelovn_delta_maks
      iswitch_varme_styrt: !input varme_switch
      iinputnumber_panelovn_prosent: !input panelovn_prosent_output
      ix_pushover_varsling: !input ix_pushover_varsling
      io_varsel_ved_manuell_kjoring: !input varsel_ved_manuell_kjoring
      pushover_destination: !input pushover_destination
      pushover_priority: !input pushover_priority
      pushover_ttl_hours: !input pushover_ttl_hours
      pushover_ttl_seconds: "{{ (pushover_ttl_hours | float(6)) * 3600 | int }}"

  - variables:
      varmepumpe_sekundar_configured: "{{ (iclimate_varmepumpe_sekundar | string) not in ['', 'None', 'none'] }}"

  # Steg 1: les råverdier + attributt-eksistens
  - variables:
      iclimate_varme_rt_pv: >-
        {{ state_attr(iclimate_varme, 'current_temperature')
           | float(state_attr(iclimate_varme, 'temperature') | float(20)) }}
      iclimate_varme_rt_spk: "{{ state_attr(iclimate_varme, 'temperature') | float(20) }}"
      iclimate_varme_rt_sp_comfort_spkifnocomfort: >-
        {% set presets = state_attr(iclimate_varme, 'preset_temperatures') %}
        {% if presets is mapping and 'comfort_temp' in presets %}
          {{ presets['comfort_temp'] | float(iclimate_varme_rt_spk) }}
        {% else %}
          {{ iclimate_varme_rt_spk }}
        {% endif %}
      iclimate_varme_presetmode: "{{ (state_attr(iclimate_varme, 'preset_mode') | string | lower) }}"
      iclimate_varme_has_power_percent: "{{ state_attr(iclimate_varme, 'power_percent') is not none }}"
      # float: bevarer 0.5-stegs presisjon fra climate-enheten (| int ville miste halve grader)
      iclimate_varmepumpe_rt_spk: "{{ state_attr(iclimate_varmepumpe, 'temperature') | float(0) }}"
      iclimate_varmepumpe_mode: "{{ states(iclimate_varmepumpe) | string | lower }}"
      iclimate_varmepumpe_fanmode: "{{ (state_attr(iclimate_varmepumpe, 'fan_mode') | string | lower) }}"
      varmepumpe_tittel_navn_raw: "{{ state_attr(iclimate_varmepumpe, 'friendly_name') | string | trim }}"
      varmepumpe_tittel_navn: >-
        {% if varmepumpe_tittel_navn_raw not in ['', 'None', 'none', 'unknown', 'unavailable'] %}
          {{ varmepumpe_tittel_navn_raw }}
        {% else %}
          {{ iclimate_varmepumpe | string | replace('climate.', '') | replace('_', ' ') | title }}
        {% endif %}
      # Robust fallback hvis climate-attributter mangler/er ugyldige.
      # 10–30 °C matcher eksisterende standardgrenser i blueprinten.
      varmepumpe_abs_min_default: 10
      varmepumpe_abs_max_default: 30
      iclimate_varmepumpe_abs_min: "{{ state_attr(iclimate_varmepumpe, 'min_temp') | float(varmepumpe_abs_min_default) }}"
      iclimate_varmepumpe_abs_max: "{{ state_attr(iclimate_varmepumpe, 'max_temp') | float(varmepumpe_abs_max_default) }}"
      varmepumpe_manual_min_set_raw: "{{ itext_varmepumpe_min_temp_overstyring | string | trim }}"
      varmepumpe_manual_maks_set_raw: "{{ itext_varmepumpe_maks_temp_overstyring | string | trim }}"
      varmepumpe_manual_number_pattern: '^-?[0-9]+([.,][0-9]+)?$'
      varmepumpe_manual_min_set_norm: "{{ varmepumpe_manual_min_set_raw | replace(',', '.') }}"
      varmepumpe_manual_maks_set_norm: "{{ varmepumpe_manual_maks_set_raw | replace(',', '.') }}"
      varmepumpe_manual_min_set_is_number: "{{ varmepumpe_manual_min_set_raw | regex_match(varmepumpe_manual_number_pattern) }}"
      varmepumpe_manual_maks_set_is_number: "{{ varmepumpe_manual_maks_set_raw | regex_match(varmepumpe_manual_number_pattern) }}"
      varmepumpe_manual_min_set_enabled: "{{ (varmepumpe_manual_min_set_raw != '') and varmepumpe_manual_min_set_is_number }}"
      varmepumpe_manual_maks_set_enabled: "{{ (varmepumpe_manual_maks_set_raw != '') and varmepumpe_manual_maks_set_is_number }}"
      varmepumpe_manual_min_set_value: >-
        {% if varmepumpe_manual_min_set_enabled %}
          {{ [iclimate_varmepumpe_abs_min | float(varmepumpe_abs_min_default), varmepumpe_manual_min_set_norm | float(varmepumpe_abs_min_default)] | max }}
        {% else %}
          {{ iclimate_varmepumpe_abs_min }}
        {% endif %}
      varmepumpe_manual_maks_set_value: >-
        {% if varmepumpe_manual_maks_set_enabled %}
          {{ [iclimate_varmepumpe_abs_max | float(varmepumpe_abs_max_default), varmepumpe_manual_maks_set_norm | float(varmepumpe_abs_max_default)] | min }}
        {% else %}
          {{ iclimate_varmepumpe_abs_max }}
        {% endif %}
      varmepumpe_effektiv_min_setpunkt_raw: >-
        {{ varmepumpe_manual_min_set_value | float(varmepumpe_abs_min_default) }}
      varmepumpe_effektiv_maks_setpunkt_raw: >-
        {{ varmepumpe_manual_maks_set_value | float(varmepumpe_abs_max_default) }}
      varmepumpe_effektiv_min_setpunkt: "{{ varmepumpe_effektiv_min_setpunkt_raw | float(varmepumpe_abs_min_default) }}"
      varmepumpe_effektiv_maks_setpunkt: >-
        {% set min_eff = varmepumpe_effektiv_min_setpunkt_raw | float(varmepumpe_abs_min_default) %}
        {% set max_eff = varmepumpe_effektiv_maks_setpunkt_raw | float(varmepumpe_abs_max_default) %}
        {# Sikring: maks kan aldri være lavere enn min. Ved konflikt settes maks = min_eff. #}
        {{ max_eff if max_eff >= min_eff else min_eff }}
      iclimate_varmepumpe_sekundar_rt_spk: >-
        {% if varmepumpe_sekundar_configured %}
          {{ state_attr(iclimate_varmepumpe_sekundar, 'temperature') | float(0) }}
        {% else %}
          0
        {% endif %}
      iclimate_varmepumpe_sekundar_mode: >-
        {% if varmepumpe_sekundar_configured %}
          {{ states(iclimate_varmepumpe_sekundar) | string | lower }}
        {% else %}
          none
        {% endif %}
      iclimate_varmepumpe_sekundar_fanmode: >-
        {% if varmepumpe_sekundar_configured %}
          {{ state_attr(iclimate_varmepumpe_sekundar, 'fan_mode') | string | lower }}
        {% else %}
          none
        {% endif %}
      varmepumpe_sekundar_tilgjengelig: >-
        {% if varmepumpe_sekundar_configured %}
          {{ iclimate_varmepumpe_sekundar_mode not in ['unknown', 'unavailable'] }}
        {% else %}
          false
        {% endif %}
      iclimate_overordnet_hvac_mode: "{{ states(iclimate_varme) | string | lower }}"
      iclimate_varme_frost_temp: >-
        {% set presets = state_attr(iclimate_varme, 'preset_temperatures') %}
        {% if presets is mapping and 'frost_temp' in presets %}
          {{ presets['frost_temp'] | float(10) }}
        {% else %}
          10
        {% endif %}

  # Steg 1.5: auto/manuell-vendere
  - variables:
      varmepumpe_auto_manuell_raw: >-
        {% if (iinputselect_varmepumpe_auto_manuell | string) in ['', 'None', 'none'] %}
          AUTO
        {% else %}
          {{ states(iinputselect_varmepumpe_auto_manuell) }}
        {% endif %}
      varme_auto_manuell_raw: >-
        {% if (iinputselect_varme_auto_manuell | string) in ['', 'None', 'none'] %}
          AUTO
        {% else %}
          {{ states(iinputselect_varme_auto_manuell) }}
        {% endif %}
  - variables:
      varmepumpe_auto_aktiv: "{{ (varmepumpe_auto_manuell_raw | string | upper) != 'MANUELL' }}"
      varme_auto_aktiv: "{{ (varme_auto_manuell_raw | string | upper) != 'MANUELL' }}"
  - variables:
      varmepumpe_tilgjengelig: "{{ iclimate_varmepumpe_mode not in ['unknown', 'unavailable'] }}"
  - variables:
      is_manual_run: "{{ trigger is none or trigger.platform not in ['time_pattern', 'state'] }}"
      pushover_manuell_kjoring_aktiv: "{{ io_varsel_ved_manuell_kjoring and is_manual_run }}"

  # Steg 2: Beregn hvor mye pådrag vi har på varmekilden
  - choose:
      # Case A: power_percent finnes => bruk direkte
      - conditions:
          - condition: template
            value_template: "{{ iclimate_varme_has_power_percent }}"
        sequence:
          - variables:
              varme_cur_power_calculated: "{{ state_attr(iclimate_varme, 'power_percent') | float(50) }}"

    # Case C: ingen => bruk 50%
    default:
      - variables:
          varme_cur_power_calculated: 50

  # Steg 3: effektivt pådrag
  - variables:
      varmepumpe_output_power: >-
        {% set p = varme_cur_power_calculated | float(50) %}
        {{ [[p, 0] | max, 100] | min }}

  # Steg 4: kjøling (valgfri) + driftsmodus-default med override-hysterese
  # Modus bestemmes FØR settpunkt-beregning slik at kjøling-inversjon kan brukes
  - if:
      - condition: template
        value_template: "{{ ix_kjoling_aktiv }}"
    then:
      - variables:
          drift_modus_raw: "{{ states('input_select.driftsmodus_vinter_sommer') }}"
          drift_is_sommer: "{{ drift_modus_raw == 'SOMMER' }}"
          drift_is_vinter: "{{ drift_modus_raw == 'VINTER' }}"
          drift_available: "{{ drift_modus_raw in ['SOMMER', 'VINTER'] }}"

      - variables:
          drift_hysterese_sommer: "{{ inum_kjoling_av_delta_sommer | float(0.5) }}"
          drift_hysterese_vinter: "{{ inum_kjoling_av_delta_vinter | float(0.5) }}"
          summer_force_heat_on: >-
            {% set temp = iclimate_varme_rt_pv | float(0) %}
            {% set setp = iclimate_varme_rt_spk | float(0) %}
            {% set grense = inum_kjoling_sommer_kaldt_grense | float(2) %}
            {{ temp < (setp - grense) }}
          summer_force_heat_keep: >-
            {% set temp = iclimate_varme_rt_pv | float(0) %}
            {% set setp = iclimate_varme_rt_spk | float(0) %}
            {% set grense = inum_kjoling_sommer_kaldt_grense | float(2) %}
            {% set hyst = drift_hysterese_sommer | float(0.5) %}
            {{ (iclimate_varmepumpe_mode == 'heat') and (temp < (setp - grense) + hyst) }}
          winter_allow_cool_on: >-
            {% set temp = iclimate_varme_rt_pv | float(0) %}
            {% set setp = iclimate_varme_rt_spk | float(0) %}
            {% set grense = inum_kjoling_vinter_varmt_grense | float(2) %}
            {{ temp > (setp + grense) }}
          winter_allow_cool_keep: >-
            {% set temp = iclimate_varme_rt_pv | float(0) %}
            {% set setp = iclimate_varme_rt_spk | float(0) %}
            {% set grense = inum_kjoling_vinter_varmt_grense | float(2) %}
            {% set hyst = drift_hysterese_vinter | float(0.5) %}
            {{ (iclimate_varmepumpe_mode == 'cool') and (temp > (setp + grense) - hyst) }}
      - variables:
          WantCool_SetpointComfOrHihger: >-
            {% set setp = iclimate_varme_rt_spk | float(0) %}
            {% set comfort = iclimate_varme_rt_sp_comfort_spkifnocomfort | float(setp) %}
            {{ setp >= comfort }}
      - variables:
          onsket_mode: >-
            {% if not drift_available %}
              heat
            {% elif drift_is_sommer %}
              {% if not WantCool_SetpointComfOrHihger %}
                heat
              {% elif summer_force_heat_on or summer_force_heat_keep %}
                heat
              {% else %}
                cool
              {% endif %}
            {% else %}
              {% if not WantCool_SetpointComfOrHihger %}
                heat
              {% elif winter_allow_cool_on or winter_allow_cool_keep %}
                cool
              {% else %}
                heat
              {% endif %}
            {% endif %}
          skal_oppdatere_mode: "{{ (onsket_mode | string | trim) != (iclimate_varmepumpe_mode | string | trim) }}"
    else:
      - variables:
          onsket_mode: heat
          skal_oppdatere_mode: "{{ iclimate_varmepumpe_mode != 'heat' }}"

  # Steg 4.5: beregn ønsket modus for overordnet climate
  # Overordnet climate skal aldri stå i 'off'. Er den 'off', settes den til beregnet modus (heat/cool).
  # Trenger systemet null varme/kjøling, brukes frost-settpunkt i stedet for off.
  - variables:
      onsket_overordnet_mode: "{{ onsket_mode }}"
  - variables:
      onsket_overordnet_mode_txt: "{{ onsket_overordnet_mode | string | lower | trim }}"
  - variables:
      # Sikker modus for overordnet climate: kun heat/cool tillates.
      # Fallback er heat for å unngå uønsket aktiv kjøling ved ugyldig/ukjent modusverdi.
      onsket_overordnet_mode_sikker: "{{ onsket_overordnet_mode_txt if onsket_overordnet_mode_txt in ['heat', 'cool'] else 'heat' }}"
  - variables:
      iclimate_overordnet_hvac_mode_txt: "{{ iclimate_overordnet_hvac_mode | string | lower | trim }}"
  - variables:
      skal_oppdatere_overordnet: "{{ onsket_overordnet_mode_sikker != iclimate_overordnet_hvac_mode_txt }}"

  # Steg 5: normaliser pådrag for varmepumpe og panelovn
  - variables:
      iclimate_varme_rt_max_spk_spcomfort: "{{ [iclimate_varme_rt_spk, iclimate_varme_rt_sp_comfort_spkifnocomfort] | max }}"
  - variables:
      hp_padrag_grense: "{{ inum_panelovn_padrag_grense | float(60) }}"
  - variables:
      # Varme: pådrag 0–grense% normaliseres til 0–100% for varmepumpe.
      # Eksempel grense=60: pådrag 30% → hp_norm=50%, pådrag 60% → hp_norm=100%
      hp_norm_power_heat: >-
        {% set p = varmepumpe_output_power | float(0) %}
        {% set g = hp_padrag_grense | float(60) %}
        {{ ([(p / g) * 100, 100] | min) if g > 0 else 100 }}
  - variables:
      hp_heat_spk_min: "{{ (iclimate_varme_rt_max_spk_spcomfort | float(0)) + (inum_offset_min | float(0)) }}"
      hp_heat_spk_max: "{{ (iclimate_varme_rt_max_spk_spcomfort | float(0)) + (inum_offset_maks | float(0)) }}"
  - variables:
      hp_actual_power_heat: >-
        {% set spk_now = iclimate_varmepumpe_rt_spk | float(0) %}
        {% set spk_min = hp_heat_spk_min | float(0) %}
        {% set spk_max = hp_heat_spk_max | float(0) %}
        {% set span = spk_max - spk_min %}
        {% if span <= 0 %}
          100
        {% else %}
          {{ [[((spk_now - spk_min) / span) * 100, 0] | max, 100] | min }}
        {% endif %}
  - variables:
      panelovn_hp_ready: "{{ (hp_actual_power_heat | float(0)) >= 80 }}"
  - variables:
      # Panelovn: pådrag grense–100% normaliseres til 0–100%.
      # Er alltid 0 ved kjøling, når VERKEN climate ELLER switch er konfigurert,
      # eller når varmepumpa ikke har rampet opp til 80 % av sin varmekurve.
      panelovn_maal_power: >-
        {% set p = varmepumpe_output_power | float(0) %}
        {% set g = hp_padrag_grense | float(60) %}
        {% set rest = 100.0 - g %}
        {% set climate_ok = (iclimate_varme_styrt | string) not in ['', 'None', 'none'] %}
        {% set switch_ok = (iswitch_varme_styrt | string) not in ['', 'None', 'none'] %}
        {% if onsket_mode != 'heat' or (not climate_ok and not switch_ok) or not (panelovn_hp_ready | bool) %}
          0
        {% elif rest <= 0 %}
          100
        {% else %}
          {{ [[(p - g) / rest * 100, 0] | max, 100] | min }}
        {% endif %}
  - variables:
      panelovn_switch_configured: "{{ (iswitch_varme_styrt | string) not in ['', 'None', 'none'] }}"
  - variables:
      panelovn_prosent_output_configured: "{{ (iinputnumber_panelovn_prosent | string) not in ['', 'None', 'none'] }}"
  - variables:
      # Fast trinnstyring i 30-min syklus med 10-min slot:
      # <30%=0 slot på, 30-59%=1 slot på, 60-89%=2 slot på, >=90%=3 slot på.
      panelovn_switch_on_slots: >-
        {% set p = panelovn_maal_power | float(0) %}
        {% if p >= 90 %}
          3
        {% elif p >= 60 %}
          2
        {% elif p >= 30 %}
          1
        {% else %}
          0
        {% endif %}
  - variables:
      current_minutes_since_midnight: "{{ (now().hour * 60) + now().minute }}"
  - variables:
      panelovn_10min_block_index: "{{ current_minutes_since_midnight // 10 }}"
  - variables:
      # Slot-indeks i fast 30-min syklus (0,1,2): 10-min blokknummer modulo 3.
      panelovn_switch_slot_index: "{{ panelovn_10min_block_index % 3 }}"
  - variables:
      # true dersom switch skal være på i nåværende 10-min slot.
      panelovn_switch_skal_aktiveres: >-
        {{ panelovn_switch_configured
           and (panelovn_switch_on_slots | int(0)) > 0
           and (panelovn_switch_slot_index | int(0)) < (panelovn_switch_on_slots | int(0)) }}
  - variables:
      panelovn_prosent_output_onsket: "{{ (panelovn_maal_power | float(0)) | round(0) | int }}"
  - variables:
      panelovn_prosent_output_naa: >-
        {% if panelovn_prosent_output_configured %}
          {{ (states(iinputnumber_panelovn_prosent) | float(-1)) | round(0) | int }}
        {% else %}
          -1
        {% endif %}
  - variables:
      panelovn_prosent_output_update_needed: >-
        {{ panelovn_prosent_output_configured
           and (panelovn_prosent_output_onsket | int(-1)) != (panelovn_prosent_output_naa | int(-1)) }}

  # Steg 6: beregn ønsket settpunkt (modus-bevisst)
  - variables:
      # Effektivt hp-pådrag:
      # - Varme: normalisert (0–grense% → 0–100%), panelovn tar over etter grense
      # - Kjøling: direkte pådrag 0–100% (inversjon håndteres i formelen under)
      hp_effective_power: "{{ hp_norm_power_heat if onsket_mode == 'heat' else varmepumpe_output_power }}"
  - variables:
      varmepumpe_req_spk_raw: >-
        {% set p = hp_effective_power | float(0) %}
        {% set omin = inum_offset_min | float(0) %}
        {% set omax = inum_offset_maks | float(0) %}
        {% set basis = iclimate_varme_rt_max_spk_spcomfort | float(0) %}
        {% if onsket_mode == 'cool' %}
          {# Kjøling: invertert kurve – 0% pådrag → høy setpunkt (lite kjøling),
             100% pådrag → lav setpunkt (maks kjøling) #}
          {{ basis + omax - (p / 100) * (omax - omin) }}
        {% else %}
          {# Varme: standard kurve – 0% → lav setpunkt, 100% → høy setpunkt #}
          {{ basis + omin + (p / 100) * (omax - omin) }}
        {% endif %}
  - variables:
      varmepumpe_req_spk_incl_abs_limit: >-
        {% set t = varmepumpe_req_spk_raw | float(iclimate_varme_rt_max_spk_spcomfort) %}
        {{ [ [t, varmepumpe_effektiv_min_setpunkt | float(varmepumpe_abs_min_default)] | max, varmepumpe_effektiv_maks_setpunkt | float(varmepumpe_abs_max_default) ] | min }}
  - variables:
      # Mellomsteg: rundes til nærmeste halve (20.5, 20 osv.).
      # Endelig avrunding skjer i qnum_varmepumpe_req_spk basert på inum_max_step.
      varmepumpe_req_spk_rounded_nearest_half: "{{ ((varmepumpe_req_spk_incl_abs_limit | float(0)) * 2) | round(0) / 2 }}"
  - variables:
      # RAMP + AVRUNDING: betinget på inum_max_step
      # - Heltall-steg (1, 2, 3, …): ønsket og rampet verdi avrundes til nærmeste heltall
      # - Halvt steg (0.5, 1.5, 2.5, …): beholder nærmeste-0.5-avrunding
      # Float-math beholdes for selve ramp-beregningen slik at halve-stegs-presisjon bevares
      qnum_varmepumpe_req_spk: >-
        {% set ønsket_half = varmepumpe_req_spk_rounded_nearest_half | float %}
        {% set nå = iclimate_varmepumpe_rt_spk | float %}
        {% set step = inum_max_step | float %}
        {% set step_is_whole = step == (step | int | float) %}
        {% set ønsket = (ønsket_half | round(0) | float) if step_is_whole else ønsket_half %}
        {% set ramped = ønsket if step <= 0 else ([nå - step, [ønsket, nå + step] | min] | max) %}
        {{ (ramped | round(0) | float) if step_is_whole else ((ramped * 2) | round(0) / 2) }}
      # Float-sammenligning: fanger opp halvgrads- og heltals-endringer
      qx_varmepumpe_spk_update_needed: "{{ (qnum_varmepumpe_req_spk | float) != (iclimate_varmepumpe_rt_spk | float) }}"

  # Steg 7: vifte (valgfri) – ix_vifte_aktiv er satt i Steg 0
  - if:
      - condition: template
        value_template: "{{ ix_vifte_aktiv }}"
    then:
      - variables:
          # 31–50 % betyr behold eksisterende fan_mode; bare lave/høye behov tvinger ny verdi.
          onsket_vifte_target_raw: >-
            {% if iclimate_varme_presetmode == 'frost' %}
              high
            {% elif (varmepumpe_output_power | float(0)) <= 30 %}
              medium
            {% elif (varmepumpe_output_power | float(0)) > 50 %}
              high
            {% else %}
              {{ '' }}
            {% endif %}
          varmepumpe_vifte_stottes: "{{ state_attr(iclimate_varmepumpe, 'fan_modes') is not none }}"
          onsket_vifte: >-
            {% if (onsket_vifte_target_raw | string | trim) == '' %}
              {{ iclimate_varmepumpe_fanmode }}
            {% else %}
              {{ onsket_vifte_target_raw }}
            {% endif %}
          skal_oppdatere_vifte: >-
            {{ varmepumpe_vifte_stottes
               and (onsket_vifte_target_raw | string | trim) != ''
               and (onsket_vifte | string) != (iclimate_varmepumpe_fanmode | string) }}
    else:
      - variables:
          onsket_vifte_target_raw: ""
          varmepumpe_vifte_stottes: false
          onsket_vifte: "{{ iclimate_varmepumpe_fanmode }}"
          skal_oppdatere_vifte: false

  - variables:
      qx_varmepumpe_spk_update_needed_effektiv: "{{ varmepumpe_auto_aktiv and varmepumpe_tilgjengelig and qx_varmepumpe_spk_update_needed }}"
      skal_oppdatere_vifte_effektiv: "{{ varmepumpe_auto_aktiv and varmepumpe_tilgjengelig and skal_oppdatere_vifte }}"
      skal_oppdatere_mode_effektiv: "{{ varmepumpe_auto_aktiv and varmepumpe_tilgjengelig and skal_oppdatere_mode }}"
      skal_oppdatere_overordnet_effektiv: "{{ varmepumpe_auto_aktiv and varmepumpe_tilgjengelig and skal_oppdatere_overordnet }}"
      varmepumpe_manual_min_debug_text: >-
        {% if varmepumpe_manual_min_set_enabled %}
          min={{ varmepumpe_manual_min_set_value | round(1) }}
        {% else %}
          {{ '' }}
        {% endif %}
      varmepumpe_manual_maks_debug_text: >-
        {% if varmepumpe_manual_maks_set_enabled %}
          maks={{ varmepumpe_manual_maks_set_value | round(1) }}
        {% else %}
          {{ '' }}
        {% endif %}
      varmepumpe_manual_limits_debug_joiner: >-
        {% if varmepumpe_manual_min_set_enabled and varmepumpe_manual_maks_set_enabled %}
          , 
        {% else %}
          {{ '' }}
        {% endif %}
      varmepumpe_manual_limits_debug_suffix: >-
        {% if varmepumpe_manual_min_set_enabled or varmepumpe_manual_maks_set_enabled %}
          , manuell {{ varmepumpe_manual_min_debug_text }}{{ varmepumpe_manual_limits_debug_joiner }}{{ varmepumpe_manual_maks_debug_text }}
        {% else %}
          {{ '' }}
        {% endif %}
      varmepumpe_skrivgrenser_debug: >-
        Skrivgrenser: {{ varmepumpe_effektiv_min_setpunkt | round(1) }}-{{ varmepumpe_effektiv_maks_setpunkt | round(1) }}°C
      varmepumpe_primaer_endret: >-
        {{ qx_varmepumpe_spk_update_needed_effektiv
           or skal_oppdatere_vifte_effektiv
           or skal_oppdatere_mode_effektiv }}
  - variables:
      # True når automasjonen bytter mellom heat og cool (ikke bare korrigerer fra f.eks. 'off').
      # Settpunktet skrives ikke samme kjøring – modus må først få sette seg.
      varmepumpe_mode_skifter: >-
        {{ skal_oppdatere_mode_effektiv
           and iclimate_varmepumpe_mode in ['heat', 'cool']
           and onsket_mode in ['heat', 'cool']
           and iclimate_varmepumpe_mode != onsket_mode }}
  - variables:
      # Blokkerer settpunkt-skriving hvis vi samtidig bytter mellom varme og kjøling.
      qx_varmepumpe_spk_update_needed_effektiv: "{{ qx_varmepumpe_spk_update_needed_effektiv and not varmepumpe_mode_skifter }}"

  # Steg 8: sett verdier kun ved behov
  - if:
      - condition: or
        conditions:
          - condition: template
            value_template: "{{ qx_varmepumpe_spk_update_needed_effektiv }}"
          - condition: template
            value_template: "{{ skal_oppdatere_vifte_effektiv }}"
          - condition: template
            value_template: "{{ skal_oppdatere_mode_effektiv }}"
          - condition: template
            value_template: "{{ skal_oppdatere_overordnet_effektiv }}"
    then:
      - if:
          - condition: template
            value_template: "{{ skal_oppdatere_overordnet_effektiv }}"
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input rom_climate
            data:
              hvac_mode: "{{ onsket_overordnet_mode_sikker }}"

      - if:
          - condition: template
            value_template: "{{ skal_oppdatere_mode_effektiv }}"
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input varmepumpe_climate
            data:
              hvac_mode: "{{ onsket_mode }}"

      - if:
          - condition: template
            value_template: "{{ qx_varmepumpe_spk_update_needed_effektiv }}"
        then:
          - action: climate.set_temperature
            target:
              entity_id: !input varmepumpe_climate
            data:
              temperature: "{{ qnum_varmepumpe_req_spk }}"

      - if:
          - condition: template
            value_template: "{{ skal_oppdatere_vifte_effektiv }}"
        then:
          - action: climate.set_fan_mode
            target:
              entity_id: !input varmepumpe_climate
            data:
              fan_mode: "{{ onsket_vifte }}"

  # Steg 8b: synk sekundær varmepumpe etter primær (valgfri)
  - if:
      - condition: template
        value_template: >-
          {{ varmepumpe_auto_aktiv
             and varmepumpe_sekundar_configured
             and varmepumpe_sekundar_tilgjengelig
             and (varmepumpe_primaer_endret or (onsket_vifte_target_raw | string | trim) != '') }}
    then:
      - delay:
          seconds: 30
      - variables:
          varmepumpe_sekundar_rt_spk_etter_delay: "{{ state_attr(iclimate_varmepumpe_sekundar, 'temperature') | float(0) }}"
          varmepumpe_sekundar_mode_etter_delay: "{{ states(iclimate_varmepumpe_sekundar) | string | lower }}"
          varmepumpe_sekundar_fanmode_etter_delay: "{{ state_attr(iclimate_varmepumpe_sekundar, 'fan_mode') | string | lower }}"
          varmepumpe_sekundar_vifte_stottes: "{{ state_attr(iclimate_varmepumpe_sekundar, 'fan_modes') is not none }}"
      - variables:
          varmepumpe_sekundar_spk_update_needed: >-
            {{ not varmepumpe_mode_skifter
               and (qnum_varmepumpe_req_spk | float) != (varmepumpe_sekundar_rt_spk_etter_delay | float) }}
          varmepumpe_sekundar_mode_update_needed: >-
            {{ (onsket_mode | string | trim) != (varmepumpe_sekundar_mode_etter_delay | string | trim) }}
          varmepumpe_sekundar_vifte_update_needed: >-
            {{ varmepumpe_sekundar_vifte_stottes
               and (onsket_vifte_target_raw | string | trim) != ''
               and (onsket_vifte | string) != (varmepumpe_sekundar_fanmode_etter_delay | string) }}
      - if:
          - condition: template
            value_template: "{{ varmepumpe_sekundar_mode_update_needed }}"
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: "{{ iclimate_varmepumpe_sekundar }}"
            data:
              hvac_mode: "{{ onsket_mode }}"
      - if:
          - condition: template
            value_template: "{{ varmepumpe_sekundar_spk_update_needed }}"
        then:
          - action: climate.set_temperature
            target:
              entity_id: "{{ iclimate_varmepumpe_sekundar }}"
            data:
              temperature: "{{ qnum_varmepumpe_req_spk }}"
      - if:
          - condition: template
            value_template: "{{ varmepumpe_sekundar_vifte_update_needed }}"
        then:
          - action: climate.set_fan_mode
            target:
              entity_id: "{{ iclimate_varmepumpe_sekundar }}"
            data:
              fan_mode: "{{ onsket_vifte }}"

  # Steg 9: panelovn-proporsjonal-styring (valgfri – kun når varme-climate er konfigurert)
  # Panelovn-settpunkt skaleres 0–100 % basert på romtemp-underskudd (0–panelovn_delta_maks °C under settpunkt).
  # Ingen binær av/på: settpunktet trappes jevnt opp etter hvert som romtemp faller under settpunkt.
  - if:
      - condition: template
        value_template: "{{ varme_auto_aktiv and iclimate_varme_styrt is not none and iclimate_varme_styrt != '' }}"
    then:
      - variables:
          varme_styrt_naa_spk: "{{ state_attr(iclimate_varme_styrt, 'temperature') | float(0) }}"
      - variables:
          varme_styrt_min_temp: "{{ state_attr(iclimate_varme_styrt, 'min_temp') | float(10) }}"
          varme_styrt_max_temp: "{{ state_attr(iclimate_varme_styrt, 'max_temp') | float(30) }}"
      - variables:
          # Antall grader romtemp er under settpunkt, klampt til [0, delta_maks].
          panelovn_temp_delta: >-
            {% set delta = (iclimate_varme_rt_spk | float(0)) - (iclimate_varme_rt_pv | float(0)) %}
            {{ [[delta, 0] | max, inum_panelovn_delta_maks | float(2)] | min }}
      - variables:
          # Proporsjonal faktor 0.0–1.0: 0 = romtemp ≥ settpunkt, 1 = romtemp ≥ delta_maks under settpunkt.
          panelovn_prop: >-
            {% set d = inum_panelovn_delta_maks | float(2) %}
            {{ (panelovn_temp_delta | float(0)) / d if d > 0 else 0 }}
      - variables:
          varme_styrt_onsket_spk_raw: >-
            {# Off-sjekken beholdes som sikkerhet for overgangstilstander før modus-synk er utført i samme kjøring. #}
            {% if iclimate_overordnet_hvac_mode_txt == 'off' or onsket_overordnet_mode_sikker == 'cool'
               or (panelovn_maal_power | float(0)) == 0
               or not (panelovn_hp_ready | bool) %}
              {{ iclimate_varme_frost_temp | float(10) }}
            {% else %}
              {{ (iclimate_varme_frost_temp | float(10))
                 + ((iclimate_varme_rt_spk | float(20)) - (iclimate_varme_frost_temp | float(10)))
                 * (panelovn_prop | float(0)) }}
            {% endif %}
      - variables:
          varme_styrt_onsket_spk: "{{ [[varme_styrt_onsket_spk_raw | float, varme_styrt_min_temp | float] | max, varme_styrt_max_temp | float] | min }}"
      - variables:
          varme_styrt_spk_update_needed: "{{ (varme_styrt_onsket_spk | float) != (varme_styrt_naa_spk | float) }}"
      - if:
          - condition: template
            value_template: "{{ varme_styrt_spk_update_needed }}"
        then:
          - action: climate.set_temperature
            target:
              entity_id: "{{ iclimate_varme_styrt }}"
            data:
              temperature: "{{ varme_styrt_onsket_spk }}"

  # Steg 9b: panelovn switch trinnstyring (valgfri – kun når varme_switch er konfigurert)
  # Fast 30-min syklus med 10-min slot:
  # <30%=av, 30-59%=på 1 av 3 slot, 60-89%=på 2 av 3 slot, 90-100%=på alle 3 slot.
  - if:
      - condition: template
        value_template: "{{ varme_auto_aktiv and panelovn_switch_configured }}"
    then:
      - if:
          - condition: template
            value_template: "{{ panelovn_switch_skal_aktiveres }}"
        then:
          - action: switch.turn_on
            target:
              entity_id: "{{ iswitch_varme_styrt }}"
        else:
          - action: switch.turn_off
            target:
              entity_id: "{{ iswitch_varme_styrt }}"

  # Steg 9c: valgfri prosent-utgang for panelovn (input_number)
  - if:
      - condition: template
        value_template: "{{ varme_auto_aktiv and panelovn_prosent_output_update_needed }}"
    then:
      - action: input_number.set_value
        target:
          entity_id: "{{ iinputnumber_panelovn_prosent }}"
        data:
          value: "{{ panelovn_prosent_output_onsket }}"

  # Steg 10: Pushover-varsling (debug, av som standard – ix_pushover_varsling=false)
  - if:
      - condition: template
        value_template: >-
          {{ ix_pushover_varsling
             and (pushover_destination | string | trim) != ''
             and (qx_varmepumpe_spk_update_needed_effektiv
                  or skal_oppdatere_mode_effektiv
                  or skal_oppdatere_vifte_effektiv
                  or (varme_styrt_spk_update_needed | default(false)))
             or (pushover_manuell_kjoring_aktiv and (pushover_destination | string | trim) != '') }}
    then:
      - action: script.varsel_pushover_send_melding_webhome
        data:
          title: >-
            🌡️ {{ varmepumpe_tittel_navn }} – {% if skal_oppdatere_mode_effektiv %}{{ 'Kjølemodus' if onsket_mode == 'cool' else 'Varmemodus' }}{% elif qx_varmepumpe_spk_update_needed_effektiv %}{{ qnum_varmepumpe_req_spk | round(0) | int }}°C{% if skal_oppdatere_vifte_effektiv and onsket_vifte == 'high' %} høy fart{% endif %}{% else %}{{ 'Kjølemodus' if onsket_mode == 'cool' else 'Varmemodus' }}{% endif %}
          message: |-
            Pådrag: {{ varmepumpe_output_power | round(0) | int }}% {{ 'kjøling' if onsket_mode == 'cool' else 'varme' }}{% if skal_oppdatere_mode %} (fra {{ 'varme' if onsket_mode == 'cool' else 'kjøling' }}){% endif %}
            Romtemp: {{ iclimate_varme_rt_pv }}°C / Settpunkt: {{ iclimate_varme_rt_spk }}°C

            {% if onsket_mode == 'heat' -%}
            Varmepumpe (Varme):
            {% if not varmepumpe_tilgjengelig and pushover_manuell_kjoring_aktiv %}
            Varmepumpe er utilgjengelig
            {% else %}
            Settpunkt: {{ iclimate_varmepumpe_rt_spk }}°C{% if qx_varmepumpe_spk_update_needed_effektiv %} → {{ qnum_varmepumpe_req_spk }}°C{% endif %}
            Pådrag: {{ hp_norm_power_heat | round(0) | int }}% (0-100={{ (iclimate_varme_rt_max_spk_spcomfort + inum_offset_min) | round(1) }}-{{ (iclimate_varme_rt_max_spk_spcomfort + inum_offset_maks) | round(1) }})
            {% endif %}
            {{ varmepumpe_skrivgrenser_debug }}
            {%- if (iclimate_varme_styrt | string) not in ['', 'None', 'none'] %}

            Varme (climate):
            Settpunkt: {{ varme_styrt_onsket_spk | default(iclimate_varme_frost_temp) | round(1) }}°C
            Pådrag: {{ panelovn_maal_power | round(0) | int }}% (0-100={{ (iclimate_varme_rt_max_spk_spcomfort + inum_offset_min) | round(1) }}-{{ (iclimate_varme_rt_max_spk_spcomfort + inum_offset_maks) | round(1) }})
            {%- endif %}
            {%- if panelovn_switch_configured %}

            Varme (switch):
            Pådrag: {{ panelovn_maal_power | round(0) | int }}% | {{ panelovn_switch_on_slots | int }}/3 slot på
            {%- endif %}
            {%- if panelovn_prosent_output_configured %}

            Varme (prosent-utgang):
            Output: {{ panelovn_prosent_output_onsket | int }}%
            {%- endif %}
            {%- else -%}
            Varme: Av

            Varmepumpe (Kjøling):
            {% if not varmepumpe_tilgjengelig and pushover_manuell_kjoring_aktiv %}
            Varmepumpe er utilgjengelig
            {% else %}
            Settpunkt: {{ iclimate_varmepumpe_rt_spk }}°C{% if qx_varmepumpe_spk_update_needed_effektiv %} → {{ qnum_varmepumpe_req_spk }}°C{% endif %}
            Pådrag: {{ varmepumpe_output_power | round(0) | int }}% (0-100={{ (iclimate_varme_rt_max_spk_spcomfort + inum_offset_maks) | round(1) }}-{{ (iclimate_varme_rt_max_spk_spcomfort + inum_offset_min) | round(1) }})
            {% endif %}
            {{ varmepumpe_skrivgrenser_debug }}
            {%- endif %}
            {%- if skal_oppdatere_vifte %}
            Vifte: {{ onsket_vifte }}
            {%- endif %}
          destination: "{{ pushover_destination }}"
          priority: "{{ pushover_priority | int(-1) }}"
          ttl_hours: "{{ pushover_ttl_hours }}"
