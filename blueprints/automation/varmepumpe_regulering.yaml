blueprint:
  name: Varmepumpe (Rom) Robot (WebHome)
  description: >
    Regulerer varmepumpe-settpunkt lineært mellom:
      - Offset ved 0% pådrag (default -3°C fra basis)
      - Offset ved 100% pådrag (default +3°C fra basis)
    Basissettpunkt = max(rom_settpunkt, comfort_temp hvis finnes).
    Min-pådrag: (rom_settpunkt - rom_temp) * faktor, klippet 0-100,
    og brukes som minimum for pådrag slik at varmepumpa ikke "girer ned" når rommet ligger under.

    Pådrag-signal (0-100%):
    - Bruker power_percent hvis tilgjengelig.
    - Ellers, hvis regulated_target_temperature finnes, beregnes pådrag lineært fra
      (rom_settpunkt + padrag_offset_min) => 0% til (rom_settpunkt + padrag_offset_maks) => 100%.
    - Ellers brukes 50% som standard.

    Vifte-logikk styres av boolean-input: false = ingen vifteregulering, true = vifte boost.

    Kjøling (valgfri):
    Aktiver kjøling for å la varmepumpa automatisk bytte mellom heat og cool basert på
    romtemperatur relativt til rom-settpunktet.
      - Bytt til cool når rom_temp >= rom_settpunkt + kjoling_pa_delta (default 1.5°C)
      - Bytt tilbake til heat når rom_temp <= rom_settpunkt + kjoling_av_delta (default 0.5°C, hysterese)
      - Kjøling sperres alltid når rom_settpunkt < rom_comfort_settpunkt (f.eks. eco/natt-senking),
        og varmepumpa tvinges da til heat uansett romtemperatur.

    Blueprint versjon: 2026.03.06
  domain: automation
  source_url: https://github.com/surematu/WebHomeHelpFiles/blob/main/blueprints/automation/varmepumpe_regulering.yaml
  author: WebHome
  homeassistant:
    min_version: 2025.11.0

  input:
    varmepumpe:
      name: Varmepumpe
      icon: mdi:heat-pump
      collapsed: true
      input:
        pumpe_climate:
          name: Climate – varmepumpe (styring)
          selector:
            entity:
              domain: climate

        pumpe_temp_min:
          name: (Avansert) Absolutt min temperatur på varmepumpe
          default: 10
          selector:
            number:
              min: 5
              max: 25
              step: 1
              mode: box
              unit_of_measurement: "°C"

        pumpe_temp_maks:
          name: (Avansert) Absolutt maks temperatur på varmepumpe
          default: 29
          selector:
            number:
              min: 15
              max: 35
              step: 1
              mode: box
              unit_of_measurement: "°C"

    varme:
      name: Varme
      icon: mdi:fire
      collapsed: true
      input:
        rom_climate:
          name: Climate – varmeregulering i rom
          selector:
            entity:
              domain: climate

        grader_under_min:
          name: Offset ved 0% pådrag (min-settpunkt)
          description: >
            Offset i °C relativt til basis_settpunkt når effektivt_padrag=0.
            Default -3 betyr basis-3. Sett f.eks 1–4 for basis+1 til basis+4.
          default: -3
          selector:
            number:
              min: -10
              max: 10
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

        grader_over_maks:
          name: Offset ved 100% pådrag (maks-settpunkt)
          description: >
            Offset i °C relativt til basis_settpunkt når effektivt_padrag=100.
            Default 3 betyr basis+3.
          default: 3
          selector:
            number:
              min: -10
              max: 10
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

        maks_endring_per_kjoring:
          name: Maks endring per kjøring (°C)
          description: "Begrenser hvor mye varmepumpe-settpunktet kan endres per kjøring. Default 1°C."
          default: 1
          selector:
            number:
              min: 0
              max: 5
              step: 1
              mode: slider
              unit_of_measurement: "°C"

        faktor_min_padrag:
          name: Faktor for minimum pådrag
          description: >
            Min-pådrag = (rom_settpunkt - rom_temp) * faktor.
            Eksempel: rom_settpunkt=22, rom_temp=20 gir delta=2.
            Faktor=50 => min-pådrag=100.
          default: 50
          selector:
            number:
              min: 0
              max: 200
              step: 1
              mode: box

        padrag_regulated_offset_min:
          name: Pådrag fra regulated_target – offset minimum (°C)
          description: >
            Brukes kun når regulated_target_temperature finnes og power_percent ikke finnes.
            Offset relativt til rom_settpunkt som tilsvarer 0% pådrag.
            Eksempel: -1 betyr at regulated_target = rom_settpunkt - 1 => 0% pådrag.
          default: -1
          selector:
            number:
              min: -5
              max: 0
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

        padrag_regulated_offset_maks:
          name: Pådrag fra regulated_target – offset maksimum (°C)
          description: >
            Brukes kun når regulated_target_temperature finnes og power_percent ikke finnes.
            Offset relativt til rom_settpunkt som tilsvarer 100% pådrag.
            Eksempel: 1 betyr at regulated_target = rom_settpunkt + 1 => 100% pådrag.
          default: 1
          selector:
            number:
              min: 0
              max: 5
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

    vifte:
      name: Vifte
      icon: mdi:fan
      collapsed: true
      input:
        vifte_boost:
          name: Vifte boost (på/av)
          description: "false = ingen vifteregulering. true = vifte boost ved høyt pådrag (bruker viftelogikk)."
          default: false
          selector:
            boolean: {}

    kjoling:
      name: Kjøling
      icon: mdi:snowflake
      collapsed: true
      input:
        kjoling_aktiv:
          name: Aktiver kjøling (valgfri)
          description: >
            Hvis aktivert, kan varmepumpa automatisk bytte mellom heat og cool
            basert på romtemperatur relativt til rom-settpunktet.
            Hvis deaktivert, brukes alltid heat-modus (eksisterende oppførsel).
          default: false
          selector:
            boolean: {}

        kjoling_pa_delta:
          name: Kjøling PÅ – delta over settpunkt (°C)
          description: >
            Setter hvac_mode til cool når rom_temp >= rom_settpunkt + denne verdien.
            Default 1.5°C.
          default: 1.5
          selector:
            number:
              min: 0.5
              max: 5
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

        kjoling_av_delta:
          name: Kjøling AV – delta over settpunkt (°C) (hysterese)
          description: >
            Setter hvac_mode tilbake til heat når rom_temp <= rom_settpunkt + denne verdien.
            Må være lavere enn kjoling_pa_delta for å unngå modus-flapping. Default 0.5°C.
          default: 0.5
          selector:
            number:
              min: 0
              max: 3
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

mode: restart

triggers:
  - trigger: time_pattern
    minutes: "/10"

  - trigger: state
    entity_id: !input rom_climate
    attribute: temperature

actions:
  - delay:
      seconds: 5

  # Steg 0: inputs
  - variables:
      rom_e: !input rom_climate
      pumpe_e: !input pumpe_climate
      offset_min: !input grader_under_min
      offset_maks: !input grader_over_maks
      max_step: !input maks_endring_per_kjoring
      faktor_min: !input faktor_min_padrag
      vifte_aktiv: !input vifte_boost
      padrag_reg_offset_min: !input padrag_regulated_offset_min
      padrag_reg_offset_maks: !input padrag_regulated_offset_maks
      pumpe_abs_min: !input pumpe_temp_min
      pumpe_abs_maks: !input pumpe_temp_maks
      kjoling_aktiv: !input kjoling_aktiv
      kjoling_pa_delta: !input kjoling_pa_delta
      kjoling_av_delta: !input kjoling_av_delta

  # Steg 1A: les råverdier + attributt-eksistens
  - variables:
      har_regulated_target: "{{ state_attr(rom_e, 'regulated_target_temperature') is not none }}"
      har_power_percent: "{{ state_attr(rom_e, 'power_percent') is not none }}"
      rom_settpunkt: "{{ state_attr(rom_e, 'temperature') | float(20) }}"
      rom_temp: >-
        {{ state_attr(rom_e, 'current_temperature')
           | float(state_attr(rom_e, 'temperature') | float(20)) }}
      rom_preset_mode: "{{ (state_attr(rom_e, 'preset_mode') | string | lower) }}"
      pumpe_settpunkt_na_rundet: "{{ (state_attr(pumpe_e, 'temperature') | float(0)) | round(0) | int }}"
      pumpe_vifte_na: "{{ (state_attr(pumpe_e, 'fan_mode') | string | lower) }}"
      pumpe_mode_na: "{{ states(pumpe_e) | string | lower }}"

  # Steg 1B: beregn padrag_0_100 (0–100% pådrag-signal)
  # Case A: power_percent finnes => bruk direkte
  # Case B: regulated_target_temperature finnes => beregn lineært fra offset-range
  # Case C: ingen => bruk 50%
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ har_power_percent }}"
        sequence:
          - variables:
              padrag_0_100: "{{ state_attr(rom_e, 'power_percent') | float(50) }}"

      - conditions:
          - condition: template
            value_template: "{{ har_regulated_target }}"
        sequence:
          - variables:
              padrag_0_100: >-
                {% set rt = state_attr(rom_e, 'regulated_target_temperature') | float(rom_settpunkt) %}
                {% set omin = padrag_reg_offset_min | float(-1) %}
                {% set omax = padrag_reg_offset_maks | float(1) %}
                {% if omin == omax %}
                  50
                {% else %}
                  {% set raw = (rt - (rom_settpunkt + omin)) / (omax - omin) * 100 %}
                  {{ [[raw, 0] | max, 100] | min }}
                {% endif %}

    default:
      - variables:
          padrag_0_100: 50

  # Steg 2: comfort (om finnes) + basissettpunkt
  - variables:
      rom_comfort_settpunkt: >-
        {% set presets = state_attr(rom_e, 'preset_temperatures') %}
        {% if presets is mapping and 'comfort_temp' in presets %}
          {{ presets['comfort_temp'] | float(rom_settpunkt) }}
        {% else %}
          {{ rom_settpunkt }}
        {% endif %}
      basis_settpunkt: "{{ [rom_settpunkt, rom_comfort_settpunkt] | max }}"

  # Steg 3: min-pådrag (rom_settpunkt som referanse) + effektivt pådrag
  - variables:
      temp_delta_under_setp: "{{ (rom_settpunkt - rom_temp) | float(0) }}"
      min_padrag_beregnet: >-
        {% set delta = temp_delta_under_setp | float(0) %}
        {% set v = (delta if delta > 0 else 0) * (faktor_min | float(0)) %}
        {{ [v, 100] | min }}
      effektivt_padrag: >-
        {% set p = padrag_0_100 | float(50) %}
        {% set m = min_padrag_beregnet | float(0) %}
        {{ [ [p, m] | max, 100 ] | min }}

  # Steg 4: beregn ønsket settpunkt (power-kurve med effektivt_padrag)
  - variables:
      pumpe_target_raw: >-
        {% set p = effektivt_padrag | float(0) %}
        {% set omin = offset_min | float(0) %}
        {% set omax = offset_maks | float(0) %}
        {{ (basis_settpunkt | float(0)) + omin + (p / 100) * (omax - omin) }}
      pumpe_target_klippet: >-
        {% set t = pumpe_target_raw | float(basis_settpunkt) %}
        {{ [ [t, pumpe_abs_min | float(10)] | max, pumpe_abs_maks | float(29) ] | min }}
      pumpe_target_rundet: "{{ (pumpe_target_klippet | float) | round(0) | int }}"

      # RAMP: maks endring per kjøring
      pumpe_target_rampet: >-
        {% set ønsket = pumpe_target_rundet | int %}
        {% set nå = pumpe_settpunkt_na_rundet | int %}
        {% set step = max_step | int %}
        {% if step <= 0 %}
          {{ ønsket }}
        {% else %}
          {{ [nå - step, [ønsket, nå + step] | min] | max }}
        {% endif %}
      skal_oppdatere_temp: "{{ (pumpe_target_rampet | int) != (pumpe_settpunkt_na_rundet | int) }}"

  # Steg 5: vifte (valgfri) – vifte_aktiv er satt i Steg 0
  - if:
      - condition: template
        value_template: "{{ vifte_aktiv }}"
    then:
      - variables:
          pumpe_vifte_stottes: "{{ state_attr(pumpe_e, 'fan_modes') is not none }}"
          onsket_vifte: >-
            {% if not pumpe_vifte_stottes %}
              {{ pumpe_vifte_na }}
            {% elif rom_preset_mode == 'frost' %}
              high
            {% elif (effektivt_padrag | float(0)) < 20 %}
              medium
            {% elif (effektivt_padrag | float(0)) > 50 %}
              high
            {% else %}
              {{ pumpe_vifte_na }}
            {% endif %}
          skal_oppdatere_vifte: "{{ pumpe_vifte_stottes and (onsket_vifte | string) != (pumpe_vifte_na | string) }}"
    else:
      - variables:
          onsket_vifte: "{{ pumpe_vifte_na }}"
          skal_oppdatere_vifte: false

  # Steg 6: kjøling (valgfri)
  - if:
      - condition: template
        value_template: "{{ kjoling_aktiv }}"
    then:
      - variables:
          WantCool_SetpointComfOrHihger: >-
            {% set setp = rom_settpunkt | float(0) %}
            {% set comfort = rom_comfort_settpunkt | float(setp) %}
            {{ setp >= comfort }}
          WantCoolCauseHightTemp: >-
            {% set delta_on = kjoling_pa_delta | float(1.5) %}
            {% set delta_off = kjoling_av_delta | float(0.5) %}
            {% set temp = rom_temp | float(0) %}
            {% set setp = rom_settpunkt | float(0) %}
            {{ (temp > setp + delta_off) if pumpe_mode_na == 'cool' else (temp >= setp + delta_on) }}
      - variables:
          onsket_mode: "{{ 'cool' if (WantCool_SetpointComfOrHihger and WantCoolCauseHightTemp) else 'heat' }}"
          skal_oppdatere_mode: "{{ (onsket_mode | string | trim) != (pumpe_mode_na | string | trim) }}"
    else:
      - variables:
          onsket_mode: heat
          skal_oppdatere_mode: "{{ pumpe_mode_na != 'heat' }}"

  # Steg 7: sett verdier kun ved behov
  - if:
      - condition: or
        conditions:
          - condition: template
            value_template: "{{ skal_oppdatere_temp }}"
          - condition: template
            value_template: "{{ skal_oppdatere_vifte }}"
          - condition: template
            value_template: "{{ skal_oppdatere_mode }}"
    then:
      - if:
          - condition: template
            value_template: "{{ skal_oppdatere_mode }}"
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input pumpe_climate
            data:
              hvac_mode: "{{ onsket_mode }}"

      - if:
          - condition: template
            value_template: "{{ skal_oppdatere_temp }}"
        then:
          - action: climate.set_temperature
            target:
              entity_id: !input pumpe_climate
            data:
              hvac_mode: "{{ onsket_mode }}"
              temperature: "{{ pumpe_target_rampet }}"

      - if:
          - condition: template
            value_template: "{{ skal_oppdatere_vifte }}"
        then:
          - action: climate.set_fan_mode
            target:
              entity_id: !input pumpe_climate
            data:
              fan_mode: "{{ onsket_vifte }}"
