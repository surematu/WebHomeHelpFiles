blueprint:
  name: Varmepumpe (Rom) Robot (WebHome Automation)
  description: >
    Regulerer varmepumpe-settpunkt lineært mellom:
      - Offset ved 0% pådrag (default -3°C fra basis)
      - Offset ved 100% pådrag (default +3°C fra basis)
    Basissettpunkt = max(iclimate_varme_rt_spk, comfort_temp hvis finnes).
    Min-pådrag: (iclimate_varme_rt_spk - iclimate_varme_rt_pv) * faktor, klippet 0-100,
    og brukes som minimum for pådrag slik at varmepumpa ikke "girer ned" når rommet ligger under.

    Pådrag-signal (0-100%):
    - Bruker power_percent hvis tilgjengelig.
    - Ellers, hvis regulated_target_temperature finnes, beregnes pådrag lineært fra
      (iclimate_varme_rt_spk + padrag_offset_min) => 0% til (iclimate_varme_rt_spk + padrag_offset_maks) => 100%.
    - Ellers brukes 50% som standard.

    Vifte-logikk styres av boolean-input: false = ingen vifteregulering, true = vifte boost.

    Kjøling (valgfri):
    Aktiver kjøling for å la varmepumpa automatisk bytte mellom heat og cool.
      - Ved gyldig driftsmodus styrer VINTER/SOMMER default-modus.
      - Override aktiveres kun ved for kaldt/for varmt avvik fra settpunkt.
      - Hysterese brukes for å skru override AV igjen, for å unngå modus-flapping.
      - Ugyldig driftsmodus: varmepumpa holdes i heat-modus.
      - Kjøling sperres alltid når iclimate_varme_rt_spk < iclimate_varme_rt_sp_comfort_spkifnocomfort (f.eks. eco/natt-senking),
        og varmepumpa tvinges da til heat uansett romtemperatur.

    Avrunding av settpunkt:
    Betinget på inum_max_step: heltall-steg (1, 2, 3, …) gir alltid heltalls-settpunkt;
    halvt steg (0.5, 1.5, 2.5, …) tillater halvgrads-verdier (f.eks. 22.5).

    Dokumentasjon/wiki:
    https://github.com/surematu/WebHomeHelpFiles/blob/main/README_varmepumpe_regulering.md

    Blueprint versjon: 2026.07.06
  domain: automation
  source_url: https://github.com/surematu/WebHomeHelpFiles/blob/main/blueprints/automation/varmepumpe_regulering.yaml
  author: WebHome
  homeassistant:
    min_version: 2025.11.0

  input:
    varme:
      name: Varme
      icon: mdi:fire
      collapsed: true
      input:
        rom_climate:
          name: Climate – varmeregulering i rom
          selector:
            entity:
              domain: climate

        padrag_regulated_offset_min:
          name: 0% pådrag hvis regulatedSetpoint er så mange grader i forhold til settpunkt varme (padrag_regulated_offset_min)
          description: >
            Brukes kun når regulated_target_temperature finnes og power_percent ikke finnes.
            Offset relativt til iclimate_varme_rt_spk som tilsvarer 0% pådrag.
            Eksempel: -1 betyr at regulated_target = iclimate_varme_rt_spk - 1 => 0% pådrag.
          default: -1
          selector:
            number:
              min: -5
              max: 0
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

        padrag_regulated_offset_maks:
          name: 100% pådrag hvis regulatedSetpoint er så mange grader i forhold til settpunkt varme (padrag_regulated_offset_maks)
          description: >
            Brukes kun når regulated_target_temperature finnes og power_percent ikke finnes.
            Offset relativt til iclimate_varme_rt_spk som tilsvarer 100% pådrag.
            Eksempel: 1 betyr at regulated_target = iclimate_varme_rt_spk + 1 => 100% pådrag.
          default: 1
          selector:
            number:
              min: 0
              max: 5
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

    varmepumpe:
      name: Varmepumpe
      icon: mdi:heat-pump
      collapsed: true
      input:
        pumpe_climate:
          name: Climate – varmepumpe (styring)
          selector:
            entity:
              domain: climate

        maks_endring_per_kjoring:
          name: Maks endring per kjøring (°C)
          description: "Begrenser hvor mye varmepumpe-settpunktet kan endres per kjøring. Default 1°C."
          default: 1
          selector:
            number:
              min: 0
              max: 5
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

        grader_under_min:
          name: Grader i forhold til settpunkt ved 0% pådrag (grader_under_min)
          description: >
            Offset i °C relativt til iclimate_varme_rt_max_spk_spcomfort når varmepumpe_output_power=0.
            Default -3 betyr basis-3. Sett f.eks 1–4 for basis+1 til basis+4.
          default: -3
          selector:
            number:
              min: -10
              max: 10
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

        grader_over_maks:
          name: Grader i forhold til settpunkt ved 100% pådrag (grader_over_maks)
          description: >
            Offset i °C relativt til iclimate_varme_rt_max_spk_spcomfort når varmepumpe_output_power=100.
            Default 3 betyr basis+3.
          default: 3
          selector:
            number:
              min: -10
              max: 10
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

    varmepumpe_ava:
      name: Varmepumpe (Avansert)
      icon: mdi:heat-pump
      collapsed: true
      input:
        min_padrag_eco:
          name: Minimum pådrag ved preset eco (%)
          description: >
            Setter et minimum pådrag (0–100%) når rom-climate har preset eco.
            Default 0 gir eksisterende oppførsel uendret.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider

        min_padrag_comfort:
          name: Minimum pådrag ved preset comfort (%)
          description: >
            Setter et minimum pådrag (0–100%) når rom-climate har preset comfort.
            Default 0 gir eksisterende oppførsel uendret. 
            Hvis vifte boost funksjon er aktiv: Burde settes lik eller under 30%
            for å sørge for at funksjon kan skru av vifte.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider

        min_padrag_boost:
          name: Minimum pådrag ved preset boost (%)
          description: >
            Setter et minimum pådrag (0–100%) når rom-climate har preset boost.
            Default 0 gir eksisterende oppførsel uendret. 
            Hvis vifte boost funksjon er aktiv: Hvis denne settes over
            30% vil vifte boost alltid være på ved boost modus.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: slider
      
        pumpe_temp_min:
          name: Absolutt min temperatur på varmepumpe
          default: 10
          selector:
            number:
              min: 5
              max: 25
              step: 1
              mode: box
              unit_of_measurement: "°C"

        pumpe_temp_maks:
          name: Absolutt maks temperatur på varmepumpe
          default: 29
          selector:
            number:
              min: 15
              max: 35
              step: 1
              mode: box
              unit_of_measurement: "°C"

        faktor_min_padrag:
          name: Faktor for minimum pådrag
          description: >
            Min-pådrag = (iclimate_varme_rt_spk - iclimate_varme_rt_pv) * faktor.
            Eksempel: iclimate_varme_rt_spk=22, iclimate_varme_rt_pv=20 gir delta=2.
            Faktor=50 => min-pådrag=100.
          default: 50
          selector:
            number:
              min: 0
              max: 200
              step: 1
              mode: box

    vifte:
      name: Vifte
      icon: mdi:fan
      collapsed: true
      input:
        vifte_boost:
          name: Vifte boost (på/av)
          description: "false = ingen vifteregulering. true = vifte boost ved høyt pådrag (bruker viftelogikk)."
          default: false
          selector:
            boolean: {}

    kjoling:
      name: Kjøling
      icon: mdi:snowflake
      collapsed: true
      input:
        ix_kjoling_aktiv:
          name: Aktiver kjøling (valgfri)
          description: >
            Hvis aktivert, kan varmepumpa automatisk bytte mellom heat og cool
            basert på romtemperatur relativt til rom-settpunktet.
            Hvis deaktivert, brukes alltid heat-modus (eksisterende oppførsel).
          default: false
          selector:
            boolean: {}

        inum_kjoling_sommer_kaldt_grense:
          name: SOMMER – tving varme når romtemp er så mange grader under settpunkt (°C)
          description: >
            I SOMMER-modus: tving heat-modus når iclimate_varme_rt_pv < iclimate_varme_rt_spk − denne verdien.
            Sikrer at rommet ikke blir for kaldt selv om sommermodus foretrekker kjøling.
            Default 2°C.
          default: 2
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

        inum_kjoling_av_delta_sommer:
          name: SOMMER - Hysterese varme av
          description: >
            SOMMER: tvungen varme slås av når romtemp >= settpunkt + hysterese.
            Default 0.5°C.
          default: 0.5
          selector:
            number:
              min: 0
              max: 3
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

        inum_kjoling_vinter_varmt_grense:
          name: VINTER – tillat kjøling når romtemp er så mange grader over settpunkt (°C)
          description: >
            I VINTER-modus: tillat cool-modus som nødoverkobling når iclimate_varme_rt_pv >= iclimate_varme_rt_spk + denne verdien.
            Sikrer at rommet ikke blir for varmt selv om vintermodus foretrekker varme.
            Default 2°C.
          default: 2
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

        inum_kjoling_av_delta_vinter:
          name: VINTER - Hysterese kjøling av
          description: >
            VINTER: tvungen kjøling slås av når romtemp <= settpunkt - hysterese.
            Default 0.5°C.
          default: 0.5
          selector:
            number:
              min: 0
              max: 3
              step: 0.5
              mode: slider
              unit_of_measurement: "°C"

mode: restart

triggers:
  - trigger: time_pattern
    minutes: "/10"

  - trigger: state
    entity_id: !input rom_climate
    attribute: temperature

actions:
  - delay:
      seconds: 5

  # Steg 0: inputs
  - variables:
      iclimate_varme: !input rom_climate
      iclimate_varmepumpe: !input pumpe_climate
      inum_offset_min: !input grader_under_min
      inum_offset_maks: !input grader_over_maks
      inum_max_step: !input maks_endring_per_kjoring
      inum_faktor_min: !input faktor_min_padrag
      ix_vifte_aktiv: !input vifte_boost
      padrag_reg_offset_min: !input padrag_regulated_offset_min
      padrag_reg_offset_maks: !input padrag_regulated_offset_maks
      inum_varmepumpe_abs_min: !input pumpe_temp_min
      inum_varmepumpe_abs_max: !input pumpe_temp_maks
      ix_kjoling_aktiv: !input ix_kjoling_aktiv
      inum_kjoling_av_delta_sommer: !input inum_kjoling_av_delta_sommer
      inum_kjoling_av_delta_vinter: !input inum_kjoling_av_delta_vinter
      inum_kjoling_sommer_kaldt_grense: !input inum_kjoling_sommer_kaldt_grense
      inum_kjoling_vinter_varmt_grense: !input inum_kjoling_vinter_varmt_grense
      inum_min_padrag_comfort: !input min_padrag_comfort
      inum_min_padrag_eco: !input min_padrag_eco
      inum_min_padrag_boost: !input min_padrag_boost

  # Steg 1: les råverdier + attributt-eksistens
  - variables:
      iclimate_varme_rt_pv: >-
        {{ state_attr(iclimate_varme, 'current_temperature')
           | float(state_attr(iclimate_varme, 'temperature') | float(20)) }}
      iclimate_varme_rt_spk: "{{ state_attr(iclimate_varme, 'temperature') | float(20) }}"
      iclimate_varme_rt_pv_below_spk: "{{ (iclimate_varme_rt_spk - iclimate_varme_rt_pv) | float(0) }}"
      iclimate_varme_rt_sp_comfort_spkifnocomfort: >-
        {% set presets = state_attr(iclimate_varme, 'preset_temperatures') %}
        {% if presets is mapping and 'comfort_temp' in presets %}
          {{ presets['comfort_temp'] | float(iclimate_varme_rt_spk) }}
        {% else %}
          {{ iclimate_varme_rt_spk }}
        {% endif %}
      iclimate_varme_presetmode: "{{ (state_attr(iclimate_varme, 'preset_mode') | string | lower) }}"
      iclimate_varme_has_regulated_target: "{{ state_attr(iclimate_varme, 'regulated_target_temperature') is not none }}"
      iclimate_varme_has_power_percent: "{{ state_attr(iclimate_varme, 'power_percent') is not none }}"
      # float: bevarer 0.5-stegs presisjon fra climate-enheten (| int ville miste halve grader)
      iclimate_varmepumpe_rt_spk: "{{ state_attr(iclimate_varmepumpe, 'temperature') | float(0) }}"
      iclimate_varmepumpe_mode: "{{ states(iclimate_varmepumpe) | string | lower }}"
      iclimate_varmepumpe_fanmode: "{{ (state_attr(iclimate_varmepumpe, 'fan_mode') | string | lower) }}"

  # Steg 2: Beregn hvor mye pådrag vi har på varmekilden
  - choose:
      # Case A: power_percent finnes => bruk direkte
      - conditions:
          - condition: template
            value_template: "{{ iclimate_varme_has_power_percent }}"
        sequence:
          - variables:
              varme_cur_power_calculated: "{{ state_attr(iclimate_varme, 'power_percent') | float(50) }}"

      # Case B: regulated_target_temperature finnes => beregn lineært fra offset-range
      - conditions:
          - condition: template
            value_template: "{{ iclimate_varme_has_regulated_target }}"
        sequence:
          - variables:
              varme_cur_power_calculated: >-
                {% set rt = state_attr(iclimate_varme, 'regulated_target_temperature') | float(iclimate_varme_rt_spk) %}
                {% set omin = padrag_reg_offset_min | float(-1) %}
                {% set omax = padrag_reg_offset_maks | float(1) %}
                {% if omin == omax %}
                  50
                {% else %}
                  {% set raw = (rt - (iclimate_varme_rt_spk + omin)) / (omax - omin) * 100 %}
                  {{ [[raw, 0] | max, 100] | min }}
                {% endif %}
    # Case C: ingen => bruk 50%
    default:
      - variables:
          varme_cur_power_calculated: 50

  # Steg 3: min-pådrag (iclimate_varme_rt_spk som referanse) + effektivt pådrag
  - variables:
      varmepumpe_output_power_min_cause_min_faktor: >-
        {% set pv_below_spk = iclimate_varme_rt_pv_below_spk | float(0) %}
        {% set v = (pv_below_spk if pv_below_spk > 0 else 0) * (inum_faktor_min | float(0)) %}
        {{ [v, 100] | min }}
      varmepumpe_output_power_min_cause_mode: >-
        {% set pm = iclimate_varme_presetmode | string | lower %}
        {% if pm == 'comfort' %}
          {{ inum_min_padrag_comfort | float(0) }}
        {% elif pm == 'eco' %}
          {{ inum_min_padrag_eco | float(0) }}
        {% elif pm == 'boost' %}
          {{ inum_min_padrag_boost | float(0) }}
        {% else %}
          0
        {% endif %}
      varmepumpe_output_power: >-
        {% set p = varme_cur_power_calculated | float(50) %}
        {% set m1 = varmepumpe_output_power_min_cause_min_faktor | float(0) %}
        {% set m2 = varmepumpe_output_power_min_cause_mode | float(0) %}
        {{ [ [p, m1, m2] | max, 100 ] | min }}

  # Steg 4: beregn ønsket settpunkt (power-kurve med varmepumpe_output_power)
  - variables:
      iclimate_varme_rt_max_spk_spcomfort: "{{ [iclimate_varme_rt_spk, iclimate_varme_rt_sp_comfort_spkifnocomfort] | max }}"
      varmepumpe_req_spk_raw: >-
        {% set p = varmepumpe_output_power | float(0) %}
        {% set omin = inum_offset_min | float(0) %}
        {% set omax = inum_offset_maks | float(0) %}
        {{ (iclimate_varme_rt_max_spk_spcomfort | float(0)) + omin + (p / 100) * (omax - omin) }}
      varmepumpe_req_spk_incl_abs_limit: >-
        {% set t = varmepumpe_req_spk_raw | float(iclimate_varme_rt_max_spk_spcomfort) %}
        {{ [ [t, inum_varmepumpe_abs_min | float(10)] | max, inum_varmepumpe_abs_max | float(29) ] | min }}
      # Mellomsteg: rundes til nærmeste halve (20.5, 20 osv.).
      # Endelig avrunding skjer i qnum_varmepumpe_req_spk basert på inum_max_step.
      varmepumpe_req_spk_rounded_nearest_half: "{{ ((varmepumpe_req_spk_incl_abs_limit | float(0)) * 2) | round(0) / 2 }}"

      # RAMP + AVRUNDING: betinget på inum_max_step
      # - Heltall-steg (1, 2, 3, …): ønsket og rampet verdi avrundes til nærmeste heltall
      # - Halvt steg (0.5, 1.5, 2.5, …): beholder nærmeste-0.5-avrunding
      # Float-math beholdes for selve ramp-beregningen slik at halve-stegs-presisjon bevares
      qnum_varmepumpe_req_spk: >-
        {% set ønsket_half = varmepumpe_req_spk_rounded_nearest_half | float %}
        {% set nå = iclimate_varmepumpe_rt_spk | float %}
        {% set step = inum_max_step | float %}
        {% set step_is_whole = step == (step | int | float) %}
        {% set ønsket = (ønsket_half | round(0) | float) if step_is_whole else ønsket_half %}
        {% set ramped = ønsket if step <= 0 else ([nå - step, [ønsket, nå + step] | min] | max) %}
        {{ (ramped | round(0) | float) if step_is_whole else ((ramped * 2) | round(0) / 2) }}
      # Float-sammenligning: fanger opp halvgrads- og heltals-endringer
      qx_varmepumpe_spk_update_needed: "{{ (qnum_varmepumpe_req_spk | float) != (iclimate_varmepumpe_rt_spk | float) }}"

  # Steg 5: vifte (valgfri) – ix_vifte_aktiv er satt i Steg 0
  - if:
      - condition: template
        value_template: "{{ ix_vifte_aktiv }}"
    then:
      - variables:
          pumpe_vifte_stottes: "{{ state_attr(iclimate_varmepumpe, 'fan_modes') is not none }}"
          onsket_vifte: >-
            {% if not pumpe_vifte_stottes %}
              {{ iclimate_varmepumpe_fanmode }}
            {% elif iclimate_varme_presetmode == 'frost' %}
              high
            {% elif (varmepumpe_output_power | float(0)) <= 30 %}
              medium
            {% elif (varmepumpe_output_power | float(0)) > 50 %}
              high
            {% else %}
              {{ iclimate_varmepumpe_fanmode }}
            {% endif %}
          skal_oppdatere_vifte: "{{ pumpe_vifte_stottes and (onsket_vifte | string) != (iclimate_varmepumpe_fanmode | string) }}"
    else:
      - variables:
          onsket_vifte: "{{ iclimate_varmepumpe_fanmode }}"
          skal_oppdatere_vifte: false

  # Steg 6: kjøling (valgfri) + driftsmodus-default med override-hysterese
  - if:
      - condition: template
        value_template: "{{ ix_kjoling_aktiv }}"
    then:
      - variables:
          drift_modus_raw: "{{ states('input_select.driftsmodus_vinter_sommer') }}"
          drift_is_sommer: "{{ drift_modus_raw == 'SOMMER' }}"
          drift_is_vinter: "{{ drift_modus_raw == 'VINTER' }}"
          drift_available: "{{ drift_modus_raw in ['SOMMER', 'VINTER'] }}"

      - variables:
          drift_hysterese_sommer: "{{ inum_kjoling_av_delta_sommer | float(0.5) }}"
          drift_hysterese_vinter: "{{ inum_kjoling_av_delta_vinter | float(0.5) }}"
          summer_force_heat_on: >-
            {% set temp = iclimate_varme_rt_pv | float(0) %}
            {% set setp = iclimate_varme_rt_spk | float(0) %}
            {% set grense = inum_kjoling_sommer_kaldt_grense | float(2) %}
            {{ temp < (setp - grense) }}
          summer_force_heat_keep: >-
            {% set temp = iclimate_varme_rt_pv | float(0) %}
            {% set setp = iclimate_varme_rt_spk | float(0) %}
            {% set hyst = drift_hysterese_sommer | float(0.5) %}
            {{ (iclimate_varmepumpe_mode == 'heat') and (temp < (setp + hyst)) }}
          winter_allow_cool_on: >-
            {% set temp = iclimate_varme_rt_pv | float(0) %}
            {% set setp = iclimate_varme_rt_spk | float(0) %}
            {% set grense = inum_kjoling_vinter_varmt_grense | float(2) %}
            {{ temp > (setp + grense) }}
          winter_allow_cool_keep: >-
            {% set temp = iclimate_varme_rt_pv | float(0) %}
            {% set setp = iclimate_varme_rt_spk | float(0) %}
            {% set hyst = drift_hysterese_vinter | float(0.5) %}
            {{ (iclimate_varmepumpe_mode == 'cool') and (temp > (setp - hyst)) }}
      - variables:
          WantCool_SetpointComfOrHihger: >-
            {% set setp = iclimate_varme_rt_spk | float(0) %}
            {% set comfort = iclimate_varme_rt_sp_comfort_spkifnocomfort | float(setp) %}
            {{ setp >= comfort }}
      - variables:
          onsket_mode: >-
            {% if not drift_available %}
              heat
            {% elif drift_is_sommer %}
              {% if not WantCool_SetpointComfOrHihger %}
                heat
              {% elif summer_force_heat_on or summer_force_heat_keep %}
                heat
              {% else %}
                cool
              {% endif %}
            {% else %}
              {% if not WantCool_SetpointComfOrHihger %}
                heat
              {% elif winter_allow_cool_on or winter_allow_cool_keep %}
                cool
              {% else %}
                heat
              {% endif %}
            {% endif %}
          skal_oppdatere_mode: "{{ (onsket_mode | string | trim) != (iclimate_varmepumpe_mode | string | trim) }}"
    else:
      - variables:
          onsket_mode: heat
          skal_oppdatere_mode: "{{ iclimate_varmepumpe_mode != 'heat' }}"

  # Steg 7: sett verdier kun ved behov
  - if:
      - condition: or
        conditions:
          - condition: template
            value_template: "{{ qx_varmepumpe_spk_update_needed }}"
          - condition: template
            value_template: "{{ skal_oppdatere_vifte }}"
          - condition: template
            value_template: "{{ skal_oppdatere_mode }}"
    then:
      - if:
          - condition: template
            value_template: "{{ skal_oppdatere_mode }}"
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input pumpe_climate
            data:
              hvac_mode: "{{ onsket_mode }}"

      - if:
          - condition: template
            value_template: "{{ qx_varmepumpe_spk_update_needed }}"
        then:
          - action: climate.set_temperature
            target:
              entity_id: !input pumpe_climate
            data:
              hvac_mode: "{{ onsket_mode }}"
              temperature: "{{ qnum_varmepumpe_req_spk }}"

      - if:
          - condition: template
            value_template: "{{ skal_oppdatere_vifte }}"
        then:
          - action: climate.set_fan_mode
            target:
              entity_id: !input pumpe_climate
            data:
              fan_mode: "{{ onsket_vifte }}"
