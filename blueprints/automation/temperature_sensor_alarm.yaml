blueprint:
  name: Temperature Sensor Alarm (WebHome Automation)
  description: >
    Sends a notification if a temperature sensor:
      - goes above limit 1 for 15 minutes
      - goes above limit 2 for 60 minutes
      - goes 'unknown' for 15 minutes

    Blueprint versjon: 2026.08.00
    2026.07.01
  domain: automation
  source_url: https://github.com/surematu/WebHomeHelpFiles/blob/main/blueprints/automation/temperature_sensor_alarm.yaml
  author: WebHome
  homeassistant:
    min_version: 2025.11.0

  input:
    temp_sensor:
      name: Temperature Sensor
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature

    custom_sensor_name:
      name: Custom Sensor Name
      description: Override default name in the alert title (optional)
      default: ""
      selector:
        text: {}

    pushover_destination:
      name: Pushover destination
      description: Mottakergruppe i script.varsel_pushover_send_melding_webhome
      default: pushover
      selector:
        text: {}

    pushover_priority:
      name: Pushover priority
      description: Prioritet brukt for varsling
      default: 0
      selector:
        number:
          min: -2
          max: 2
          step: 1
          mode: box

    pushover_ttl:
      name: Levetid varsel (timer)
      description: Hvor lenge skal varslet være synlig før det forsvinner?
      default: 168
      selector:
        number:
          min: 0
          max: 168
          step: 1
          unit_of_measurement: h
          mode: box

    alarm_1_threshold:
      name: "Alarm 1: Temp above"
      default: -5
      selector:
        number:
          min: -30
          max: 20
          step: 1
          unit_of_measurement: "°C"

    alarm_2_threshold:
      name: "Alarm 2: Temp above"
      default: -15
      selector:
        number:
          min: -30
          max: 20
          step: 1
          unit_of_measurement: "°C"

mode: restart

triggers:
  - trigger: numeric_state
    entity_id: !input temp_sensor
    above: !input alarm_1_threshold
    for:
      minutes: 15
    id: alarm_1

  - trigger: numeric_state
    entity_id: !input temp_sensor
    above: !input alarm_2_threshold
    for:
      minutes: 60
    id: alarm_2

  - trigger: state
    entity_id: !input temp_sensor
    to: "unknown"
    for:
      minutes: 15
    id: unknown

actions:
  - variables:
      custom_sensor_name: !input custom_sensor_name
      sensor_name: >
        {% if custom_sensor_name | trim != "" %}
          {{ custom_sensor_name }}
        {% else %}
          {{ state_attr(trigger.entity_id, 'friendly_name') or trigger.entity_id }}
        {% endif %}
      pushover_destination: !input pushover_destination
      pushover_priority: !input pushover_priority
      pushover_ttl: !input pushover_ttl
      pushover_ttl_seconds: "{{ pushover_ttl | float(168) * 3600 | int }}"
      alarm_1_threshold: !input alarm_1_threshold
      alarm_2_threshold: !input alarm_2_threshold

  - action: script.varsel_pushover_send_melding_webhome
    data:
      title: "🧊 {{ sensor_name }} 🧊"
      message: >
        {% if trigger.id == 'alarm_1' %}
          Temp over {{ alarm_1_threshold }} °C for 15m.
        {% elif trigger.id == 'alarm_2' %}
          Temp over {{ alarm_2_threshold }} °C for 60m.
        {% elif trigger.id == 'unknown' %}
          Temp ukjent for 15m.
        {% endif %}
      destination: "{{ pushover_destination }}"
      priority: "{{ pushover_priority | int(0) }}"
      ttl: "{{ pushover_ttl_seconds }}"
